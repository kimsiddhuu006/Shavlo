      function syncHash(str) {
        let h1 = 0xdeadbeef ^ str.length;
        let h2 = 0x41c6ce57 ^ str.length;
        for (let i = 0; i < str.length; i++) {
          const ch = str.charCodeAt(i);
          h1 = Math.imul(h1 ^ ch, 2654435761);
          h2 = Math.imul(h2 ^ ch, 1597334677);
        }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
        return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).toUpperCase().padStart(12, '0');
      }

      function hashPin(pin) {
        let h = syncHash('shavlo-pin-v5:' + String(pin || ''));

        return 'PIN2_' + h;

      function verifyPinHash(pin, stored) {
        const s = String(stored || '');
        if (!s) return false;

      async function deriveSeedIdentity(words) {
        const normalized = words.map(w => w.trim().toLowerCase()).join(' ');
        try {
          if (window.crypto && window.crypto.subtle) {
            const data = new TextEncoder().encode('samvaad-vault-v4:' + normalized);
            const buf = await window.crypto.subtle.digest('SHA-256', data);
            const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
            const code9 = String((parseInt(hex.slice(0, 12), 16) % 900000000) + 100000000);
            return {
              vaultId: hex.slice(0, 16),
              friendCode: code9
            };
          }
        } catch (e) { /* fallback */ }
        const h = syncHash(normalized);
        const h2 = syncHash(normalized + ':shavlo-fc-2');
        const hex32 = (h + h2 + h).replace(/[^A-F0-9]/g, 'A').slice(0, 32);
        const code9Fb = String((parseInt(hex32.slice(0, 12), 16) % 900000000) + 100000000);
        return {
          vaultId: h,
          friendCode: code9Fb
        };
      }

      function generateSeedPhrase() {
        const pool = [...WORDLIST];
        const result = [];
        for (let i = 0; i < 8; i++) {
          let idx;
          if (window.crypto && window.crypto.getRandomValues) {
            const arr = new Uint32Array(1);
            window.crypto.getRandomValues(arr);
            idx = arr[0] % pool.length;
          } else {
            idx = Math.floor(Math.random() * pool.length);
          }
          result.push(pool.splice(idx, 1)[0]);
        }
        return result;
      }

      const shavloIDB = {
        _db: null,
        open() {
          if (this._db) return Promise.resolve(this._db);
          if (typeof indexedDB === 'undefined') return Promise.resolve(null);
          return new Promise((res) => {
            try {
              const req = indexedDB.open('shavlo_fast_store_v1', 1);
              req.onupgradeneeded = () => {
                const db = req.result;
                if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
              };
              req.onsuccess = () => { this._db = req.result; res(this._db); };
              req.onerror = () => res(null);
            } catch (_) { res(null); }
          });
        },
        async set(key, val) {
          const db = await this.open();
          if (!db) return;
          try {
            const tx = db.transaction('kv', 'readwrite');
            tx.objectStore('kv').put(val, key);
          } catch (_) {}
        },
        async get(key) {
          const db = await this.open();
          if (!db) return null;
          return new Promise((res) => {
            try {
              const tx = db.transaction('kv', 'readonly');
              const r = tx.objectStore('kv').get(key);
              r.onsuccess = () => res(r.result || null);

            } catch (_) { res(null); }
          });
        }

      function processProfilePhotoFile(file, onDone) {
        if (!isLikelyImageFile(file)) {
          showToast('Please select an image file');
          return;

        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            try {
              const size = 200;
              const canvas = document.createElement('canvas');
              canvas.width = size;
              canvas.height = size;
              const ctx = canvas.getContext('2d');
              const minSide = Math.min(img.width, img.height);
              const sx = (img.width - minSide) / 2;
              const sy = (img.height - minSide) / 2;
              ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
              onDone(canvas.toDataURL('image/jpeg', 0.82));
            } catch (err) {
              onDone(reader.result);
            }
          };
          img.onerror = () => { if (reader.result) onDone(reader.result); else showToast("Could not load photo"); };
          img.src = reader.result;
        };
        reader.onerror = () => showToast("Could not read photo file");
        reader.readAsDataURL(file);
      }

              const maxEdge = targetMaxEdge || 480;
              let w = img.width || maxEdge;
              let h = img.height || maxEdge;
              if (w > maxEdge || h > maxEdge) {
                if (w >= h) { h = Math.round((h * maxEdge) / w); w = maxEdge; }
                else { w = Math.round((w * maxEdge) / h); h = maxEdge; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              onDone(canvas.toDataURL('image/jpeg', (targetMaxEdge && targetMaxEdge >= 1440) ? 0.92 : ((targetMaxEdge && targetMaxEdge >= 720) ? 0.88 : 0.84)));
            } catch (err) {
              onDone(reader.result);
            }
          };
          img.onerror = () => { if (reader.result) onDone(reader.result); else showToast("Could not load photo"); };

      function pickSupportedAudioMime() {
        if (typeof MediaRecorder === 'undefined') return '';
        const cands = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
        for (const m of cands) {

      async function startRealVoiceRecorder() {
        stopRealVoiceRecorder(true);
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') return;
        try {
          activeVoiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mime = pickSupportedAudioMime();
          activeVoiceChunks = [];
          activeVoiceRecorder = mime ? new MediaRecorder(activeVoiceStream, { mimeType: mime, audioBitsPerSecond: 24000 }) : new MediaRecorder(activeVoiceStream, { audioBitsPerSecond: 24000 });
          activeVoiceRecorder.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) activeVoiceChunks.push(ev.data); };
          activeVoiceRecorder.start(250);
        } catch (e) {
          activeVoiceRecorder = null;
        }
      }

      function stopRealVoiceRecorder(discard) {
        return new Promise((resolve) => {
          const rec = activeVoiceRecorder;
          const stream = activeVoiceStream;
          activeVoiceRecorder = null;
          activeVoiceStream = null;
          const cleanupTracks = () => {
            if (stream) { try { stream.getTracks().forEach(t => t.stop()); } catch (_) {} }
          };
          if (!rec || rec.state === 'inactive') {
            cleanupTracks();
            resolve(null);
            return;
          }
          rec.onstop = () => {
            cleanupTracks();
            if (discard || !activeVoiceChunks.length) { activeVoiceChunks = []; resolve(null); return; }
            const blob = new Blob(activeVoiceChunks, { type: rec.mimeType || 'audio/mp4' });
            activeVoiceChunks = [];
            resolve(blob);
          };
          try { rec.stop(); } catch (_) { cleanupTracks(); resolve(null); }
        });
      }

      async function subscribeToWebPush(vapidPublicKey) {
        if (!vapidPublicKey || !('serviceWorker' in navigator) || !('PushManager' in window) || !activeVaultId) return false;
        try {
          const reg = await navigator.serviceWorker.ready;
          const pad = '='.repeat((4 - vapidPublicKey.length % 4) % 4);
          const b64 = (vapidPublicKey + pad).replace(/-/g, '+').replace(/_/g, '/');
          const raw = atob(b64);
          const keyArr = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; i++) keyArr[i] = raw.charCodeAt(i);
          const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyArr });
          supaWriteReliable('shavlo_push_subs', 'POST', '?on_conflict=vault_id', { vault_id: activeVaultId, subscription: sub.toJSON(), updated_at: Date.now() });
          return true;
        } catch (e) { return false; }
      }

      async function uploadMediaToSupabaseStorage(dataUrlOrFile, folder, extFallback) {
        const cfg = getSupaCfg();
        if (!cfg || !dataUrlOrFile) return typeof dataUrlOrFile === 'string' ? dataUrlOrFile : '';
        try {
          let blob = null;
          let ext = extFallback || 'jpg';
          if (typeof dataUrlOrFile === 'string') {
            if (!dataUrlOrFile.startsWith('data:')) return dataUrlOrFile;
            try {
              const res = await fetch(dataUrlOrFile);
              blob = await res.blob();
            } catch (_) {
              const parts = dataUrlOrFile.split(',');
              const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
              const bin = atob(parts[1] || '');
              const arr = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
              blob = new Blob([arr], { type: mime });
            }
            if (blob.type && blob.type.includes('/')) ext = blob.type.split('/')[1].split(';')[0] || ext;
          } else if (dataUrlOrFile instanceof Blob) {
            blob = dataUrlOrFile;
            if (dataUrlOrFile.name && dataUrlOrFile.name.includes('.')) ext = dataUrlOrFile.name.split('.').pop().toLowerCase();
          }
          if (!blob) return typeof dataUrlOrFile === 'string' ? dataUrlOrFile : '';
          const safeFolder = String(folder || 'chat').replace(/[^a-z0-9_-]/gi, '');
          const objPath = `${safeFolder}/${activeVaultId || 'anon'}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${ext}`;
          const headers = { 'apikey': cfg.key, 'Content-Type': blob.type || 'application/octet-stream', 'x-upsert': 'true' };
          if (cfg.key && cfg.key.startsWith('eyJ')) headers['Authorization'] = 'Bearer ' + cfg.key;
          const upRes = await fetch(`${cfg.url}/storage/v1/object/shavlo-media/${objPath}`, {
            method: 'POST',
            headers,
            body: blob
          });
          if (!upRes.ok) throw new Error('Storage HTTP ' + upRes.status);
          return `${cfg.url}/storage/v1/object/public/shavlo-media/${objPath}`;
        } catch (e) {
          return typeof dataUrlOrFile === 'string' ? dataUrlOrFile : '';
        }
      }

      function getRoomMaxIncomingTs(net, roomId) {

          if (m && m.authorId !== activeVaultId) {

      function markRoomDelivered(roomId) {

        net.deliveredReceipts[roomId] = net.deliveredReceipts[roomId] || {};
        const maxInc = getRoomMaxIncomingTs(net, roomId);
        const nowD = Math.max(Date.now(), maxInc + 1);
        const prevD = net.deliveredReceipts[roomId][activeVaultId] || 0;
        if (nowD <= prevD && (Date.now() - prevD) < 400) return;
        net.deliveredReceipts[roomId][activeVaultId] = Math.max(prevD, nowD);
        saveNetwork(net, 'delivered_receipt');
        const existingRead = (net.readReceipts && net.readReceipts[roomId] && net.readReceipts[roomId][activeVaultId]) || 0;
        const rrRow = {

          last_delivered_at: net.deliveredReceipts[roomId][activeVaultId],
          last_read_at: existingRead
        };
        sendRoomBroadcast(roomId, 'rr_fast', rrRow);
        supaFetch('rpc/shavlo_upsert_read_receipt', 'POST', '', {

        }).catch(() => {

        saveNetwork(net, 'read_receipt');
        const rrReadRow = { room_id: roomId, user_id: activeVaultId, last_delivered_at: ts, last_read_at: ts };
        sendRoomBroadcast(roomId, 'rr_fast', rrReadRow);

      async function loadOlderMessages(roomId) {
        if (!roomId || !getSupaCfg() || roomOlderLoading[roomId]) return;
        roomOlderLoading[roomId] = true;
        render();
        try {
          const net = getNetwork();
          const cur = Array.isArray(net.peerChats[roomId]) ? net.peerChats[roomId] : [];
          const oldestTs = cur.length ? Math.min(...cur.map(m => Number(m.createdAt || Date.now()))) : Date.now();
          const rows = await supaFetch('shavlo_messages', 'GET', `?room_id=eq.${encodeURIComponent(roomId)}&created_at=lt.${oldestTs}&order=created_at.desc&limit=50`);
          if (!Array.isArray(rows) || rows.length < 50) roomHasNoMoreOlder[roomId] = true;
          if (Array.isArray(rows) && rows.length > 0) {
            const olderRaw = rows.reverse();
            const older = [];
            for (const r of olderRaw) {
              const rawP = typeof r.payload === 'string' ? JSON.parse(r.payload) : (r.payload || {});
              const decP = await decryptMsgPayload(roomId, rawP);
              older.push(Object.assign({}, decP, { id: r.id, authorId: r.author_id, authorName: r.author_name || '', createdAt: Number(r.created_at || Date.now()) }));
            }
            const byId = new Map(older.map(m => [m.id, m]));
            cur.forEach(m => byId.set(m.id, m));
            net.peerChats[roomId] = Array.from(byId.values());
            saveNetwork(net, 'older_msgs');
          }
        } catch (e) {}
        roomOlderLoading[roomId] = false;
        render();
      }

      let _rtcPeerPromise = null;
      async function ensureWebRtcPeer(roomId, peerId, callType) {
        if (rtcPc && !_rtcPeerPromise) return rtcPc;
        if (_rtcPeerPromise) return _rtcPeerPromise;
        if (typeof RTCPeerConnection === 'undefined') return null;
        _rtcPeerPromise = (async () => {
          const pc = new RTCPeerConnection({ iceServers: getIceServers(), iceCandidatePoolSize: 6, bundlePolicy: 'max-bundle', rtcpMuxPolicy: 'require' });
          rtcPc = pc;
          if (!remoteMediaStream) remoteMediaStream = new MediaStream();
          pc.ontrack = (ev) => {
            if (ev.track && !remoteMediaStream.getTracks().some(t => t.id === ev.track.id)) {
              remoteMediaStream.addTrack(ev.track);
            }
            if (ev.streams && ev.streams[0]) {
              ev.streams[0].getTracks().forEach(t => {
                if (!remoteMediaStream.getTracks().some(x => x.id === t.id)) remoteMediaStream.addTrack(t);
              });
            }
            if (ev.track) {
              ev.track.onunmute = () => { if (typeof attachCallStreams === 'function') attachCallStreams(); };
            }
            if (typeof attachCallStreams === 'function') attachCallStreams();
          };
          pc.onicecandidate = (ev) => {
            if (ev.candidate) {
              const candJson = ev.candidate.toJSON();
              if (ui.activeCall && ui.activeCall.status === 'connected') {
                sendWebRtcSignal(roomId, peerId, { kind: 'ice', candidate: candJson });
              } else {
                _queuedIceToSend.push({ roomId, peerId, candidate: candJson });
              }
            }
          };
          pc.oniceconnectionstatechange = () => {
            const st = pc.iceConnectionState;
            if (st === 'connected' || st === 'completed') {
              if (typeof attachCallStreams === 'function') attachCallStreams();
              startCallQualityMonitor(pc, roomId);
              if (ui.activeCall) {
                const lbl = document.getElementById('call-status-label');
                if (lbl && lbl.textContent === 'Reconnecting...') {
                  const m = String(Math.floor(ui.activeCall.seconds / 60)).padStart(2, '0');
                  const s = String(ui.activeCall.seconds % 60).padStart(2, '0');
                  lbl.textContent = `${m}:${s}`;
                }
              }
            } else if (st === 'disconnected' || st === 'failed') {
              const lbl = document.getElementById('call-status-label');
              if (lbl && ui.activeCall && ui.activeCall.status === 'connected') lbl.textContent = 'Reconnecting...';
              if (st === 'failed' && pc.restartIce) {
                try {
                  pc.restartIce();
                  pc.createOffer({ iceRestart: true }).then(o => pc.setLocalDescription(o).then(() => {
                    sendWebRtcSignal(roomId, peerId, { kind: 'offer', sdp: o });
                  })).catch(() => {});
                } catch (_) {}
              }
            }
          };
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
              const needsAudio = !localMediaStream || localMediaStream.getAudioTracks().length === 0;
              const needsVideo = callType === 'video' && (!localMediaStream || localMediaStream.getVideoTracks().length === 0);
              if (needsAudio || needsVideo) {
                if (localMediaStream) {
                  try { localMediaStream.getTracks().forEach(t => t.stop()); } catch (_) {}
                }
                const face = (ui.activeCall && ui.activeCall.facingMode) || 'user';
                localMediaStream = await navigator.mediaDevices.getUserMedia({
                  audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                  video: callType === 'video' ? { facingMode: face, width: { ideal: 960 }, height: { ideal: 540 }, frameRate: { ideal: 30, max: 30 } } : false
                });
              }
              if (ui.activeCall && ui.activeCall.muted) {
                localMediaStream.getAudioTracks().forEach(t => { t.enabled = false; });
              }
              if (ui.activeCall && !ui.activeCall.camOn) {
                localMediaStream.getVideoTracks().forEach(t => { t.enabled = false; });
              }
              localMediaStream.getTracks().forEach(track => pc.addTrack(track, localMediaStream));
              try {
                if (typeof RTCRtpSender !== 'undefined' && RTCRtpSender.getCapabilities) {
                  const caps = RTCRtpSender.getCapabilities('video');
                  if (caps && Array.isArray(caps.codecs)) {
                    const h264 = caps.codecs.filter(c => /h264/i.test(c.mimeType));
                    const rest = caps.codecs.filter(c => !/h264/i.test(c.mimeType));
                    if (h264.length) {
                      pc.getTransceivers().forEach(t => {
                        if (t.sender && t.sender.track && t.sender.track.kind === 'video' && t.setCodecPreferences) {
                          try { t.setCodecPreferences([...h264, ...rest]); } catch (_) {}
                        }
                      });
                    }
                  }
                }
              } catch (_) {}
              try {
                pc.getSenders().forEach(s => {
                  if (!s.track) return;
                  const p = s.getParameters ? s.getParameters() : null;
                  if (p && Array.isArray(p.encodings) && p.encodings.length) {
                    p.encodings[0].maxBitrate = s.track.kind === 'video' ? 900000 : 48000;
                    if (s.track.kind === 'video') p.degradationPreference = 'maintain-framerate';
                    s.setParameters(p).catch(() => {});
                  }
                });
              } catch (_) {}
              attachCallStreams();
            } catch (e) { /* mic/cam unavailable — continue call signaling gracefully */ }
          }
          return pc;
        })();
        try {
          return await _rtcPeerPromise;
        } finally {
          _rtcPeerPromise = null;
        }
      }

      let _callWakeLock = null;
      async function acquireCallWakeLock() {
        try {
          if ('wakeLock' in navigator && !_callWakeLock) {
            _callWakeLock = await navigator.wakeLock.request('screen');
            _callWakeLock.addEventListener('release', () => { _callWakeLock = null; });
          }
        } catch (_) {}
      }
      function releaseCallWakeLock() {
        try { if (_callWakeLock) { _callWakeLock.release(); _callWakeLock = null; } } catch (_) {}
      }

      let _preCreatedOffer = null;
      let _prewarmPromise = null;
      let _offerSentRoom = '';
      let _queuedIceToSend = [];
      function enableOpusDtx(sdpObj) {
        if (!sdpObj || !sdpObj.sdp) return sdpObj;
        const sdp = sdpObj.sdp.replace(/a=fmtp:111 (.+)/g, (m, params) => params.includes('usedtx=1') ? m : `a=fmtp:111 ${params};usedtx=1`);
        return { type: sdpObj.type, sdp };
      }

      let _callStatsTimer = null;
      let _callHeartbeatTimer = null;
      function startCallQualityMonitor(pc, roomId) {
        clearInterval(_callStatsTimer);
        clearInterval(_callHeartbeatTimer);
        _callStatsTimer = setInterval(async () => {
          if (!pc || !ui.activeCall || pc.connectionState === 'closed') { clearInterval(_callStatsTimer); return; }
          try {
            const stats = await pc.getStats();
            let rtt = 0;
            stats.forEach(r => { if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.currentRoundTripTime) rtt = r.currentRoundTripTime * 1000; });
            const barEl = document.getElementById('call-signal-bars');
            if (barEl) {
              const bars = rtt > 350 ? 1 : (rtt > 140 ? 2 : 3);
              barEl.setAttribute('data-bars', String(bars));
              barEl.innerHTML = [1,2,3].map(n => `<span class="w-1 rounded-full ${n === 1 ? 'h-2' : (n === 2 ? 'h-3' : 'h-4')} ${n <= bars ? 'bg-[#C6A76D]' : 'bg-white/25'}"></span>`).join('');
            }
          } catch (_) {}
        }, 2000);
        if (roomId) {
          _callHeartbeatTimer = setInterval(() => {
            if (!ui.activeCall || !ui.activeCall.isPeer) { clearInterval(_callHeartbeatTimer); return; }
            supaWriteReliable('shavlo_calls', 'PATCH', `?room_id=eq.${encodeURIComponent(roomId)}`, { started_at: Date.now() });
          }, 30000);
        }
      }

      function prewarmCallOffer(roomId, peerId, callType) {
        _prewarmPromise = (async () => {
          try {
            const pc = await ensureWebRtcPeer(roomId, peerId, callType);
            if (!pc || pc.signalingState !== 'stable') return;
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            _preCreatedOffer = { roomId, sdp: offer };
          } catch (_) {}
        })();
        return _prewarmPromise;
      }

      function flushQueuedIceToSend(roomId) {
        if (!_queuedIceToSend.length) return;
        const keep = [];
        while (_queuedIceToSend.length) {
          const item = _queuedIceToSend.shift();
          if (item.roomId === roomId) sendWebRtcSignal(item.roomId, item.peerId, { kind: 'ice', candidate: item.candidate });
          else keep.push(item);
        }
        _queuedIceToSend = keep;
      }

      async function startWebRtcOffer(roomId, peerId, callType) {
        if (!roomId || _offerSentRoom === roomId) return;
        _offerSentRoom = roomId;
        try {
          if (_prewarmPromise) { try { await _prewarmPromise; } catch (_) {} }
          const pc = await ensureWebRtcPeer(roomId, peerId, callType);
          if (!pc) { _offerSentRoom = ''; return; }
          let offerSdp = null;
          if (_preCreatedOffer && _preCreatedOffer.roomId === roomId && _preCreatedOffer.sdp) {
            offerSdp = _preCreatedOffer.sdp;
            _preCreatedOffer = null;
          } else if (pc.localDescription && pc.localDescription.type === 'offer') {
            offerSdp = pc.localDescription;
          } else {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            offerSdp = offer;
          }
          sendWebRtcSignal(roomId, peerId, { kind: 'offer', sdp: offerSdp });
          flushQueuedIceToSend(roomId);
          setTimeout(() => {
            if (ui.activeCall && ui.activeCall.roomId === roomId && rtcPc && rtcPc.signalingState === 'have-local-offer' && rtcPc.localDescription) {
              sendWebRtcSignal(roomId, peerId, { kind: 'offer', sdp: rtcPc.localDescription });
              flushQueuedIceToSend(roomId);
            }
          }, 700);
        } catch (e) { _offerSentRoom = ''; }
      }

      let _pendingIce = [];
      async function flushPendingIce(pc) {
        if (!pc || !pc.remoteDescription) return;
        while (_pendingIce.length) {
          const cand = _pendingIce.shift();
          try { await pc.addIceCandidate(new RTCIceCandidate(cand)); } catch (_) {}
        }
      }
      async function handleWebRtcSignal(payload) {
        if (!payload || !ui.activeCall || payload.fromId === activeVaultId) return;
        if (payload.roomId !== ui.activeCall.roomId) return;
        if (payload.toId && payload.toId !== activeVaultId) return;
        const sig = payload.data || {};
        try {
          const pc = await ensureWebRtcPeer(payload.roomId, payload.fromId, ui.activeCall.type);
          if (!pc) return;
          if (sig.kind === 'offer' && sig.sdp) {
            await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
            await flushPendingIce(pc);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sendWebRtcSignal(payload.roomId, payload.fromId, { kind: 'answer', sdp: answer });
          } else if (sig.kind === 'answer' && sig.sdp) {
            if (pc.signalingState !== 'stable') {
              await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
              await flushPendingIce(pc);
            }
          } else if (sig.kind === 'ice' && sig.candidate) {
            if (pc.remoteDescription && pc.remoteDescription.type) {
              await pc.addIceCandidate(new RTCIceCandidate(sig.candidate));
            } else {
              _pendingIce.push(sig.candidate);
            }
          }
        } catch (e) {}
      }

      // Offline Outbox Queue so messages never drop on flaky mobile networks
      function getOutbox() {
        try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); } catch (e) { return []; }
      }
      function enqueueOutbox(op) {
        const q = getOutbox();
        q.push(op);
        try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(q.slice(-100))); } catch (e) {}
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then(reg => { if (reg.sync) reg.sync.register('shavlo-outbox-sync').catch(() => {}); }).catch(() => {});
          }
        } catch (_) {}
      }
      async function flushOutbox() {
        if (!getSupaCfg()) return;
        const q = getOutbox();
        if (!q.length) return;
        const remaining = [];
        for (const op of q) {
          try {
            await supaFetch(op.table, op.method, op.query, op.body);
            if (op.table === 'shavlo_messages' && op.method === 'POST' && op.body && op.body.room_id && op.body.id) {
              setPeerMsgStatusInPlace(op.body.room_id, op.body.id, 'sent');
            }
          } catch (e) {
            const msg = String((e && e.message) || '');
            if (!/^HTTP 4(?!29)/.test(msg)) remaining.push(op);
          }
        }
        try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(remaining)); } catch (e) {}
      }

      let supaAuthToken = '';
      async function ensureSupaAuthSession() {
        if (!supaClient || !supaClient.auth) return '';
        try {
          const { data } = await supaClient.auth.getSession();
          if (data && data.session && data.session.access_token) {
            supaAuthToken = data.session.access_token;
            return supaAuthToken;
          }
          if (typeof supaClient.auth.signInAnonymously === 'function') {
            const res = await supaClient.auth.signInAnonymously();
            if (res && res.data && res.data.session && res.data.session.access_token) {
              supaAuthToken = res.data.session.access_token;
              return supaAuthToken;
            }
          }
        } catch (_) {}
        return '';
      }

      const E2EE_PRIV_KEY_PREFIX = 'shavlo_e2ee_priv_v1_';
      let _myEcdhPair = null;
      async function ensureMyEcdhKeys() {
        if (_myEcdhPair) return _myEcdhPair;
        if (!window.crypto || !window.crypto.subtle || !activeVaultId) return null;
        try {
          const storageKey = E2EE_PRIV_KEY_PREFIX + activeVaultId;
          const saved = localStorage.getItem(storageKey);
          if (saved) {
            const parsed = JSON.parse(saved);
            const priv = await window.crypto.subtle.importKey('jwk', parsed.priv, { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveKey', 'deriveBits']);
            _myEcdhPair = { priv, pubJwk: parsed.pub };
            return _myEcdhPair;
          }
          const kp = await window.crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey', 'deriveBits']);
          const privJwk = await window.crypto.subtle.exportKey('jwk', kp.privateKey);
          const pubJwk = await window.crypto.subtle.exportKey('jwk', kp.publicKey);
          try { localStorage.setItem(storageKey, JSON.stringify({ priv: privJwk, pub: pubJwk })); } catch (_) {}
          _myEcdhPair = { priv: kp.privateKey, pubJwk };
          return _myEcdhPair;
        } catch (_) { return null; }
      }

      const _textEncoder = typeof TextEncoder !== 'undefined' ? new TextEncoder() : null;
      const _roomAesKeyCache = {};
      async function deriveRoomAesKey(roomId) {
        if (!window.crypto || !window.crypto.subtle || !roomId) return null;
        try {
          let cacheTag = String(roomId) + ':fb';
          let peerPub = null;
          if (String(roomId).startsWith('peer_')) {
            const peerId = String(roomId).replace(/^peer_/, '').split('__').find(id => id && id !== activeVaultId);
            const net = getNetwork();
            peerPub = peerId && net.directory && net.directory[peerId] && net.directory[peerId].pubKey;
            if (peerPub && peerPub.x) cacheTag = String(roomId) + ':' + peerPub.x;
          }
          if (_roomAesKeyCache[cacheTag]) return _roomAesKeyCache[cacheTag];
          let derived = null;
          if (peerPub) {
            const myKp = await ensureMyEcdhKeys();
            if (myKp && myKp.priv) {
              const pubKey = await window.crypto.subtle.importKey('jwk', peerPub, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
              derived = await window.crypto.subtle.deriveKey({ name: 'ECDH', public: pubKey }, myKp.priv, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
            }
          }
          if (!derived) {
            const raw = (_textEncoder || new TextEncoder()).encode('shavlo-e2ee-v1:' + String(roomId));
            const hash = await window.crypto.subtle.digest('SHA-256', raw);
            derived = await window.crypto.subtle.importKey('raw', hash, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
          }
          if (derived) _roomAesKeyCache[cacheTag] = derived;
          return derived;
        } catch (_) { return null; }
      }

      async function encryptMsgText(roomId, plainText) {
        const s = String(plainText || '');
        if (!s) return null;
        const key = await deriveRoomAesKey(roomId);
        if (!key) return null;
        try {
          const iv = window.crypto.getRandomValues(new Uint8Array(12));
          const ct = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, (_textEncoder || new TextEncoder()).encode(s));
          const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
          return { iv: toB64(iv), ct: toB64(ct) };
        } catch (_) { return null; }
      }

      async function deriveFallbackRoomKey(roomId) {
        if (!window.crypto || !window.crypto.subtle || !roomId) return null;
        const fbTag = 'fb:' + String(roomId);
        if (_roomAesKeyCache[fbTag]) return _roomAesKeyCache[fbTag];
        try {
          const raw = (_textEncoder || new TextEncoder()).encode('shavlo-e2ee-v1:' + String(roomId));
          const hash = await window.crypto.subtle.digest('SHA-256', raw);
          const k = await window.crypto.subtle.importKey('raw', hash, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
          if (k) _roomAesKeyCache[fbTag] = k;
          return k;
        } catch (_) { return null; }
      }

      async function decryptMsgPayload(roomId, pl) {
        if (!pl || !pl.enc || !pl.enc.iv || !pl.enc.ct) return pl;
        const fromB64 = (b) => Uint8Array.from(atob(b), c => c.charCodeAt(0));
        const tryKeys = [];
        const k1 = await deriveRoomAesKey(roomId);
        if (k1) tryKeys.push(k1);
        const k2 = await deriveFallbackRoomKey(roomId);
        if (k2) tryKeys.push(k2);
        for (const k of tryKeys) {
          try {
            const ptBuf = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(pl.enc.iv) }, k, fromB64(pl.enc.ct));
            return Object.assign({}, pl, { text: new TextDecoder().decode(ptBuf) });
          } catch (_) {}
        }
        return pl;
      }

      async function supaFetch(table, method, query, body) {
        const cfg = getSupaCfg();
        if (!cfg) return null;
        const headers = {
          'apikey': cfg.key,
          'Content-Type': 'application/json'
        };
        if (supaAuthToken) {
          headers['Authorization'] = 'Bearer ' + supaAuthToken;
        } else if (cfg.key && cfg.key.startsWith('eyJ')) {
          headers['Authorization'] = 'Bearer ' + cfg.key;
        }
        if (method === 'POST') headers['Prefer'] = 'resolution=merge-duplicates,return=minimal';
        else if (method === 'PATCH' || method === 'DELETE') headers['Prefer'] = 'return=minimal';
        const rawBody = body ? JSON.stringify(body) : undefined;
        const res = await fetch(`${cfg.url}/rest/v1/${table}${query || ''}`, {
          method: method || 'GET',
          headers,
          body: rawBody,
          keepalive: Boolean(rawBody && rawBody.length < 60000)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        if (method === 'GET') return res.json();
        return true;
      }

      function setPeerMsgStatusInPlace(roomId, msgId, nextStatus) {
        if (!roomId || !msgId) return;
        const net = getNetwork();
        const list = net.peerChats && net.peerChats[roomId];
        if (!Array.isArray(list)) return;
        const m = list.find(x => x.id === msgId);
        if (m && m.status !== nextStatus) {
          m.status = nextStatus;
          saveNetwork(net, 'msg_status');
          if (typeof refreshChatFeedInPlace === 'function') refreshChatFeedInPlace(roomId);
        }
      }

      function supaWriteReliable(table, method, query, body) {
        if (!getSupaCfg()) return;
        supaFetch(table, method, query, body).then(() => {
          if (table === 'shavlo_messages' && method === 'POST' && body && body.room_id && body.id) {
            setPeerMsgStatusInPlace(body.room_id, body.id, 'sent');
          }
        }).catch(() => {
          if (table === 'shavlo_messages' && method === 'POST' && body && body.room_id && body.id) {
            setPeerMsgStatusInPlace(body.room_id, body.id, 'offline');
          }
          enqueueOutbox({ table, method, query, body });
        });
      }

      let supaSyncInFlight = false;
      let supaSyncDebounceTimer = null;
      let lastSupaMsgCreatedAt = 0;
      const _unreadCountMap = {};
      const _roomLastSeq = {};
      let lastUserSyncAt = 0;
      let _rtReconnectAttempt = 0;
      let supaSyncTickCount = 0;
      let lastSyncedNetDigest = '';

      function scheduleSupaSync(delayMs = 250) {

      let lastSupaSyncAt = 0;
      async function syncWithSupabase(forceFull = false) {
        if (!activeVaultId || !state || !getSupaCfg() || supaSyncInFlight) return;
        const nowS = Date.now();
        if (!forceFull && (nowS - lastSupaSyncAt) < 1000) return;
        lastSupaSyncAt = nowS;
        supaSyncInFlight = true;
        try {
          await flushOutbox();
          supaSyncTickCount += 1;
          const fetchUsers = forceFull || supaSyncTickCount === 1 || (supaSyncTickCount % 4 === 0);
          const fetchStatuses = forceFull || supaSyncTickCount === 1 || (supaSyncTickCount % 2 === 0);
          const sinceTs = Math.max(0, lastSupaMsgCreatedAt - 15000);
          const msgQuery = (!forceFull && lastSupaMsgCreatedAt > 0)
            ? `?select=id,room_id,author_id,author_name,payload,created_at,expires_at&created_at=gt.${sinceTs}&order=created_at.asc&limit=150`

                    wa.onended = () => { ui.walkiePeerSpeaking = false; safeBackgroundRender(); };
                    wa.play().catch(() => {});
                  } catch (_) {}
                  clearTimeout(walkieDemoTimer);
                  walkieDemoTimer = setTimeout(() => { ui.walkiePeerSpeaking = false; safeBackgroundRender(); }, 4500);
                }
              })
              .on('presence', { event: 'sync' }, () => {
                try {
                  const pState = supaRealtimeChan.presenceState() || {};
                  const nextOnline = {};
                  const nextRooms = {};
                  Object.values(pState).forEach(entries => {
                    (entries || []).forEach(entry => {
                      if (entry && entry.vault_id && entry.vault_id !== activeVaultId && entry.show_online !== false) {
                        nextOnline[entry.vault_id] = Date.now();
                        if (entry.active_room) nextRooms[entry.vault_id] = entry.active_room;
                      }
                    });
                  });
                  Object.keys(ui.onlineVaultIds || {}).forEach(vid => {
                    if (!nextOnline[vid]) scheduleOfflineGrace(vid);
                  });
                  Object.keys(nextOnline).forEach(vid => {
                    delete ui.offlineGraceUntil[vid];
                    clearTimeout(offlineGraceTimers[vid]);
                  });
                  const prevPresKey = Object.keys(ui.onlineVaultIds || {}).sort().join(',') + '|' + JSON.stringify(ui.peerActiveRooms || {});
                  const nextPresKey = Object.keys(nextOnline).sort().join(',') + '|' + JSON.stringify(nextRooms);
                  ui.onlineVaultIds = nextOnline;
                  ui.peerActiveRooms = nextRooms;
                  if (!updatePlusRingDOM() && prevPresKey !== nextPresKey) {
                    safeBackgroundRender();
                  }
                } catch (e) {}
              })
              .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                  const wasRt = (supaStatus === 'realtime');
                  supaStatus = 'realtime';
                  lastPresKey = '';
                  syncOwnPresence();
                  _rtReconnectAttempt = 0;
                  if (!wasRt && state && state.activeNav === 'you') safeBackgroundRender();
                } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                  if (supaStatus === 'realtime') supaStatus = 'connected';
                  _rtReconnectAttempt = Math.min(5, (_rtReconnectAttempt || 0) + 1);
                  const waitMs = Math.min(30000, 1200 * Math.pow(2, _rtReconnectAttempt)) + Math.floor(Math.random() * 600);
                  clearTimeout(window._supaReconnectTimer);
                  window._supaReconnectTimer = setTimeout(() => { if (activeVaultId && state && getSupaCfg()) startSupaPolling(); }, waitMs);
                }
              });
          }
        } catch (e) { /* REST polling fallback remains active */ }

        // Background reconciliation fallback (45s heartbeat when Realtime is SUBSCRIBED, 15s otherwise)
        try {
          getMergedChats().filter(c => c.isPeer).slice(0, 15).forEach(c => subscribeRoomChannel(c.id));
        } catch (_) {}
        let _fastCallPollInFlight = false;
        supaPollTimer = setInterval(() => {
          if (!activeVaultId || !state || !getSupaCfg()) return;
          if (!document.hidden && !_fastCallPollInFlight) {
            _fastCallPollInFlight = true;
            const vidEnc = encodeURIComponent(activeVaultId);
            supaFetch('shavlo_calls', 'GET', `?select=room_id,caller_id,caller_name,callee_id,callee_name,call_type,status,started_at&or=(caller_id.eq.${vidEnc},callee_id.eq.${vidEnc})`)
              .then((rows) => {
                if (!Array.isArray(rows)) return;
                const net = getNetwork();
                const prevKeys = Object.keys(net.activeCalls || {}).sort().join(',');
                const nextCalls = {};
                rows.forEach(c => {
                  nextCalls[c.room_id] = {
                    roomId: c.room_id, callerId: c.caller_id, callerName: c.caller_name,
                    calleeId: c.callee_id, calleeName: c.callee_name, type: c.call_type,
                    status: c.status, startedAt: c.started_at
                  };
                });
                const nextKeys = Object.keys(nextCalls).sort().join(',');
                const statusChanged = rows.some(c => {
                  const prev = net.activeCalls && net.activeCalls[c.room_id];
                  return !prev || prev.status !== c.status;
                });
                if (prevKeys !== nextKeys || statusChanged) {

                  saveNetwork(net, 'fast_call_poll');

      let audioCtx = null;
      function playSubtleTone(type) {
        if (state && state.security && state.security.sounds === false) return;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          if (!audioCtx) audioCtx = new Ctx();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          const now = audioCtx.currentTime;
          if (type === 'tick') {
            osc.frequency.setValueAtTime(540, now);
            osc.frequency.exponentialRampToValueAtTime(820, now + 0.018);
            gain.gain.setValueAtTime(0.018, now);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.028);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.03);
          } else if (type === 'walkie_on') {
            osc.frequency.setValueAtTime(620, now);
            osc.frequency.exponentialRampToValueAtTime(1040, now + 0.07);
            gain.gain.setValueAtTime(0.035, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.14);
          } else if (type === 'walkie_off') {
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(520, now + 0.07);
            gain.gain.setValueAtTime(0.03, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.13);
          } else if (type === 'ping') {
            osc.frequency.setValueAtTime(740, now);
            osc.frequency.exponentialRampToValueAtTime(988, now + 0.08);
            gain.gain.setValueAtTime(0.03, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.17);
          } else if (type === 'pay') {
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.11);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.23);
          } else {
            osc.frequency.setValueAtTime(type === 'receive' ? 520 : 660, now);
            osc.frequency.exponentialRampToValueAtTime(type === 'receive' ? 620 : 780, now + 0.06);
            gain.gain.setValueAtTime(0.035, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.1);
          }
        } catch (e) { /* ignore audio restrictions */ }
      }

      function showToast(msg) {
        const root = document.getElementById('toast-root');
        if (!root) return;
        const el = document.createElement('div');
        el.className = 'animate-fade bg-ink dark:bg-white text-white dark:text-ink text-xs font-medium px-4 py-2.5 rounded-full shadow-lg';
        el.textContent = msg;
        root.appendChild(el);
        setTimeout(() => { el.remove(); }, 2600);
      }

      function copyText(text, label) {
        const msg = label || 'Copied to clipboard';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
        } else {
          fallbackCopy(text, msg);
        }
      }
      function fallbackCopy(text, msg) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          showToast(msg);
        } catch (e) {
          showToast('Could not copy');
        }
      }

      function downloadSeedFile(words, name, code) {
        try {
          const content = [
            'SHAVLO RECOVERY SEED PHRASE',
            '============================',
            'Account: ' + (name || 'User'),
            'Friend Code: ' + (code || ''),
            '',
            words.map((w, i) => `${i + 1}. ${w}`).join('\n')
          ].join('\n');
          const blob = new Blob([content], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'shavlo-seed-phrase.txt';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('Seed phrase downloaded');
        } catch (e) {
          showToast('Use Copy Phrase to save your seed');
        }
      }

      function ensureSecurityDefaults() {
        if (!state) return;
        if (!state.security) {
          state.security = { masterPinHash: hashPin('1234'), dailyLimit: 25000, secretChatIds: {}, readReceipts: true, blockedIds: {}, verifiedContacts: {}, disappearTimers: {} };
        }
        if (!state.security.masterPinHash) {
          state.security.masterPinHash = state.security.upiPinHash || state.security.appPinHash || hashPin('1234');
        }
        if (typeof state.security.readReceipts !== 'boolean') state.security.readReceipts = true;
        if (!state.security.blockedIds) state.security.blockedIds = {};
        if (!state.security.secretChatIds) state.security.secretChatIds = {};
        if (!state.security.hiddenChatIds) state.security.hiddenChatIds = {};
        if (!state.security.pinnedIds) state.security.pinnedIds = {};
        if (!state.security.notifPrefs) {
          state.security.notifPrefs = { videoCall: true, voiceCall: true, messages: true, walkie: true, audio: true, media: true };
        }
        if (!state.wallpaper) state.wallpaper = 'clean';
        if (!Array.isArray(state.mediaVault)) state.mediaVault = [];
        if (!Array.isArray(state.sampleStatuses)) {
          state.sampleStatuses = [
            { id: 'st_mom', authorId: 'sample_mom', chatId: 'c_mom', authorName: 'Mom', avatarText: 'M', text: 'Fresh mangoes and homemade dinner ready tonight ✨', bg: 'from-[#111113] to-[#4F46E5]', photoUrl: '', createdAt: Date.now() - 2 * 3600 * 1000, expiresAt: Date.now() + 22 * 3600 * 1000, seen: false },
            { id: 'st_priya', authorId: 'sample_priya', chatId: 'c_priya', authorName: 'Priya', avatarText: 'P', text: 'Filter coffee + rainy Bengaluru afternoon ☕', bg: 'from-[#18181B] to-[#3F3F46]', photoUrl: '', createdAt: Date.now() - 5 * 3600 * 1000, expiresAt: Date.now() + 19 * 3600 * 1000, seen: false }
          ];
        }
      }

      function isChatBlocked(chatId) {
        return !!(state && state.security && state.security.blockedIds && state.security.blockedIds[chatId]);
      }
      function isChatPinned(chat) {
        if (!chat || !state || !state.security) return !!(chat && chat.pinned);
        return Boolean((state.security.pinnedIds && state.security.pinnedIds[chat.id]) || chat.pinned);
      }
      function togglePinChat(chatId) {
        if (!state || !chatId) return;
        ensureSecurityDefaults();
        const cur = Boolean(state.security.pinnedIds[chatId]);
        const localC = (state.chats || []).find(x => x.id === chatId);
        const next = !(cur || (localC && localC.pinned));
        if (next) state.security.pinnedIds[chatId] = true;
        else delete state.security.pinnedIds[chatId];
        if (localC) localC.pinned = next;
        persistCurrentVault();
        triggerHaptic(12);
        showToast(next ? 'Chat pinned' : 'Chat unpinned');
      }

      function isChatMuted(chat) {
        if (!chat) return false;
        return !!(chat.muted || (state && state.security && state.security.mutedChatIds && state.security.mutedChatIds[chat.id]));
      }
      function toggleMuteChat(chatId) {
        if (!state || !chatId) return;
        ensureSecurityDefaults();
        state.security.mutedChatIds = state.security.mutedChatIds || {};
        const c = state.chats.find(x => x.id === chatId);
        const nextMuted = c ? !isChatMuted(c) : !state.security.mutedChatIds[chatId];
        if (c) c.muted = nextMuted;
        if (nextMuted) state.security.mutedChatIds[chatId] = true;
        else delete state.security.mutedChatIds[chatId];
        persistCurrentVault();
        showToast(nextMuted ? 'Notifications muted' : 'Notifications unmuted');
      }

      function toggleBlockChat(chatId, chatName) {
        ensureSecurityDefaults();
        if (state.security.blockedIds[chatId]) {
          const entry = state.security.blockedIds[chatId];
          delete state.security.blockedIds[chatId];
          if (entry && entry.savedChat) {
            state.chats.push(entry.savedChat);
          }
          if (activeVaultId && entry && entry.peerVaultId) {
            supaWriteReliable('shavlo_blocks', 'DELETE', `?id=eq.${encodeURIComponent(activeVaultId + '__' + entry.peerVaultId)}`, null);
          }
          persistCurrentVault();
          showToast(`Unblocked ${chatName || (entry && entry.name) || 'user'}`);
          return;
        }
        // Blocking: mark read, remove/delete the chat, and unfriend if connected via Friend Code
        let peerVaultId = null;
        let savedChat = null;
        if (chatId && chatId.startsWith('peer_')) {
          const net = getNetwork();
          const fIdx = net.friendships.findIndex(f => f.users.includes(activeVaultId) && makeRoomId(f.users[0], f.users[1]) === chatId);
          if (fIdx !== -1) {
            peerVaultId = net.friendships[fIdx].users.find(id => id !== activeVaultId) || null;
            net.friendships.splice(fIdx, 1);
          }
          delete net.peerChats[chatId];
          net.requests = (net.requests || []).filter(r => !(
            (r.fromId === activeVaultId && r.toId === peerVaultId) ||
            (r.fromId === peerVaultId && r.toId === activeVaultId)
          ));
          saveNetwork(net, 'friend_blocked');
        } else {
          const existing = state.chats.find(c => c.id === chatId);
          if (existing) {
            existing.unread = 0;
            savedChat = { ...existing, messages: [] };
            state.chats = state.chats.filter(c => c.id !== chatId);
          }
        }
        state.security.blockedIds[chatId] = {
          name: chatName || 'User',
          peerVaultId,
          savedChat,
          time: nowTime()
        };
        if (state.selectedChatId === chatId) {
          const nextChats = getMergedChats();
          state.selectedChatId = (nextChats[0] && nextChats[0].id) || null;
          state.mobileView = 'list';
        }
        persistCurrentVault();
        showToast(`Blocked ${chatName || 'user'} • Unfriended & chat deleted`);
      }

      function isValidUpiId(id) {
        return /^[a-zA-Z0-9._-]{2,64}@[a-zA-Z]{2,32}$/.test(String(id || '').trim());
      }

      function getTodaySpend() {
        if (!state || !state.upiHistory) return 0;
        return state.upiHistory
          .filter(tx => tx.direction === 'sent' && tx.status !== 'Refunded' && String(tx.date || '').startsWith('Today'))
          .reduce((s, tx) => s + (Number(tx.amount) || 0), 0);
      }

      function getActiveStatuses() {
        if (!state) return [];
        const now = Date.now();
        const net = getNetwork();
        const myFriendIds = new Set(
          net.friendships
            .filter(f => f.users.includes(activeVaultId))
            .map(f => f.users.find(id => id !== activeVaultId))
        );
        const liveStatuses = (net.statuses || []).filter(st =>
          st.expiresAt > now && (st.authorId === activeVaultId || myFriendIds.has(st.authorId))
        );
        const samples = (state.sampleStatuses || []).filter(st => st.expiresAt > now);
        return [...liveStatuses, ...samples].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      }

      function formatRemaining24h(expiresAt) {
        const ms = Math.max(0, (expiresAt || 0) - Date.now());
        const days = Math.floor(ms / 86400000);
        if (days >= 1) return `${days}d left`;
        const hrs = Math.floor(ms / 3600000);
        const mins = Math.floor((ms % 3600000) / 60000);
        if (hrs >= 1) return `${hrs}h left`;
        return `${Math.max(1, mins)}m left`;
      }

      function postNew24hStatus(text, bg, photoUrl) {
        const clean = String(text || '').trim();
        if (!clean && !photoUrl) { showToast('Add text or a photo for your status'); return; }
        const now = Date.now();
        const net = getNetwork();
        net.statuses.unshift({
          id: 'st_' + now,
          authorId: activeVaultId,
          chatId: null,
          authorName: state.userProfile.name,
          avatarText: getInitial(state.userProfile.name),
          avatarUrl: state.userProfile.avatarUrl || '',
          text: clean,
          bg: bg || 'from-[#111113] to-[#4F46E5]',
          photoUrl: photoUrl || '',
          createdAt: now,
          expiresAt: now + 24 * 60 * 60 * 1000,
          seenBy: [activeVaultId]
        });
        saveNetwork(net, 'status_posted');
        if (net.statuses[0]) {
          const stObj = net.statuses[0];
          (async () => {
            try {
              if (stObj.photoUrl && stObj.photoUrl.startsWith('data:')) {
                const cdnUrl = await uploadMediaToSupabaseStorage(stObj.photoUrl, 'statuses', 'jpg');
                if (cdnUrl && /^https?:/i.test(cdnUrl)) {
                  stObj.photoUrl = cdnUrl;
                  saveNetwork(getNetwork(), 'status_photo_cdn');
                }
              }
            } catch (_) {}
            if (supaRealtimeChan) {
              try {
                supaRealtimeChan.send({
                  type: 'broadcast',
                  event: 'status_fast',
                  payload: { id: stObj.id, author_id: activeVaultId, author_name: state.userProfile.name, payload: stObj, expires_at: stObj.expiresAt }
                });
              } catch (_) {}
            }
            supaWriteReliable('shavlo_statuses', 'POST', '', {
              id: stObj.id, author_id: activeVaultId, author_name: state.userProfile.name,
              payload: stObj, expires_at: stObj.expiresAt
            });
          })();
        }
        ui.modal = null;
        ui.statusDraftText = '';
        ui.statusDraftPhoto = '';
        render();
        showToast('Status posted for 24 hours');
      }


      function getMergedChats() {
        if (!state) return [];
        ensureSecurityDefaults();
        const nowMs = Date.now();
        const net = getNetwork();
        const myFriendships = net.friendships.filter(f => f.users.includes(activeVaultId));
        const peerChats = myFriendships.map(f => {
          const otherId = f.users.find(id => id !== activeVaultId);
          let other = net.directory[otherId];
          if (!other || !other.name || other.name === 'Friend') {
            const reqMatch = (net.requests || []).find(r => (r.fromId === otherId && r.fromName) || (r.toId === otherId && r.toName));
            const reqName = reqMatch ? (reqMatch.fromId === otherId ? reqMatch.fromName : reqMatch.toName) : '';
            const msgRoom = makeRoomId(activeVaultId, otherId);
            const msgMatch = (net.peerChats && net.peerChats[msgRoom] || []).slice().reverse().find(m => m.authorId === otherId && m.authorName);
            const stMatch = (net.statuses || []).find(s => s.authorId === otherId && s.authorName);
            const resolvedName = (other && other.name && other.name !== 'Friend') ? other.name : (reqName || (msgMatch && msgMatch.authorName) || (stMatch && stMatch.authorName) || 'Friend');
            other = Object.assign({ friendCode: 'SMV-PEER', upiId: 'friend@upi', avatarUrl: '' }, other || {}, { name: resolvedName, avatarText: getInitial(resolvedName) });
          }
          const roomId = makeRoomId(activeVaultId, otherId);
          const peerReadAt = (net.readReceipts && net.readReceipts[roomId] && net.readReceipts[roomId][otherId]) || 0;
          const peerDelivAt = (net.deliveredReceipts && net.deliveredReceipts[roomId] && net.deliveredReceipts[roomId][otherId]) || 0;
          const rawMsgs = (net.peerChats[roomId] || [])
            .filter(m => !m.expiresAt || m.expiresAt > nowMs)
            .map(m => {
              const isMine = m.authorId === activeVaultId;
              const ts = Number(m.createdAt || 0);
              const liveStatus = isMine
                ? ((peerReadAt > 0 && ts <= peerReadAt) ? 'read' : ((peerDelivAt > 0 && ts <= peerDelivAt) ? 'delivered' : (m.status || 'sent')))
                : m.status;
              return {
                ...m,
                status: liveStatus,
                text: m.text || '',
                sender: isMine ? 'me' : 'other',
                senderName: isMine ? 'You' : other.name
              };
            });
          const lastMsg = rawMsgs[rawMsgs.length - 1];
          return {
            id: roomId,
            isPeer: true,
            peerVaultId: otherId,
            name: other.name,
            subtitle: `Friend • ${other.friendCode}`,
            avatarText: other.avatarText || getInitial(other.name),
            avatarUrl: other.avatarUrl || '',
            category: 'personal',
            isGroup: false,
            verified: true,
            pinned: Boolean(state && state.security && state.security.pinnedIds && state.security.pinnedIds[roomId]),
            muted: !!(state.security && state.security.mutedChatIds && state.security.mutedChatIds[roomId]),
            disappearing: false,
            unread: (() => {
              const myReadAt = (net.readReceipts && net.readReceipts[roomId] && net.readReceipts[roomId][activeVaultId]) || 0;
              return rawMsgs.filter(m => m.sender === 'other' && Number(m.createdAt || 0) > myReadAt).length;
            })(),
            upiId: other.upiId || 'friend@upi',
            phone: other.friendCode,
            lastTime: lastMsg ? lastMsg.time : 'Now',
            messages: rawMsgs
          };
        });
        state.chats.forEach(c => {
          if (Array.isArray(c.messages) && c.messages.some(m => m.expiresAt && m.expiresAt <= nowMs)) {
            c.messages = c.messages.filter(m => !m.expiresAt || m.expiresAt > nowMs);
          }
        });
        const localChats = state.chats;
        const liveGroups = (net.groups || [])
          .filter(g => Array.isArray(g.memberIds) && g.memberIds.includes(activeVaultId))
          .map(g => {
            const rawMsgs = (net.peerChats[g.id] || [])
              .filter(m => !m.expiresAt || m.expiresAt > nowMs)
              .map(m => {
                const author = net.directory[m.authorId];
                const isMine = m.authorId === activeVaultId;
                let liveStatus = m.status;
                if (isMine) {
                  const ts = Number(m.createdAt || 0);
                  const roomReads = (net.readReceipts && net.readReceipts[g.id]) || {};
                  const roomDelivs = (net.deliveredReceipts && net.deliveredReceipts[g.id]) || {};
                  const otherIds = (g.memberIds || []).filter(id => id && id !== activeVaultId);
                  const anyRead = otherIds.some(id => Number(roomReads[id] || 0) > 0 && ts <= Number(roomReads[id] || 0));
                  const anyDeliv = otherIds.some(id => Number(roomDelivs[id] || 0) > 0 && ts <= Number(roomDelivs[id] || 0));
                  liveStatus = anyRead ? 'read' : (anyDeliv ? 'delivered' : (m.status || 'sent'));
                }
                return {
                  ...m,
                  status: liveStatus,
                  text: m.text || '',
                  sender: isMine ? 'me' : 'other',
                  senderName: isMine ? 'You' : ((author && author.name) || m.authorName || 'Member')
                };
              });
            const lastMsg = rawMsgs[rawMsgs.length - 1];
            const memberNames = g.memberIds.map(id => id === activeVaultId ? 'You' : ((net.directory[id] && net.directory[id].name) || 'Member'));
            return {
              id: g.id,
              isPeer: true,
              isLiveGroup: true,
              groupCode: g.code,
              name: g.name,
              subtitle: `${g.memberIds.length} member${g.memberIds.length === 1 ? '' : 's'} • ${g.code}`,
              avatarText: getInitial(g.name),
              category: 'personal',
              isGroup: true,
              memberIds: g.memberIds,
              members: memberNames,
              verified: false,
              pinned: isChatPinned({ id: roomId }),
              muted: false,
              disappearing: false,
              unread: 0,
              upiId: g.upiId || state.userProfile.upiId,
              phone: 'Group Code: ' + g.code,
              lastTime: lastMsg ? lastMsg.time : 'New',
              messages: rawMsgs
            };
          });
        return [...liveGroups, ...peerChats, ...localChats];
      }

      // Friend Requests & Live Networking
      function createLiveGroup(name, desc, inviteFriendIds, ttlHours) {
        const cleanName = String(name || '').trim();
        if (!cleanName) { showToast('Enter a group name'); return; }
        const net = getNetwork();
        const gid = 'grp_' + Date.now();
        const code = 'GRP-' + syncHash(gid + cleanName).slice(0, 4) + '-' + syncHash(cleanName + activeVaultId).slice(0, 4);
        const members = Array.from(new Set([activeVaultId, ...(inviteFriendIds || [])]));
        const hrs = Number(ttlHours || 0);
        const expiresAt = hrs > 0 ? (Date.now() + hrs * 3600 * 1000) : null;
        const newGrp = {
          id: gid,
          code,
          name: cleanName,
          desc: String(desc || '').trim() || 'Private group chat',
          creatorId: activeVaultId,
          memberIds: members,
          createdAt: Date.now(),
          expiresAt
        };
        net.groups.unshift(newGrp);
        net.peerChats[gid] = [{
          id: 'm_grp_' + Date.now(),
          authorId: activeVaultId,
          authorName: state.userProfile.name,
          type: 'text',
          text: `Created "${cleanName}". Share code ${code} so others can join!`,
          time: nowTime(),
          status: 'read',
          reactions: ['🎉'],
          starred: false
        }];
        saveNetwork(net, 'group_created');
        const grpRow = {
          id: gid, code, name: cleanName, description: String(desc || '').trim() || 'Private group chat',
          creator_id: activeVaultId, member_ids: members, created_at: Date.now(), expires_at: expiresAt
        };
        if (supaRealtimeChan) {
          try { supaRealtimeChan.send({ type: 'broadcast', event: 'group_fast', payload: grpRow }); } catch (_) {}
        }
        supaWriteReliable('shavlo_groups', 'POST', '', grpRow);
        ui.groupTimerOn = false;
        const initGrpMsg = net.peerChats[gid][0];
        if (initGrpMsg) {
          supaWriteReliable('shavlo_messages', 'POST', '', {
            id: initGrpMsg.id, room_id: gid, author_id: activeVaultId,
            author_name: state.userProfile.name, payload: initGrpMsg, created_at: Date.now()
          });
        }
        ui.modal = null;
        state.selectedChatId = gid;
        state.activeNav = 'messages';
        state.mobileView = 'chat';
        persistCurrentVault();
        render();
        scrollToBottom();
        showToast(`Group created • Code: ${code}`);
      }

      async function joinLiveGroupByCode(rawCode) {
        const code = String(rawCode || '').trim().toUpperCase();
        if (!code) { showToast('Enter a Group Code (e.g. GRP-XXXX-XXXX)'); return; }
        const net = getNetwork();
        let grp = (net.groups || []).find(g => g.code === code);
        if (!grp && getSupaCfg()) {
          showToast('Looking up group on Supabase...');
          try {
            const rows = await supaFetch('shavlo_groups', 'GET', `?code=eq.${encodeURIComponent(code)}&select=id,code,name,description,creator_id,member_ids,admin_ids,created_at,expires_at`);
            if (Array.isArray(rows) && rows.length > 0) {
              const g = rows[0];
              grp = {
                id: g.id, code: g.code, name: g.name, desc: g.description || '',
                creatorId: g.creator_id, memberIds: Array.isArray(g.member_ids) ? g.member_ids : [],
                createdAt: g.created_at || Date.now()
              };
              net.groups.unshift(grp);
            }
          } catch (e) {}
        }
        if (!grp) { showToast('No group found with that code'); return; }
        if (!grp.memberIds.includes(activeVaultId)) {
          grp.memberIds.push(activeVaultId);
          net.peerChats[grp.id] = net.peerChats[grp.id] || [];
          const joinMsg = {
            id: 'm_join_' + Date.now(),
            authorId: activeVaultId,
            authorName: state.userProfile.name,
            type: 'text',
            text: `${state.userProfile.name} joined the group via code!`,
            time: nowTime(),
            status: 'read',
            reactions: ['👋'],
            starred: false
          };
          net.peerChats[grp.id].push(joinMsg);
          saveNetwork(net, 'group_joined');
          supaWriteReliable('shavlo_groups', 'PATCH', `?id=eq.${encodeURIComponent(grp.id)}`, { member_ids: grp.memberIds });
          supaWriteReliable('shavlo_messages', 'POST', '', {
            id: joinMsg.id, room_id: grp.id, author_id: activeVaultId,
            author_name: state.userProfile.name, payload: joinMsg, created_at: Date.now()
          });
        }
        ui.modal = null;
        ui.groupCodeInput = '';
        state.selectedChatId = grp.id;
        state.activeNav = 'messages';
        state.mobileView = 'chat';
        persistCurrentVault();
        render();
        scrollToBottom();
        showToast(`Joined ${grp.name}`);
      }

      function leaveLiveGroup(gid) {
        const net = getNetwork();
        const grp = (net.groups || []).find(g => g.id === gid);
        if (!grp) return;
        grp.memberIds = grp.memberIds.filter(id => id !== activeVaultId);
        if (grp.memberIds.length === 0) {
          net.groups = net.groups.filter(g => g.id !== gid);
          delete net.peerChats[gid];
          supaWriteReliable('shavlo_groups', 'DELETE', `?id=eq.${encodeURIComponent(gid)}`, null);
        } else {
          supaWriteReliable('shavlo_groups', 'PATCH', `?id=eq.${encodeURIComponent(gid)}`, { member_ids: grp.memberIds });
        }
        saveNetwork(net, 'group_left');
        if (state.selectedChatId === gid) {
          const next = getMergedChats();
          state.selectedChatId = (next[0] && next[0].id) || null;
          state.mobileView = 'list';
        }
        ui.modal = null;
        render();
        showToast(`Left ${grp.name}`);
      }

      function sendFriendRequest(rawCode) { return sendFriendRequestByCode(rawCode); }
      async function sendFriendRequestByCode(rawCode) {
        const code = String(rawCode || '').trim().toUpperCase();
        if (!code) { showToast('Enter a unique code'); return; }
        if (!/^(\d{6,9}|[A-F0-9]{16,64}|SMV-[A-Z0-9]{4}-[A-Z0-9]{4})$/.test(code)) { showToast('Enter a valid friend code'); return; }
        if (code === state.userProfile.friendCode) { showToast('That is your own code'); return; }
        const net = getNetwork();
        let target = Object.values(net.directory).find(u => u.friendCode === code);

        // Live Supabase lookup so brand-new accounts on another phone are found immediately
        if (!target && getSupaCfg()) {
          showToast('Looking up code on Supabase...');
          try {
            const rows = await supaFetch('shavlo_users', 'GET', `?friend_code=eq.${encodeURIComponent(code)}&select=vault_id,friend_code,name,upi_id,avatar_text,avatar_url,pub_key,updated_at`);
            if (Array.isArray(rows) && rows.length > 0) {
              const u = rows[0];
              target = {
                vaultId: u.vault_id,
                friendCode: u.friend_code,
                name: u.name,
                upiId: u.upi_id || '',
                avatarText: u.avatar_text || getInitial(u.name),
                avatarUrl: u.avatar_url || '',
              pubKey: u.pub_key || null,
                lastSeen: u.updated_at || Date.now()
              };
              net.directory[u.vault_id] = target;
              saveNetwork(net, 'directory_update');
            }
          } catch (e) { /* handled below */ }
        }

        if (!target) {
          if (getSupaCfg()) {
            showToast('Code not found on Supabase yet — make sure your friend signed in with Cloud Sync');
          } else {
            showToast('Account not found on this device — connect Supabase in Settings to add friends on other phones');
          }
          return;
        }
        const blockedRoom = makeRoomId(activeVaultId, target.vaultId);
        if (isChatBlocked(blockedRoom)) { showToast(`Unblock ${target.name} in Settings before adding again`); return; }
        const alreadyFriends = net.friendships.some(f => f.users.includes(activeVaultId) && f.users.includes(target.vaultId));
        if (alreadyFriends) { showToast(`Already friends with ${target.name}`); return; }
        const existingReq = net.requests.find(r =>
          (r.fromId === activeVaultId && r.toId === target.vaultId) ||
          (r.fromId === target.vaultId && r.toId === activeVaultId)
        );
        if (existingReq) { showToast('Request already pending'); return; }

        const newReq = {
          id: 'req_' + Date.now(),
          fromId: activeVaultId,
          fromName: state.userProfile.name,
          fromCode: state.userProfile.friendCode,
          toId: target.vaultId,
          toName: target.name,
          toCode: target.friendCode,
          time: nowTime()
        };
        net.requests.push(newReq);
        saveNetwork(net, 'friend_request');
        supaWriteReliable('shavlo_requests', 'POST', '', {
          id: newReq.id, from_id: newReq.fromId, from_name: newReq.fromName, from_code: newReq.fromCode,
          to_id: newReq.toId, to_name: newReq.toName, to_code: newReq.toCode, created_time: newReq.time
        });
        ui.friendCodeInput = '';
        render();
        showToast(`Friend request sent to ${target.name}`);
      }

      function respondFriendRequest(reqId, accept) {
        const net = getNetwork();
        const idx = net.requests.findIndex(r => r.id === reqId);
        if (idx === -1) return;
        const req = net.requests[idx];
        net.requests.splice(idx, 1);

        if (accept) {
          const frId = 'fr_' + Date.now();
          const sinceTxt = nowTime();
          if (!net.friendships.some(f => f.users.includes(req.fromId) && f.users.includes(req.toId))) {
            net.friendships.push({ id: frId, users: [req.fromId, req.toId], since: sinceTxt });
          }
          supaWriteReliable('shavlo_friendships', 'POST', '', { id: frId, user_a: req.fromId, user_b: req.toId, since: sinceTxt });
          supaWriteReliable('shavlo_requests', 'DELETE', `?id=eq.${encodeURIComponent(req.id)}`, null);
          const roomId = makeRoomId(req.fromId, req.toId);
          if (!net.peerChats[roomId]) {
            const welcomeMsg = {
              id: 'm_welcome_' + Date.now(),
              authorId: activeVaultId,
              authorName: state.userProfile.name,
              type: 'text',
              text: 'Connected via Unique Code. You can now message, pay via UPI, or start a Voice/Video Call.',
              time: nowTime(),
              status: 'read',
              reactions: [],
              starred: false
            };
            net.peerChats[roomId] = [welcomeMsg];
            supaWriteReliable('shavlo_messages', 'POST', '', {
              id: welcomeMsg.id, room_id: roomId, author_id: activeVaultId,
              author_name: state.userProfile.name, payload: welcomeMsg, created_at: Date.now()
            });
          }
          saveNetwork(net, 'friend_accepted');
          ui.modal = null;
          state.selectedChatId = roomId;
          state.activeNav = 'messages';
          state.mobileView = 'chat';
          persistCurrentVault();
          syncOwnPresence();
          render();
          const savedPos = _chatScrollPositions[btn.dataset.id];
          const fEl = document.getElementById('message-feed');
          if (fEl && typeof savedPos === 'number' && savedPos > 0) fEl.scrollTop = savedPos;
          else scrollToBottom();
          showToast(`Connected with ${req.fromName}`);
        } else {
          supaWriteReliable('shavlo_requests', 'DELETE', `?id=eq.${encodeURIComponent(req.id)}`, null);
          saveNetwork(net, 'friend_declined');
          render();
          showToast('Request deleted');
        }
      }

      function deleteFriendRequest(reqId) {
        const net = getNetwork();
        const idx = net.requests.findIndex(r => r.id === reqId);
        if (idx === -1) return;
        const req = net.requests[idx];
        net.requests.splice(idx, 1);
        supaWriteReliable('shavlo_requests', 'DELETE', `?id=eq.${encodeURIComponent(req.id)}`, null);
        saveNetwork(net, 'friend_req_deleted');
        if (ui.editingReqId === reqId) ui.editingReqId = null;
        render();
        renderModal();
        showToast('Friend request deleted');
      }

      function saveEditedFriendRequest(reqId, newName, newCode) {
        const net = getNetwork();
        const req = net.requests.find(r => r.id === reqId);
        if (!req) return;
        const cleanName = String(newName || '').trim();
        const cleanCode = String(newCode || '').trim().toUpperCase();
        const isOutgoing = req.fromId === activeVaultId;
        if (isOutgoing) {
          if (cleanCode && !/^(\d{6,9}|[A-F0-9]{16,64}|SMV-[A-Z0-9]{4}-[A-Z0-9]{4})$/.test(cleanCode)) {
            showToast('Enter a valid friend code');
            return;
          }
          if (cleanCode && cleanCode !== req.toCode) {
            const target = Object.values(net.directory).find(u => u.friendCode === cleanCode);
            req.toCode = cleanCode;
            if (target) {
              req.toId = target.vaultId;
              req.toName = cleanName || target.name;
            } else if (cleanName) {
              req.toName = cleanName;
            }
          } else if (cleanName) {
            req.toName = cleanName;
          }
          supaWriteReliable('shavlo_requests', 'PATCH', `?id=eq.${encodeURIComponent(req.id)}`, {
            to_id: req.toId, to_name: req.toName, to_code: req.toCode
          });
        } else {
          if (cleanName) req.fromName = cleanName;
          supaWriteReliable('shavlo_requests', 'PATCH', `?id=eq.${encodeURIComponent(req.id)}`, {
            from_name: req.fromName
          });
        }
        saveNetwork(net, 'friend_req_edited');
        ui.editingReqId = null;
        render();
        renderModal();
        showToast('Friend request updated');
      }

      function renderFriendRequestsWindowContent() {
        const net = getNetwork();
        const incoming = (net.requests || []).filter(r => r.toId === activeVaultId);
        const outgoing = [];
        const total = incoming.length;

        const renderRow = (req, isOutgoing) => {
          const isEditing = ui.editingReqId === req.id;
          const displayName = isOutgoing ? req.toName : req.fromName;
          const displayCode = isOutgoing ? req.toCode : req.fromCode;
          if (isEditing) {
            return `
              <form id="edit-friend-req-form" data-id="${req.id}" class="p-3.5 rounded-2xl bg-brand-50/70 dark:bg-brand-600/15 border border-brand-500/30 space-y-2.5 text-left">
                <div class="text-[11.5px] font-bold uppercase tracking-wider text-brand-600 dark:text-brand-100">Edit ${isOutgoing ? 'sent' : 'incoming'} request</div>

      function startCallTimer() {
        clearInterval(callTimer);
        clearInterval(_callStatsTimer);
        clearInterval(_callHeartbeatTimer);
        callTimer = setInterval(() => {
          if (ui.activeCall && (ui.activeCall.status === 'connected' || !ui.activeCall.isPeer)) {
            ui.activeCall.seconds += 1;
            const lbl = document.getElementById('call-status-label');
            if (lbl) {
              const m = String(Math.floor(ui.activeCall.seconds / 60)).padStart(2, '0');
              const s = String(ui.activeCall.seconds % 60).padStart(2, '0');

              renderCallOverlay();
            }
          }
        }, 1000);
