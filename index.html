      function syncHash(str) {
        let h1 = 0xdeadbeef ^ str.length;
        let h2 = 0x41c6ce57 ^ str.length;
        for (let i = 0; i < str.length; i++) {
          const ch = str.charCodeAt(i);
          h1 = Math.imul(h1 ^ ch, 2654435761);
          h2 = Math.imul(h2 ^ ch, 1597334677);
        }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
        return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).toUpperCase().padStart(12, '0');
      }

      function hashPin(pin) {
        return 'PIN_' + syncHash('shavlo-pin-salt-v4:' + String(pin || ''));

      async function deriveSeedIdentity(words) {
        const normalized = words.map(w => w.trim().toLowerCase()).join(' ');
        try {
          if (window.crypto && window.crypto.subtle) {
            const data = new TextEncoder().encode('samvaad-vault-v4:' + normalized);
            const buf = await window.crypto.subtle.digest('SHA-256', data);
            const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
            const code9 = String((parseInt(hex.slice(0, 12), 16) % 900000000) + 100000000);
            return {
              vaultId: hex.slice(0, 16),
              friendCode: code9
            };
          }
        } catch (e) { /* fallback */ }
        const h = syncHash(normalized);
        const h2 = syncHash(normalized + ':shavlo-fc-2');
        const hex32 = (h + h2 + h).replace(/[^A-F0-9]/g, 'A').slice(0, 32);
        const code9Fb = String((parseInt(hex32.slice(0, 12), 16) % 900000000) + 100000000);
        return {
          vaultId: h,
          friendCode: code9Fb
        };
      }

      function generateSeedPhrase() {
        const pool = [...WORDLIST];
        const result = [];
        for (let i = 0; i < 8; i++) {
          let idx;
          if (window.crypto && window.crypto.getRandomValues) {
            const arr = new Uint32Array(1);
            window.crypto.getRandomValues(arr);
            idx = arr[0] % pool.length;
          } else {
            idx = Math.floor(Math.random() * pool.length);
          }
          result.push(pool.splice(idx, 1)[0]);
        }
        return result;
      }

      function isLikelyImageFile(file) {
        if (!file) return false;
        if (file.type && file.type.startsWith('image/')) return true;

        return /\.(jpe?g|png|webp|gif|heic|heif|bmp|avif)$/i.test(file.name || '');
      }

      function processProfilePhotoFile(file, onDone) {
        if (!isLikelyImageFile(file)) {
          showToast('Please select an image file');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            try {
              const size = 200;
              const canvas = document.createElement('canvas');
              canvas.width = size;
              canvas.height = size;
              const ctx = canvas.getContext('2d');
              const minSide = Math.min(img.width, img.height);
              const sx = (img.width - minSide) / 2;
              const sy = (img.height - minSide) / 2;
              ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
              onDone(canvas.toDataURL('image/jpeg', 0.82));
            } catch (err) {
              onDone(reader.result);
            }
          };
          img.onerror = () => { if (reader.result) onDone(reader.result); else showToast("Could not load photo"); };
          img.src = reader.result;
        };
        reader.onerror = () => showToast("Could not read photo file");
        reader.readAsDataURL(file);
      }

            function processChatMediaFile(file, onDone, targetMaxEdge) {
        if (!isLikelyImageFile(file)) {

          return;

        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            try {
              const maxEdge = targetMaxEdge || 480;
              let w = img.width || maxEdge;
              let h = img.height || maxEdge;
              if (w > maxEdge || h > maxEdge) {
                if (w >= h) { h = Math.round((h * maxEdge) / w); w = maxEdge; }
                else { w = Math.round((w * maxEdge) / h); h = maxEdge; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, w);
              canvas.height = Math.max(1, h);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              onDone(canvas.toDataURL('image/jpeg', (targetMaxEdge && targetMaxEdge >= 720) ? 0.86 : 0.84));
            } catch (err) {
              onDone(reader.result);
            }
          };
          img.onerror = () => { if (reader.result) onDone(reader.result); else showToast("Could not load photo"); };
          img.src = reader.result;
        };
        reader.onerror = () => showToast("Could not read photo file");
        reader.readAsDataURL(file);
      }

      // Vault & Shared Peer Network Storage
      function getAllVaults() {
        try {
          const raw = localStorage.getItem(VAULTS_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) { return {}; }
      }
      function saveAllVaults(vaults) {
        try { localStorage.setItem(VAULTS_KEY, JSON.stringify(vaults)); } catch (e) { /* ignore */ }
      }
      let networkCache = null;
      function invalidateNetworkCache() { networkCache = null; }
      function getNetwork() {
        if (networkCache) return networkCache;
        try {
          const raw = localStorage.getItem(NETWORK_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            networkCache = {
              directory: p.directory || {},
              requests: Array.isArray(p.requests) ? p.requests : [],
              friendships: Array.isArray(p.friendships) ? p.friendships : [],
              peerChats: p.peerChats || {},
              activeCalls: p.activeCalls || {},
              statuses: Array.isArray(p.statuses) ? p.statuses : [],
              groups: Array.isArray(p.groups) ? p.groups : []
            };
            return networkCache;
          }
        } catch (e) { /* ignore */ }
        networkCache = { directory: {}, requests: [], friendships: [], peerChats: {}, activeCalls: {}, statuses: [], groups: [] };
        return networkCache;
      }

          const mime = pickSupportedAudioMime();
          activeVoiceChunks = [];
          activeVoiceRecorder = mime ? new MediaRecorder(activeVoiceStream, { mimeType: mime }) : new MediaRecorder(activeVoiceStream);
          activeVoiceRecorder.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) activeVoiceChunks.push(ev.data); };
          activeVoiceRecorder.start(250);
        } catch (e) {
          activeVoiceRecorder = null;
        }
      }

      function stopRealVoiceRecorder(discard) {
        return new Promise((resolve) => {
          const rec = activeVoiceRecorder;
          const stream = activeVoiceStream;
          activeVoiceRecorder = null;
          activeVoiceStream = null;
          const cleanupTracks = () => {
            if (stream) { try { stream.getTracks().forEach(t => t.stop()); } catch (_) {} }
          };
          if (!rec || rec.state === 'inactive') {
            cleanupTracks();
            resolve(null);
            return;
          }
          rec.onstop = () => {
            cleanupTracks();
            if (discard || !activeVoiceChunks.length) { activeVoiceChunks = []; resolve(null); return; }
            const blob = new Blob(activeVoiceChunks, { type: rec.mimeType || 'audio/mp4' });
            activeVoiceChunks = [];
            resolve(blob);
          };
          try { rec.stop(); } catch (_) { cleanupTracks(); resolve(null); }
        });
      }

      async function startWalkieCapture() {
        if (walkieRecorder) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') return;
        try {
          walkieRecStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mime = pickSupportedAudioMime();
          walkieChunks = [];
          walkieRecorder = mime ? new MediaRecorder(walkieRecStream, { mimeType: mime }) : new MediaRecorder(walkieRecStream);
          walkieRecorder.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) walkieChunks.push(ev.data); };
          walkieRecorder.start(150);
        } catch (e) {
          walkieRecorder = null;
        }
      }

      function stopAndBroadcastWalkie(roomId) {
        const rec = walkieRecorder;
        const stream = walkieRecStream;
        walkieRecorder = null;
        walkieRecStream = null;
        const cleanup = () => { if (stream) { try { stream.getTracks().forEach(t => t.stop()); } catch (_) {} } };
        if (!rec || rec.state === 'inactive') { cleanup(); return; }
        rec.onstop = () => {
          cleanup();
          if (!walkieChunks.length || !roomId) { walkieChunks = []; return; }
          const blob = new Blob(walkieChunks, { type: rec.mimeType || 'audio/mp4' });
          walkieChunks = [];
          const reader = new FileReader();
          reader.onload = () => {
            if (typeof reader.result !== 'string') return;
            if (supaRealtimeChan && activeVaultId) {
              try {
                supaRealtimeChan.send({
                  type: 'broadcast',
                  event: 'walkie_audio',
                  payload: { roomId, fromId: activeVaultId, fromName: state ? state.userProfile.name : '', audioData: reader.result }
                });
              } catch (_) {}
            }
            if (liveChannel && activeVaultId) {
              try { liveChannel.postMessage({ type: 'walkie_audio', roomId, fromId: activeVaultId, audioData: reader.result }); } catch (_) {}
            }
          };
          reader.readAsDataURL(blob);
        };
        try { rec.stop(); } catch (_) { cleanup(); }
      }

      function isNearChatBottom() {
        const feed = document.getElementById('message-feed');

      function setTurnConfig(urls, username, credential) {
        if (!urls) { try { localStorage.removeItem('shavlo_turn_cfg_v1'); } catch (e) {} return; }
        try { localStorage.setItem('shavlo_turn_cfg_v1', JSON.stringify({ urls, username: username || '', credential: credential || '' })); } catch (e) {}
      }

      async function subscribeToWebPush(vapidPublicKey) {
        if (!vapidPublicKey || !('serviceWorker' in navigator) || !('PushManager' in window) || !activeVaultId) return false;
        try {
          const reg = await navigator.serviceWorker.ready;
          const pad = '='.repeat((4 - vapidPublicKey.length % 4) % 4);
          const b64 = (vapidPublicKey + pad).replace(/-/g, '+').replace(/_/g, '/');
          const raw = atob(b64);
          const keyArr = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; i++) keyArr[i] = raw.charCodeAt(i);
          const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyArr });
          supaWriteReliable('shavlo_push_subs', 'POST', '', { vault_id: activeVaultId, subscription: sub.toJSON(), updated_at: Date.now() });
          return true;
        } catch (e) { return false; }
      }

      function getIceServers() {
        const servers = [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun.cloudflare.com:3478' }
        ];
        try {
          const rawTurn = localStorage.getItem('shavlo_turn_cfg_v1');
          if (rawTurn) {
            const t = JSON.parse(rawTurn);
            if (t && t.urls) servers.push({ urls: t.urls, username: t.username || '', credential: t.credential || '' });
          }
        } catch (e) {}
        return servers;
      }

      async function uploadMediaToSupabaseStorage(dataUrlOrFile, folder, extFallback) {
        const cfg = getSupaCfg();
        if (!cfg || !dataUrlOrFile) return typeof dataUrlOrFile === 'string' ? dataUrlOrFile : '';
        try {
          let blob = null;
          let ext = extFallback || 'jpg';
          if (typeof dataUrlOrFile === 'string') {
            if (!dataUrlOrFile.startsWith('data:')) return dataUrlOrFile;
            const res = await fetch(dataUrlOrFile);
            blob = await res.blob();
            if (blob.type && blob.type.includes('/')) ext = blob.type.split('/')[1].split(';')[0] || ext;
          } else if (dataUrlOrFile instanceof Blob) {
            blob = dataUrlOrFile;
            if (dataUrlOrFile.name && dataUrlOrFile.name.includes('.')) ext = dataUrlOrFile.name.split('.').pop().toLowerCase();
          }
          if (!blob) return typeof dataUrlOrFile === 'string' ? dataUrlOrFile : '';
          const safeFolder = String(folder || 'chat').replace(/[^a-z0-9_-]/gi, '');
          const objPath = `${safeFolder}/${activeVaultId || 'anon'}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${ext}`;
          const headers = { 'apikey': cfg.key, 'Content-Type': blob.type || 'application/octet-stream', 'x-upsert': 'true' };
          if (cfg.key && cfg.key.startsWith('eyJ')) headers['Authorization'] = 'Bearer ' + cfg.key;
          const upRes = await fetch(`${cfg.url}/storage/v1/object/shavlo-media/${objPath}`, {
            method: 'POST',
            headers,
            body: blob
          });
          if (!upRes.ok) throw new Error('Storage HTTP ' + upRes.status);
          return `${cfg.url}/storage/v1/object/public/shavlo-media/${objPath}`;
        } catch (e) {
          return typeof dataUrlOrFile === 'string' ? dataUrlOrFile : '';
        }
      }

      let roomOlderLoading = {};
      let roomHasNoMoreOlder = {};
      function markRoomRead(roomId) {
        if (!roomId || !activeVaultId || !state) return;
        const net = getNetwork();
        net.readReceipts = net.readReceipts || {};
        net.readReceipts[roomId] = net.readReceipts[roomId] || {};
        net.readReceipts[roomId][activeVaultId] = Date.now();
        saveNetwork(net, 'read_receipt');
        supaWriteReliable('shavlo_read_receipts', 'POST', '', {
          room_id: roomId, user_id: activeVaultId, last_read_at: net.readReceipts[roomId][activeVaultId]
        });
      }

      async function loadOlderMessages(roomId) {
        if (!roomId || !getSupaCfg() || roomOlderLoading[roomId]) return;
        roomOlderLoading[roomId] = true;
        render();
        try {
          const net = getNetwork();
          const cur = Array.isArray(net.peerChats[roomId]) ? net.peerChats[roomId] : [];
          const oldestTs = cur.length ? Math.min(...cur.map(m => Number(m.createdAt || Date.now()))) : Date.now();
          const rows = await supaFetch('shavlo_messages', 'GET', `?room_id=eq.${encodeURIComponent(roomId)}&created_at=lt.${oldestTs}&order=created_at.desc&limit=50`);
          if (!Array.isArray(rows) || rows.length < 50) roomHasNoMoreOlder[roomId] = true;
          if (Array.isArray(rows) && rows.length > 0) {
            const older = rows.reverse().map(r => Object.assign({}, (typeof r.payload === 'string' ? JSON.parse(r.payload) : (r.payload || {})), { id: r.id, authorId: r.author_id, authorName: r.author_name || '', createdAt: Number(r.created_at || Date.now()) }));
            const byId = new Map(older.map(m => [m.id, m]));
            cur.forEach(m => byId.set(m.id, m));
            net.peerChats[roomId] = Array.from(byId.values());
            saveNetwork(net, 'older_msgs');
          }
        } catch (e) {}
        roomOlderLoading[roomId] = false;
        render();
      }

      async function ensureWebRtcPeer(roomId, peerId, callType) {
        if (rtcPc) return rtcPc;
        if (typeof RTCPeerConnection === 'undefined') return null;
        const pc = new RTCPeerConnection({ iceServers: getIceServers() });
        rtcPc = pc;
        remoteMediaStream = new MediaStream();
        pc.ontrack = (ev) => {
          if (ev.streams && ev.streams[0]) {
            remoteMediaStream = ev.streams[0];
          } else if (ev.track) {
            remoteMediaStream.addTrack(ev.track);
          }
          renderCallOverlay();
        };
        pc.onicecandidate = (ev) => {
          if (ev.candidate) {
            sendWebRtcSignal(roomId, peerId, { kind: 'ice', candidate: ev.candidate.toJSON() });
          }
        };
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          try {
            if (!localMediaStream) {
              localMediaStream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: callType === 'video'
              });
            }
            localMediaStream.getTracks().forEach(track => pc.addTrack(track, localMediaStream));
            renderCallOverlay();
          } catch (e) { /* mic/cam unavailable — continue call signaling gracefully */ }
        }
        return pc;
      }

      async function startWebRtcOffer(roomId, peerId, callType) {
        try {
          const pc = await ensureWebRtcPeer(roomId, peerId, callType);
          if (!pc) return;
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          sendWebRtcSignal(roomId, peerId, { kind: 'offer', sdp: offer });
        } catch (e) {}
      }

      async function handleWebRtcSignal(payload) {
        if (!payload || !ui.activeCall || payload.fromId === activeVaultId) return;
        if (payload.roomId !== ui.activeCall.roomId) return;
        if (payload.toId && payload.toId !== activeVaultId) return;
        const sig = payload.data || {};
        try {
          const pc = await ensureWebRtcPeer(payload.roomId, payload.fromId, ui.activeCall.type);
          if (!pc) return;
          if (sig.kind === 'offer' && sig.sdp) {
            await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sendWebRtcSignal(payload.roomId, payload.fromId, { kind: 'answer', sdp: answer });
          } else if (sig.kind === 'answer' && sig.sdp) {
            if (pc.signalingState !== 'stable') {
              await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
            }
          } else if (sig.kind === 'ice' && sig.candidate) {
            await pc.addIceCandidate(new RTCIceCandidate(sig.candidate));
          }
        } catch (e) {}
      }

      // Offline Outbox Queue so messages never drop on flaky mobile networks
      function getOutbox() {
        try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); } catch (e) { return []; }
      }
      function enqueueOutbox(op) {
        const q = getOutbox();
        q.push(op);
        try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(q.slice(-100))); } catch (e) {}
      }
      async function flushOutbox() {
        if (!getSupaCfg()) return;
        const q = getOutbox();
        if (!q.length) return;
        const remaining = [];
        for (const op of q) {
          try {
            await supaFetch(op.table, op.method, op.query, op.body);
          } catch (e) {
            const msg = String((e && e.message) || '');
            if (!/^HTTP 4(?!29)/.test(msg)) remaining.push(op);
          }
        }
        try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(remaining)); } catch (e) {}
      }

      async function supaFetch(table, method, query, body) {
        const cfg = getSupaCfg();
        if (!cfg) return null;
        const headers = {
          'apikey': cfg.key,
          'Content-Type': 'application/json'
        };
        if (cfg.key && cfg.key.startsWith('eyJ')) {
          headers['Authorization'] = 'Bearer ' + cfg.key;
        }
        if (method === 'POST') headers['Prefer'] = 'resolution=merge-duplicates,return=minimal';
        else if (method === 'PATCH' || method === 'DELETE') headers['Prefer'] = 'return=minimal';
        const res = await fetch(`${cfg.url}/rest/v1/${table}${query || ''}`, {
          method: method || 'GET',
          headers,
          body: body ? JSON.stringify(body) : undefined
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        if (method === 'GET') return res.json();
        return true;
      }

      function supaWriteReliable(table, method, query, body) {
        if (!getSupaCfg()) return;
        supaFetch(table, method, query, body).catch(() => {
          enqueueOutbox({ table, method, query, body });
        });
      }

      async function pushUserToSupabase() {
        if (!activeVaultId || !state || !getSupaCfg()) return;
        supaWriteReliable('shavlo_users', 'POST', '', {
          vault_id: activeVaultId,
          friend_code: state.userProfile.friendCode,
          name: state.userProfile.name,
          upi_id: state.userProfile.upiId || '',
          avatar_text: getInitial(state.userProfile.name),
          avatar_url: safeImgUrl(state.userProfile.avatarUrl) || '',
          updated_at: Date.now()
        });
      }

      let supaSyncInFlight = false;
      let supaSyncDebounceTimer = null;
      let lastSupaMsgCreatedAt = 0;
      let supaSyncTickCount = 0;
      let lastSyncedNetDigest = '';

      function scheduleSupaSync(delayMs = 250) {
        clearTimeout(supaSyncDebounceTimer);
        supaSyncDebounceTimer = setTimeout(() => { syncWithSupabase(); }, delayMs);
      }

      let lastSupaSyncAt = 0;
      async function syncWithSupabase(forceFull = false) {
        if (!activeVaultId || !state || !getSupaCfg() || supaSyncInFlight) return;
        const nowS = Date.now();
        if (!forceFull && (nowS - lastSupaSyncAt) < 2500) return;
        lastSupaSyncAt = nowS;
        supaSyncInFlight = true;
        try {
          await flushOutbox();
          supaSyncTickCount += 1;
          const fetchUsers = forceFull || supaSyncTickCount === 1 || (supaSyncTickCount % 4 === 0);
          const fetchStatuses = forceFull || supaSyncTickCount === 1 || (supaSyncTickCount % 2 === 0);
          const sinceTs = Math.max(0, lastSupaMsgCreatedAt - 15000);
          const msgQuery = (!forceFull && lastSupaMsgCreatedAt > 0)
            ? `?select=*&created_at=gt.${sinceTs}&order=created_at.asc&limit=150`
            : '?select=*&order=created_at.desc&limit=150';

          const vidEnc = encodeURIComponent(activeVaultId);
          const [users, reqs, friends, groups, msgsRaw, statuses, calls, readReceipts] = await Promise.all([
            fetchUsers ? supaFetch('shavlo_users', 'GET', '?select=*') : Promise.resolve(null),
            supaFetch('shavlo_requests', 'GET', `?select=*&or=(from_id.eq.${vidEnc},to_id.eq.${vidEnc})`),
            supaFetch('shavlo_friendships', 'GET', `?select=*&or=(user_a.eq.${vidEnc},user_b.eq.${vidEnc})`),
            supaFetch('shavlo_groups', 'GET', '?select=*'),
            supaFetch('shavlo_messages', 'GET', msgQuery),
            fetchStatuses ? supaFetch('shavlo_statuses', 'GET', `?select=*&expires_at=gt.${Date.now()}`) : Promise.resolve(null),
            supaFetch('shavlo_calls', 'GET', `?select=*&or=(caller_id.eq.${vidEnc},callee_id.eq.${vidEnc})`).catch(() => []),
            supaFetch('shavlo_read_receipts', 'GET', '?select=*').catch(() => [])
          ]);
          const msgs = (!forceFull && lastSupaMsgCreatedAt > 0) ? (msgsRaw || []) : (msgsRaw || []).slice().reverse();
          if (msgs.length > 0) {
            const maxTs = Math.max(...msgs.map(m => Number(m.created_at || 0)));
            if (maxTs > lastSupaMsgCreatedAt) lastSupaMsgCreatedAt = maxTs;
          }

          const net = getNetwork();
          (users || []).forEach(u => {
            net.directory[u.vault_id] = {
              vaultId: u.vault_id,
              friendCode: u.friend_code,
              name: u.name,
              upiId: u.upi_id || '',
              avatarText: u.avatar_text || getInitial(u.name),
              avatarUrl: u.avatar_url || '',
              lastSeen: u.updated_at || Date.now()
            };
          });
          net.requests = (reqs || []).map(r => ({
            id: r.id, fromId: r.from_id, fromName: r.from_name, fromCode: r.from_code,
            toId: r.to_id, toName: r.to_name, toCode: r.to_code, time: r.created_time || ''
          }));
          net.friendships = (friends || []).map(f => ({
            id: f.id, users: [f.user_a, f.user_b], since: f.since || ''
          }));
          net.groups = (groups || []).map(g => ({
            id: g.id, code: g.code, name: g.name, desc: g.description || '',
            creatorId: g.creator_id, memberIds: Array.isArray(g.member_ids) ? g.member_ids : [],
            createdAt: g.created_at || Date.now()
          }));
          const groupedMsgs = {};
          (msgs || []).forEach(row => {
            groupedMsgs[row.room_id] = groupedMsgs[row.room_id] || [];
            groupedMsgs[row.room_id].push(Object.assign({}, row.payload, {
              id: row.id, authorId: row.author_id, authorName: row.author_name || ''
            }));
          });
          Object.keys(groupedMsgs).forEach(rid => {
            const existing = Array.isArray(net.peerChats[rid]) ? net.peerChats[rid] : [];
            const byId = new Map(existing.map(m => [m.id, m]));
            groupedMsgs[rid].forEach(m => byId.set(m.id, Object.assign({}, byId.get(m.id) || {}, m)));
            net.peerChats[rid] = Array.from(byId.values());
          });
          if (statuses !== null) {
            net.statuses = (statuses || []).map(st => Object.assign({}, st.payload, {
              id: st.id, authorId: st.author_id, authorName: st.author_name, expiresAt: st.expires_at
            }));
          }
          net.activeCalls = {};
          (calls || []).forEach(c => {
            net.activeCalls[c.room_id] = {
              roomId: c.room_id, callerId: c.caller_id, callerName: c.caller_name,
              calleeId: c.callee_id, calleeName: c.callee_name, type: c.call_type,
              status: c.status, startedAt: c.started_at
            };
          });

          net.readReceipts = net.readReceipts || {};
          (readReceipts || []).forEach(rr => {
            net.readReceipts[rr.room_id] = net.readReceipts[rr.room_id] || {};
            net.readReceipts[rr.room_id][rr.user_id] = Number(rr.last_read_at || 0);
          });
          saveNetwork(net, 'cloud_sync');
          if (supaStatus !== 'realtime') supaStatus = 'connected';
          supaLastError = '';
          syncFromNetwork();
        } catch (err) {
          const msg = (err && err.message) ? String(err.message) : '';
          const isSandboxed = (window.location.origin === 'null' || window.location.protocol === 'about:' || window.location.protocol === 'file:' || window.location.protocol === 'blob:');
          if (isSandboxed && /failed to fetch|networkerror|load failed/i.test(msg)) {
            supaStatus = 'local';
            supaLastError = '';
          } else if (/404|PGRST205|does not exist/i.test(msg)) {
            supaStatus = 'error';
            supaLastError = 'Tables missing in Supabase — copy SQL Setup & run it in Supabase SQL Editor.';
          } else if (/401|403|invalid api key/i.test(msg)) {
            supaStatus = 'error';
            supaLastError = 'Invalid Supabase key — check Project Settings -> API Keys.';
          } else {
            supaStatus = 'error';
            supaLastError = 'Supabase sync error (' + (msg || 'check URL/key & SQL') + ')';
          }
          render();
        } finally {
          supaSyncInFlight = false;
        }
      }

      function startSupaPolling() {
        stopSupaPolling();
        const cfg = getSupaCfg();
        if (!cfg) { supaStatus = 'local'; syncOwnPresence(false, true); return; }
        pushUserToSupabase().then(() => syncWithSupabase());

        // Start instant Supabase Realtime WebSocket subscription if SDK loaded
        try {
          if (window.supabase && typeof window.supabase.createClient === 'function') {
            supaClient = window.supabase.createClient(cfg.url, cfg.key);
            supaRealtimeChan = supaClient
              .channel('shavlo-live-all', { config: { presence: { key: activeVaultId || 'anon' } } })
              .on('postgres_changes', { event: '*', schema: 'public', table: 'shavlo_messages' }, (change) => {
                try {
                  if (change && (change.eventType === 'INSERT' || change.eventType === 'UPDATE') && change.new && change.new.id && change.new.room_id) {
                    const row = change.new;
                    const net = getNetwork();
                    const list = Array.isArray(net.peerChats[row.room_id]) ? net.peerChats[row.room_id] : [];
                    const rawPl = (typeof row.payload === "string") ? JSON.parse(row.payload) : (row.payload || {});
                    const mapped = Object.assign({}, rawPl, { id: row.id, authorId: row.author_id, authorName: row.author_name || "", createdAt: Number(row.created_at || rawPl.createdAt || Date.now()) });
                    const idx = list.findIndex(m => m.id === row.id);
                    if (idx >= 0) list[idx] = Object.assign({}, list[idx], mapped);
                    else list.push(mapped);
                    net.peerChats[row.room_id] = list;
                    if (Number(row.created_at || 0) > lastSupaMsgCreatedAt) lastSupaMsgCreatedAt = Number(row.created_at || 0);
                    saveNetwork(net, 'realtime_msg');
                    if (change.eventType === 'INSERT' && mapped.authorId !== activeVaultId) {
                      notifyIncomingMessage(mapped, mapped.authorName, row.room_id);
                      const isOpenNow = (!document.hidden && state && state.activeNav === 'messages' && state.selectedChatId === row.room_id && (window.innerWidth >= 768 || state.mobileView === 'chat'));
                      if (isOpenNow) markRoomRead(row.room_id);
                    }
                    syncFromNetwork();
                    return;
                  }
                  if (change && change.eventType === 'DELETE' && change.old && change.old.id) {
                    const delId = change.old.id;
                    const net = getNetwork();
                    let changed = false;
                    Object.keys(net.peerChats || {}).forEach(rid => {
                      const before = (net.peerChats[rid] || []).length;
                      net.peerChats[rid] = (net.peerChats[rid] || []).filter(m => m.id !== delId);
                      if (net.peerChats[rid].length !== before) changed = true;
                    });
                    if (changed) { saveNetwork(net, 'realtime_del'); syncFromNetwork(); }
                    return;
                  }
                } catch (_) {}
                scheduleSupaSync(200);
              })
              .on('postgres_changes', { event: '*', schema: 'public', table: 'shavlo_requests' }, () => scheduleSupaSync(250))
              .on('postgres_changes', { event: '*', schema: 'public', table: 'shavlo_friendships' }, () => scheduleSupaSync(250))
              .on('postgres_changes', { event: '*', schema: 'public', table: 'shavlo_groups' }, () => scheduleSupaSync(250))
              .on('postgres_changes', { event: '*', schema: 'public', table: 'shavlo_calls' }, () => scheduleSupaSync(80))
              .on('postgres_changes', { event: '*', schema: 'public', table: 'shavlo_statuses' }, () => scheduleSupaSync(250))
              .on('postgres_changes', { event: '*', schema: 'public', table: 'shavlo_read_receipts' }, () => scheduleSupaSync(250))
              .on('broadcast', { event: 'ring_ping' }, ({ payload }) => {
                if (payload && payload.fromId !== activeVaultId) triggerRingPing(payload.roomId, payload.fromName, true);
              })
              .on('broadcast', { event: 'typing' }, ({ payload }) => {
                if (payload && payload.fromId !== activeVaultId && payload.roomId) markRemoteTyping(payload.roomId);
              })
              .on('broadcast', { event: 'webrtc_signal' }, ({ payload }) => {
                handleWebRtcSignal(payload);
              })
              .on('broadcast', { event: 'walkie_audio' }, ({ payload }) => {
                if (payload && payload.fromId !== activeVaultId && payload.audioData) {
                  playSubtleTone('walkie_on');
                  ui.walkieActive = true;
                  ui.walkieChatId = payload.roomId;
                  ui.walkiePeerSpeaking = true;
                  safeBackgroundRender();
                  try {
                    const wa = new Audio(payload.audioData);
                    wa.onended = () => { ui.walkiePeerSpeaking = false; safeBackgroundRender(); };
                    wa.play().catch(() => {});
                  } catch (_) {}
                  clearTimeout(walkieDemoTimer);
                  walkieDemoTimer = setTimeout(() => { ui.walkiePeerSpeaking = false; safeBackgroundRender(); }, 4500);
                }
              })
              .on('presence', { event: 'sync' }, () => {
                try {
                  const pState = supaRealtimeChan.presenceState() || {};
                  const nextOnline = {};
                  const nextRooms = {};
                  Object.values(pState).forEach(entries => {
                    (entries || []).forEach(entry => {
                      if (entry && entry.vault_id && entry.vault_id !== activeVaultId && entry.show_online !== false) {
                        nextOnline[entry.vault_id] = Date.now();
                        if (entry.active_room) nextRooms[entry.vault_id] = entry.active_room;
                      }
                    });
                  });
                  Object.keys(ui.onlineVaultIds || {}).forEach(vid => {
                    if (!nextOnline[vid]) scheduleOfflineGrace(vid);
                  });
                  Object.keys(nextOnline).forEach(vid => {
                    delete ui.offlineGraceUntil[vid];
                    clearTimeout(offlineGraceTimers[vid]);
                  });
                  ui.onlineVaultIds = nextOnline;
                  ui.peerActiveRooms = nextRooms;
                  safeBackgroundRender();
                } catch (e) {}
              })
              .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                  supaStatus = 'realtime';
                  syncOwnPresence();
                  safeBackgroundRender();
                } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
                  if (supaStatus === 'realtime') supaStatus = 'connected';
                  setTimeout(() => { if (activeVaultId && state && getSupaCfg()) startSupaPolling(); }, 3500);
                }
              });
          }

          if (!activeVaultId || !state || !getSupaCfg()) return;

        const digest = [
          msgDigest,
          (net.requests || []).length,
          (net.friendships || []).length,
          (net.groups || []).length,
          (net.statuses || []).length,
          ui.activeCall ? (ui.activeCall.roomId + ':' + ui.activeCall.status) : ''

      let audioCtx = null;
      function playSubtleTone(type) {
        if (state && state.security && state.security.sounds === false) return;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          if (!audioCtx) audioCtx = new Ctx();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          const now = audioCtx.currentTime;
          if (type === 'tick') {
            osc.frequency.setValueAtTime(540, now);
            osc.frequency.exponentialRampToValueAtTime(820, now + 0.018);
            gain.gain.setValueAtTime(0.018, now);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.028);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.03);
          } else if (type === 'walkie_on') {
            osc.frequency.setValueAtTime(620, now);
            osc.frequency.exponentialRampToValueAtTime(1040, now + 0.07);
            gain.gain.setValueAtTime(0.035, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.14);
          } else if (type === 'walkie_off') {
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(520, now + 0.07);
            gain.gain.setValueAtTime(0.03, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.13);
          } else if (type === 'ping') {
            osc.frequency.setValueAtTime(740, now);
            osc.frequency.exponentialRampToValueAtTime(988, now + 0.08);
            gain.gain.setValueAtTime(0.03, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.17);
          } else if (type === 'pay') {
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.11);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.23);
          } else {
            osc.frequency.setValueAtTime(type === 'receive' ? 520 : 660, now);
            osc.frequency.exponentialRampToValueAtTime(type === 'receive' ? 620 : 780, now + 0.06);
            gain.gain.setValueAtTime(0.035, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.1);
          }
        } catch (e) { /* ignore audio restrictions */ }
      }

          const entry = state.security.blockedIds[chatId];
          delete state.security.blockedIds[chatId];
          if (entry && entry.savedChat) {
            state.chats.push(entry.savedChat);
          }
          persistCurrentVault();
          showToast(`Unblocked ${chatName || (entry && entry.name) || 'user'}`);
          return;
        }
        // Blocking: mark read, remove/delete the chat, and unfriend if connected via Friend Code
        let peerVaultId = null;
        let savedChat = null;
        if (chatId && chatId.startsWith('peer_')) {
          const net = getNetwork();
          const fIdx = net.friendships.findIndex(f => f.users.includes(activeVaultId) && makeRoomId(f.users[0], f.users[1]) === chatId);
          if (fIdx !== -1) {
            peerVaultId = net.friendships[fIdx].users.find(id => id !== activeVaultId) || null;
            net.friendships.splice(fIdx, 1);
          }
          delete net.peerChats[chatId];
          net.requests = (net.requests || []).filter(r => !(
            (r.fromId === activeVaultId && r.toId === peerVaultId) ||
            (r.fromId === peerVaultId && r.toId === activeVaultId)
          ));
          saveNetwork(net, 'friend_blocked');
        } else {
          const existing = state.chats.find(c => c.id === chatId);
          if (existing) {
            existing.unread = 0;
            savedChat = { ...existing, messages: [] };
            state.chats = state.chats.filter(c => c.id !== chatId);
          }
        }
        state.security.blockedIds[chatId] = {
          name: chatName || 'User',
          peerVaultId,
          savedChat,
          time: nowTime()
        };
        if (state.selectedChatId === chatId) {
          const nextChats = getMergedChats();
          state.selectedChatId = (nextChats[0] && nextChats[0].id) || null;
          state.mobileView = 'list';
        }
        persistCurrentVault();
        showToast(`Blocked ${chatName || 'user'} • Unfriended & chat deleted`);
      }

      function isValidUpiId(id) {
        return /^[a-zA-Z0-9._-]{2,64}@[a-zA-Z]{2,32}$/.test(String(id || '').trim());
      }

      function getTodaySpend() {
        if (!state || !state.upiHistory) return 0;
        return state.upiHistory
          .filter(tx => tx.direction === 'sent' && tx.status !== 'Refunded' && String(tx.date || '').startsWith('Today'))
          .reduce((s, tx) => s + (Number(tx.amount) || 0), 0);
      }

      function getActiveStatuses() {
        if (!state) return [];
        const now = Date.now();
        const net = getNetwork();
        const myFriendIds = new Set(
          net.friendships
            .filter(f => f.users.includes(activeVaultId))
            .map(f => f.users.find(id => id !== activeVaultId))
        );
        const liveStatuses = (net.statuses || []).filter(st =>
          st.expiresAt > now && (st.authorId === activeVaultId || myFriendIds.has(st.authorId))
        );
        const samples = (state.sampleStatuses || []).filter(st => st.expiresAt > now);
        return [...liveStatuses, ...samples].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      }

      function formatRemaining24h(expiresAt) {
        const ms = Math.max(0, (expiresAt || 0) - Date.now());
        const hrs = Math.floor(ms / 3600000);
        const mins = Math.floor((ms % 3600000) / 60000);
        if (hrs >= 1) return `${hrs}h left`;
        return `${Math.max(1, mins)}m left`;
      }

      function postNew24hStatus(text, bg, photoUrl) {
        const clean = String(text || '').trim();
        if (!clean && !photoUrl) { showToast('Add text or a photo for your status'); return; }
        const now = Date.now();
        const net = getNetwork();
        net.statuses.unshift({
          id: 'st_' + now,
          authorId: activeVaultId,
          chatId: null,
          authorName: state.userProfile.name,
          avatarText: getInitial(state.userProfile.name),
          avatarUrl: state.userProfile.avatarUrl || '',
          text: clean,
          bg: bg || 'from-[#111113] to-[#4F46E5]',
          photoUrl: photoUrl || '',
          createdAt: now,
          expiresAt: now + 24 * 60 * 60 * 1000,
          seenBy: [activeVaultId]
        });
        saveNetwork(net, 'status_posted');
        if (net.statuses[0]) {
          const stObj = net.statuses[0];
          supaWriteReliable('shavlo_statuses', 'POST', '', {
            id: stObj.id, author_id: activeVaultId, author_name: state.userProfile.name,
            payload: stObj, expires_at: stObj.expiresAt
          });
        }
        ui.modal = null;
        ui.statusDraftText = '';
        ui.statusDraftPhoto = '';
        render();
        showToast('Status posted for 24 hours');
      }


      function getMergedChats() {
        if (!state) return [];
        ensureSecurityDefaults();
        const nowMs = Date.now();
        const net = getNetwork();
        const myFriendships = net.friendships.filter(f => f.users.includes(activeVaultId));
        const peerChats = myFriendships.map(f => {
          const otherId = f.users.find(id => id !== activeVaultId);
          const other = net.directory[otherId] || { name: 'Friend', friendCode: 'SMV-PEER', upiId: 'friend@upi', avatarText: 'F' };
          const roomId = makeRoomId(activeVaultId, otherId);
          const peerReadAt = (net.readReceipts && net.readReceipts[roomId] && net.readReceipts[roomId][otherId]) || 0;
          const rawMsgs = (net.peerChats[roomId] || [])
            .filter(m => !m.expiresAt || m.expiresAt > nowMs)
            .map(m => {
              const isMine = m.authorId === activeVaultId;
              const liveStatus = isMine
                ? ((peerReadAt > 0 && Number(m.createdAt || 0) <= peerReadAt) ? 'read' : (m.status || 'delivered'))
                : m.status;
              return {
                ...m,
                status: liveStatus,
                text: m.text || '',
                sender: isMine ? 'me' : 'other',
                senderName: isMine ? 'You' : other.name
              };
            });
          const lastMsg = rawMsgs[rawMsgs.length - 1];
          return {
            id: roomId,
            isPeer: true,
            peerVaultId: otherId,
            name: other.name,
            subtitle: `Friend • ${other.friendCode}`,
            avatarText: other.avatarText || getInitial(other.name),
            avatarUrl: other.avatarUrl || '',
            category: 'personal',
            isGroup: false,
            verified: true,
            pinned: true,
            muted: !!(state.security && state.security.mutedChatIds && state.security.mutedChatIds[roomId]),
            disappearing: false,
            unread: (() => {
              const myReadAt = (net.readReceipts && net.readReceipts[roomId] && net.readReceipts[roomId][activeVaultId]) || 0;
              return rawMsgs.filter(m => m.sender === 'other' && Number(m.createdAt || 0) > myReadAt).length;
            })(),
            upiId: other.upiId || 'friend@upi',
            phone: other.friendCode,
            lastTime: lastMsg ? lastMsg.time : 'Now',
            messages: rawMsgs
          };
        });
        state.chats.forEach(c => {
          if (Array.isArray(c.messages) && c.messages.some(m => m.expiresAt && m.expiresAt <= nowMs)) {
            c.messages = c.messages.filter(m => !m.expiresAt || m.expiresAt > nowMs);
          }
        });
        const localChats = state.chats;
        const liveGroups = (net.groups || [])
          .filter(g => Array.isArray(g.memberIds) && g.memberIds.includes(activeVaultId))
          .map(g => {
            const rawMsgs = (net.peerChats[g.id] || [])
              .filter(m => !m.expiresAt || m.expiresAt > nowMs)
              .map(m => {
                const author = net.directory[m.authorId];
                return {
                  ...m,
                  text: m.text || '',
                  sender: m.authorId === activeVaultId ? 'me' : 'other',
                  senderName: m.authorId === activeVaultId ? 'You' : ((author && author.name) || m.authorName || 'Member')
                };
              });
            const lastMsg = rawMsgs[rawMsgs.length - 1];
            const memberNames = g.memberIds.map(id => id === activeVaultId ? 'You' : ((net.directory[id] && net.directory[id].name) || 'Member'));
            return {
              id: g.id,
              isPeer: true,
              isLiveGroup: true,
              groupCode: g.code,
              name: g.name,
              subtitle: `${g.memberIds.length} member${g.memberIds.length === 1 ? '' : 's'} • ${g.code}`,
              avatarText: getInitial(g.name),
              category: 'personal',
              isGroup: true,
              memberIds: g.memberIds,
              members: memberNames,
              verified: false,
              pinned: false,
              muted: false,
              disappearing: false,
              unread: 0,
              upiId: g.upiId || state.userProfile.upiId,
              phone: 'Group Code: ' + g.code,
              lastTime: lastMsg ? lastMsg.time : 'New',
              messages: rawMsgs
            };
          });
        return [...liveGroups, ...peerChats, ...localChats];
      }

      function getSelectedChat() {
        const all = getMergedChats();
        return all.find(c => c.id === state.selectedChatId) || all[0] || null;
      }

      function getLastPreview(chat) {
        if (!chat.messages || chat.messages.length === 0) return 'Connected — say hello';
        const last = chat.messages[chat.messages.length - 1];
        if (last.type === 'upi') return `UPI ${formatRupees(last.amount)} • ${last.note || 'Payment'}`;
        if (last.type === 'split') return `Split Bill: ${last.title}`;
        if (last.type === 'poll') return `Poll: ${last.question}`;
        if (last.type === 'voice') return `Voice note (${last.duration})`;
        if (last.type === 'order') return `Store Order (${formatRupees(last.total)})`;
        return last.text;
      }

      // Friend Requests & Live Networking
      function createLiveGroup(name, desc, inviteFriendIds) {
        const cleanName = String(name || '').trim();
        if (!cleanName) { showToast('Enter a group name'); return; }
        const net = getNetwork();
        const gid = 'grp_' + Date.now();
        const code = 'GRP-' + syncHash(gid + cleanName).slice(0, 4) + '-' + syncHash(cleanName + activeVaultId).slice(0, 4);
        const members = Array.from(new Set([activeVaultId, ...(inviteFriendIds || [])]));
        net.groups.unshift({
          id: gid,
          code,
          name: cleanName,
          desc: String(desc || '').trim() || 'Private group chat',
          creatorId: activeVaultId,
          memberIds: members,
          createdAt: Date.now()
        });
        net.peerChats[gid] = [{
          id: 'm_grp_' + Date.now(),
          authorId: activeVaultId,
          authorName: state.userProfile.name,
          type: 'text',
          text: `Created "${cleanName}". Share code ${code} so others can join!`,
          time: nowTime(),
          status: 'read',
          reactions: ['🎉'],
          starred: false
        }];
        saveNetwork(net, 'group_created');
        supaWriteReliable('shavlo_groups', 'POST', '', {
          id: gid, code, name: cleanName, description: String(desc || '').trim() || 'Private group chat',
          creator_id: activeVaultId, member_ids: members, created_at: Date.now()
        });
        const initGrpMsg = net.peerChats[gid][0];
        if (initGrpMsg) {
          supaWriteReliable('shavlo_messages', 'POST', '', {
            id: initGrpMsg.id, room_id: gid, author_id: activeVaultId,
            author_name: state.userProfile.name, payload: initGrpMsg, created_at: Date.now()
          });
        }
        ui.modal = null;
        state.selectedChatId = gid;
        state.activeNav = 'messages';
        state.mobileView = 'chat';
        persistCurrentVault();
        render();
        scrollToBottom();
        showToast(`Group created • Code: ${code}`);
      }

      async function joinLiveGroupByCode(rawCode) {
        const code = String(rawCode || '').trim().toUpperCase();
        if (!code) { showToast('Enter a Group Code (e.g. GRP-XXXX-XXXX)'); return; }
        const net = getNetwork();
        let grp = (net.groups || []).find(g => g.code === code);
        if (!grp && getSupaCfg()) {
          showToast('Looking up group on Supabase...');
          try {
            const rows = await supaFetch('shavlo_groups', 'GET', `?code=eq.${encodeURIComponent(code)}&select=*`);
            if (Array.isArray(rows) && rows.length > 0) {
              const g = rows[0];
              grp = {
                id: g.id, code: g.code, name: g.name, desc: g.description || '',
                creatorId: g.creator_id, memberIds: Array.isArray(g.member_ids) ? g.member_ids : [],
                createdAt: g.created_at || Date.now()
              };
              net.groups.unshift(grp);
            }
          } catch (e) {}
        }
        if (!grp) { showToast('No group found with that code'); return; }
        if (!grp.memberIds.includes(activeVaultId)) {
          grp.memberIds.push(activeVaultId);
          net.peerChats[grp.id] = net.peerChats[grp.id] || [];
          const joinMsg = {
            id: 'm_join_' + Date.now(),
            authorId: activeVaultId,
            authorName: state.userProfile.name,
            type: 'text',
            text: `${state.userProfile.name} joined the group via code!`,
            time: nowTime(),
            status: 'read',
            reactions: ['👋'],
            starred: false
          };
          net.peerChats[grp.id].push(joinMsg);
          saveNetwork(net, 'group_joined');
          supaWriteReliable('shavlo_groups', 'PATCH', `?id=eq.${encodeURIComponent(grp.id)}`, { member_ids: grp.memberIds });
          supaWriteReliable('shavlo_messages', 'POST', '', {
            id: joinMsg.id, room_id: grp.id, author_id: activeVaultId,
            author_name: state.userProfile.name, payload: joinMsg, created_at: Date.now()
          });
        }
        ui.modal = null;
        ui.groupCodeInput = '';
        state.selectedChatId = grp.id;
        state.activeNav = 'messages';
        state.mobileView = 'chat';
        persistCurrentVault();
        render();
        scrollToBottom();
        showToast(`Joined ${grp.name}`);
      }

      function leaveLiveGroup(gid) {
        const net = getNetwork();
        const grp = (net.groups || []).find(g => g.id === gid);
        if (!grp) return;
        grp.memberIds = grp.memberIds.filter(id => id !== activeVaultId);
        if (grp.memberIds.length === 0) {
          net.groups = net.groups.filter(g => g.id !== gid);
          delete net.peerChats[gid];
          supaWriteReliable('shavlo_groups', 'DELETE', `?id=eq.${encodeURIComponent(gid)}`, null);
        } else {
          supaWriteReliable('shavlo_groups', 'PATCH', `?id=eq.${encodeURIComponent(gid)}`, { member_ids: grp.memberIds });
        }
        saveNetwork(net, 'group_left');
        if (state.selectedChatId === gid) {
          const next = getMergedChats();
          state.selectedChatId = (next[0] && next[0].id) || null;
          state.mobileView = 'list';
        }
        ui.modal = null;
        render();
        showToast(`Left ${grp.name}`);
      }

      async function sendFriendRequestByCode(rawCode) {
        const code = String(rawCode || '').trim().toUpperCase();
        if (!code) { showToast('Enter a unique code'); return; }
        if (!/^(\d{6,9}|[A-F0-9]{16,64}|SMV-[A-Z0-9]{4}-[A-Z0-9]{4})$/.test(code)) { showToast('Enter a valid friend code'); return; }
        if (code === state.userProfile.friendCode) { showToast('That is your own code'); return; }
        const net = getNetwork();
        let target = Object.values(net.directory).find(u => u.friendCode === code);

        // Live Supabase lookup so brand-new accounts on another phone are found immediately
        if (!target && getSupaCfg()) {
          showToast('Looking up code on Supabase...');
          try {
            const rows = await supaFetch('shavlo_users', 'GET', `?friend_code=eq.${encodeURIComponent(code)}&select=*`);
            if (Array.isArray(rows) && rows.length > 0) {
              const u = rows[0];
              target = {
                vaultId: u.vault_id,
                friendCode: u.friend_code,
                name: u.name,
                upiId: u.upi_id || '',
                avatarText: u.avatar_text || getInitial(u.name),
                avatarUrl: u.avatar_url || '',
                lastSeen: u.updated_at || Date.now()
              };
              net.directory[u.vault_id] = target;
              saveNetwork(net, 'directory_update');
            }
          } catch (e) { /* handled below */ }
        }

        if (!target) {
          if (getSupaCfg()) {
            showToast('Code not found on Supabase yet — make sure your friend signed in with Cloud Sync');
          } else {
            showToast('Account not found on this device — connect Supabase in Settings to add friends on other phones');
          }
          return;
        }
        const blockedRoom = makeRoomId(activeVaultId, target.vaultId);
        if (isChatBlocked(blockedRoom)) { showToast(`Unblock ${target.name} in Settings before adding again`); return; }
        const alreadyFriends = net.friendships.some(f => f.users.includes(activeVaultId) && f.users.includes(target.vaultId));
        if (alreadyFriends) { showToast(`Already friends with ${target.name}`); return; }
        const existingReq = net.requests.find(r =>
          (r.fromId === activeVaultId && r.toId === target.vaultId) ||
          (r.fromId === target.vaultId && r.toId === activeVaultId)
        );
        if (existingReq) { showToast('Request already pending'); return; }

        const newReq = {
          id: 'req_' + Date.now(),
          fromId: activeVaultId,
          fromName: state.userProfile.name,
          fromCode: state.userProfile.friendCode,
          toId: target.vaultId,
          toName: target.name,
          toCode: target.friendCode,
          time: nowTime()
        };
        net.requests.push(newReq);
        saveNetwork(net, 'friend_request');
        supaWriteReliable('shavlo_requests', 'POST', '', {
          id: newReq.id, from_id: newReq.fromId, from_name: newReq.fromName, from_code: newReq.fromCode,
          to_id: newReq.toId, to_name: newReq.toName, to_code: newReq.toCode, created_time: newReq.time
        });
        ui.friendCodeInput = '';
        render();
        showToast(`Friend request sent to ${target.name}`);
      }

      function respondFriendRequest(reqId, accept) {
        const net = getNetwork();
        const idx = net.requests.findIndex(r => r.id === reqId);
        if (idx === -1) return;
        const req = net.requests[idx];
        net.requests.splice(idx, 1);

        if (accept) {
          const frId = 'fr_' + Date.now();
          if (!net.friendships.some(f => f.users.includes(req.fromId) && f.users.includes(req.toId))) {
            net.friendships.push({ id: frId, users: [req.fromId, req.toId], since: nowTime() });
            supaWriteReliable('shavlo_friendships', 'POST', '', { id: frId, user_a: req.fromId, user_b: req.toId, since: nowTime() });
          }
          supaWriteReliable('shavlo_requests', 'DELETE', `?id=eq.${encodeURIComponent(req.id)}`, null);
          const roomId = makeRoomId(req.fromId, req.toId);
          if (!net.peerChats[roomId]) {
            const welcomeMsg = {
              id: 'm_welcome_' + Date.now(),
              authorId: activeVaultId,
              authorName: state.userProfile.name,
              type: 'text',
              text: 'Connected via Unique Code. You can now message, pay via UPI, or start a Voice/Video Call.',
              time: nowTime(),
              status: 'read',
              reactions: [],
              starred: false
            };
            net.peerChats[roomId] = [welcomeMsg];
            supaWriteReliable('shavlo_messages', 'POST', '', {
              id: welcomeMsg.id, room_id: roomId, author_id: activeVaultId,
              author_name: state.userProfile.name, payload: welcomeMsg, created_at: Date.now()
            });
          }
          saveNetwork(net, 'friend_accepted');
          ui.modal = null;
          state.selectedChatId = roomId;
          state.activeNav = 'messages';
          state.mobileView = 'chat';
          persistCurrentVault();
          syncOwnPresence();
          render();
          scrollToBottom();
          showToast(`Connected with ${req.fromName}`);
        } else {
          supaWriteReliable('shavlo_requests', 'DELETE', `?id=eq.${encodeURIComponent(req.id)}`, null);
          saveNetwork(net, 'friend_declined');
          render();
          showToast('Request deleted');
        }
      }

      function deleteFriendRequest(reqId) {
        const net = getNetwork();
        const idx = net.requests.findIndex(r => r.id === reqId);
        if (idx === -1) return;
        const req = net.requests[idx];
        net.requests.splice(idx, 1);
        supaWriteReliable('shavlo_requests', 'DELETE', `?id=eq.${encodeURIComponent(req.id)}`, null);
        saveNetwork(net, 'friend_req_deleted');
        if (ui.editingReqId === reqId) ui.editingReqId = null;
        render();
        renderModal();
        showToast('Friend request deleted');
      }

      function saveEditedFriendRequest(reqId, newName, newCode) {
        const net = getNetwork();
        const req = net.requests.find(r => r.id === reqId);
        if (!req) return;
        const cleanName = String(newName || '').trim();
        const cleanCode = String(newCode || '').trim().toUpperCase();
        const isOutgoing = req.fromId === activeVaultId;
        if (isOutgoing) {
          if (cleanCode && !/^(\d{6,9}|[A-F0-9]{16,64}|SMV-[A-Z0-9]{4}-[A-Z0-9]{4})$/.test(cleanCode)) {
            showToast('Enter a valid friend code');
            return;
          }
          if (cleanCode && cleanCode !== req.toCode) {
            const target = Object.values(net.directory).find(u => u.friendCode === cleanCode);
            req.toCode = cleanCode;
            if (target) {
              req.toId = target.vaultId;
              req.toName = cleanName || target.name;
            } else if (cleanName) {
              req.toName = cleanName;
            }
          } else if (cleanName) {
            req.toName = cleanName;
          }
          supaWriteReliable('shavlo_requests', 'PATCH', `?id=eq.${encodeURIComponent(req.id)}`, {
            to_id: req.toId, to_name: req.toName, to_code: req.toCode
          });
        } else {
          if (cleanName) req.fromName = cleanName;
          supaWriteReliable('shavlo_requests', 'PATCH', `?id=eq.${encodeURIComponent(req.id)}`, {
            from_name: req.fromName
          });
        }
        saveNetwork(net, 'friend_req_edited');
        ui.editingReqId = null;
        render();
        renderModal();
        showToast('Friend request updated');
      }

                ${isOutgoing ? `<input name="code" type="text" value="${escapeHtml(displayCode)}" placeholder="Paste their friend code" class="w-full h-10 px-3 rounded-xl bg-white dark:bg-zinc-900 font-sans tabular-nums text-[13px] uppercase focus:outline-none focus:ring-2 focus:ring-brand-500/40" />` : ''}

      // Live VC Signaling
      function startCallTimer() {
        clearInterval(callTimer);
        callTimer = setInterval(() => {
          if (ui.activeCall && (ui.activeCall.status === 'connected' || !ui.activeCall.isPeer)) {
            ui.activeCall.seconds += 1;
            renderCallOverlay();
          }
        }, 1000);
      }

      function tryStartLocalCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
        navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(stream => {
          localMediaStream = stream;
          const vid = document.getElementById('local-vc-video');
          if (vid) vid.srcObject = stream;
        }).catch(() => { /* graceful fallback */ });
      }

      function stopLocalCamera() {
        if (localMediaStream) {
          localMediaStream.getTracks().forEach(t => t.stop());
          localMediaStream = null;
        }
      }

      function initiateCall(chat, type) {
        if (!chat) return;
        if (isChatBlocked(chat.id)) { showToast(`Unblock ${chat.name} to place a call`); return; }
        state.callHistory = state.callHistory || [];
        state.callHistory.unshift({
          id: 'cl_' + Date.now(),
          name: chat.name,
          type,
          direction: 'outgoing',
          duration: 'Just now',
          time: 'Today, ' + nowTime(),
          chatId: chat.id
        });
        persistCurrentVault();

        if (chat.isPeer) {
          const net = getNetwork();
          net.activeCalls[chat.id] = {
            roomId: chat.id,
            callerId: activeVaultId,
            callerName: state.userProfile.name,
            calleeId: chat.peerVaultId,
            calleeName: chat.name,
            type,
            status: 'ringing',
            startedAt: Date.now()
          };
          saveNetwork(net, 'call_ring');
          supaWriteReliable('shavlo_calls', 'POST', '', {
            room_id: chat.id, caller_id: activeVaultId, caller_name: state.userProfile.name,
            callee_id: chat.peerVaultId, callee_name: chat.name, call_type: type,
            status: 'ringing', started_at: Date.now()
          });
          ui.activeCall = {
            chatId: chat.id,
            roomId: chat.id,
            isPeer: true,
            peerName: chat.name,
            avatarText: chat.avatarText,
            type,
            status: 'ringing',
            seconds: 0,
            muted: false,
            speaker: false,
            camOn: type === 'video'
          };
          renderCallOverlay();
          if (type === 'video') tryStartLocalCamera();
        } else {
          ui.activeCall = {
            chatId: chat.id,
            roomId: null,
            isPeer: false,
            peerName: chat.name,
            avatarText: chat.avatarText,
            type,
            status: 'connected',
            seconds: 0,
            muted: false,
            speaker: false,
            camOn: type === 'video'
          };
          renderCallOverlay();
          startCallTimer();
          if (type === 'video') tryStartLocalCamera();
        }
      }

      function acceptIncomingPeerCall() {
        if (!ui.activeCall || !ui.activeCall.roomId) return;
        const net = getNetwork();
        const call = net.activeCalls[ui.activeCall.roomId];
        if (call) {
          call.status = 'connected';
          saveNetwork(net, 'call_accepted');
          supaWriteReliable('shavlo_calls', 'PATCH', `?room_id=eq.${encodeURIComponent(ui.activeCall.roomId)}`, { status: 'connected' });
        }
        ui.activeCall.status = 'connected';
        ui.activeCall.seconds = 0;
        renderCallOverlay();
        startCallTimer();
        ensureWebRtcPeer(ui.activeCall.roomId, call ? call.callerId : '', ui.activeCall.type);
      }

      function endActiveCall() {
        stopIncomingRingtone();
        closeWebRtc();
        stopLocalCamera();
        clearInterval(callTimer);
        if (ui.activeCall && ui.activeCall.isPeer && ui.activeCall.roomId) {
          const net = getNetwork();
          delete net.activeCalls[ui.activeCall.roomId];
          saveNetwork(net, 'call_ended');
          supaWriteReliable('shavlo_calls', 'DELETE', `?room_id=eq.${encodeURIComponent(ui.activeCall.roomId)}`);
        }
        ui.activeCall = null;
        renderCallOverlay();
        showToast('Call ended');
      }

      // Auth Flows
      async function completeSignup() {
        const words = authState.generatedSeed;
        const { vaultId, friendCode } = await deriveSeedIdentity(words);
        const vaults = getAllVaults();
        const displayName = (authState.displayName || '').trim() || 'Kim';
        const upiHandle = (authState.upiHandle || '').trim() || (displayName.toLowerCase().replace(/[^a-z0-9]/g, '') + '@okaxis');
        vaults[vaultId] = createSampleVaultData(displayName, upiHandle, words, friendCode);
        saveAllVaults(vaults);
        activeVaultId = vaultId;
        setActiveVaultId(vaultId);
        state = vaults[vaultId];
        registerCurrentUserInDirectory();
        authState.authError = '';
        render();
        showToast(`Welcome, ${displayName} • Code: ${friendCode}`);
      }

      async function completeLogin(words) {
        const cleaned = words.map(w => String(w || '').trim().toLowerCase()).filter(Boolean);
        if (cleaned.length !== 8) {
          authState.authError = 'Please enter all 8 recovery words in order.';
          render();
          return;
        }
        const { vaultId, friendCode } = await deriveSeedIdentity(cleaned);
        const vaults = getAllVaults();
        if (!vaults[vaultId]) {
          const isDemo = cleaned.join(' ') === DEMO_SEED.join(' ');
          vaults[vaultId] = createSampleVaultData(
            isDemo ? 'Kim siddhuu' : 'Member',
            isDemo ? 'kim.siddhuu@okaxis' : `member.${vaultId.slice(0, 4).toLowerCase()}@okaxis`,
            cleaned,
            friendCode
          );
          saveAllVaults(vaults);
        }
        activeVaultId = vaultId;
        setActiveVaultId(vaultId);
        state = vaults[vaultId];
        registerCurrentUserInDirectory();
        authState.authError = '';
        syncFromNetwork();
        showToast(`Signed in as ${state.userProfile.name}`);
      }

      function logoutVault() {
        stopSupaPolling();
        stopLocalCamera();
        clearTimeout(statusAutoTimer);
        clearInterval(callTimer);
        activeVaultId = null;
        state = null;
        setActiveVaultId(null);
        ui.revealSeed = false;
        ui.infoDrawerOpen = false;
        ui.activeCall = null;
        authState.mode = 'login';
        authState.signupStep = 1;
        authState.loginWords = Array(8).fill('');
        authState.authError = '';
        render();
        showToast('Signed out');
      }

      // Messaging Helpers
      function triggerAutoReply(chatId, userText) {
        const chat = state.chats.find(c => c.id === chatId);
        if (!chat) return;
        ui.typingChatId = chatId;
        const lowerU = (userText || '').toLowerCase();
        const demoRhythm = (lowerU.includes('!') || lowerU.includes('urgent') || lowerU.includes('fast') || lowerU.includes('quick') || lowerU.includes('asap') || lowerU.includes('now')) ? 'fast' : 'calm';
        setTypingRhythm(demoRhythm, 2300);
        safeBackgroundRender();
        setTimeout(() => {
          if (!state) return;
          ui.typingChatId = null;
          const activeChat = state.chats.find(c => c.id === chatId);
          if (!activeChat) return;
          const lower = (userText || '').toLowerCase();
          let replyText = 'Sounds good, see you soon!';
          if (activeChat.persona === 'mom') {
            replyText = (lower.includes('payment') || lower.includes('₹') || lower.includes('upi'))
              ? 'Received it, thank you! Drive safely.'
              : 'Sounds good, dinner will be ready at 7 PM.';
          } else if (activeChat.persona === 'kirana') {
            replyText = 'Order confirmed. Delivery will reach your gate in 15 minutes.';
          } else if (activeChat.persona === 'work') {
            replyText = 'Looks great — let us review at 3 PM IST.';
          }
          activeChat.messages.push({
            id: 'm_' + Date.now(),
            sender: 'other',
            senderName: activeChat.isGroup ? activeChat.members[0] : activeChat.name,
            type: 'text',
            text: replyText,
            time: nowTime(),
            status: 'read',

            starred: false
          });
          activeChat.lastTime = nowTime();

      function pushMessageToChat(chat, msg) {
        if (chat.isPeer) {
          const net = getNetwork();
          net.peerChats[chat.id] = net.peerChats[chat.id] || [];
          const fullMsg = { ...msg, authorId: activeVaultId, authorName: state.userProfile.name };
          net.peerChats[chat.id].push(fullMsg);
          saveNetwork(net, 'peer_message');
          supaWriteReliable('shavlo_messages', 'POST', '', {
            id: fullMsg.id, room_id: chat.id, author_id: activeVaultId,
            author_name: state.userProfile.name, payload: fullMsg, created_at: Date.now()
          });
        } else {
          const targetChat = state.chats.find(x => x.id === chat.id) || chat;
          targetChat.messages = targetChat.messages || [];
          targetChat.messages.push(msg);
          targetChat.lastTime = msg.time;
          persistCurrentVault();
        }
      }

      function generateUpiQrDataUrl(upiUri) {
        const str = String(upiUri || 'upi://pay');
        const N = 25;
        const grid = Array.from({ length: N }, () => Array(N).fill(0));
        const setFinder = (r0, c0) => {
          for (let r = 0; r < 7; r++) {
            for (let c = 0; c < 7; c++) {
              const on = (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4));
              grid[r0 + r][c0 + c] = on ? 1 : 0;
            }
          }
        };
        setFinder(0, 0);
        setFinder(0, N - 7);
        setFinder(N - 7, 0);
        for (let i = 8; i < N - 8; i++) {
          grid[6][i] = (i % 2 === 0) ? 1 : 0;
          grid[i][6] = (i % 2 === 0) ? 1 : 0;
        }
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            const inTL = r < 8 && c < 8;
            const inTR = r < 8 && c >= N - 8;
            const inBL = r >= N - 8 && c < 8;
            if (inTL || inTR || inBL || r === 6 || c === 6) continue;
            h ^= (r * 31 + c * 17);
            h = Math.imul(h, 16777619);
            grid[r][c] = ((h >>> 16) & 1);
          }
        }
        try {
          const pad = 2;
          const cell = 8;
          const size = (N + pad * 2) * cell;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, size, size);
          ctx.fillStyle = '#09090C';
          for (let r = 0; r < N; r++) {
            for (let c = 0; c < N; c++) {
              if (grid[r][c]) ctx.fillRect((c + pad) * cell, (r + pad) * cell, cell, cell);
            }
          }
          return canvas.toDataURL('image/png');
        } catch (e) {
          let rects = '';
          for (let r = 0; r < N; r++) {
            for (let c = 0; c < N; c++) {
              if (grid[r][c]) rects += `<rect x="${c + 2}" y="${r + 2}" width="1" height="1"/>`;
            }
          }
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${N + 4} ${N + 4}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#FFFFFF"/><g fill="#09090C">${rects}</g></svg>`;
          return 'data:image/svg+xml;base64,' + btoa(svg);
        }
      }

      function tugMove(msgId, deltaOrExact, isExact) {
        const chat = getSelectedChat();
        if (!chat) return;
        const applyPos = (m) => {
          const next = isExact ? Number(deltaOrExact) : (Number(m.pos ?? 50) + Number(deltaOrExact));
          m.pos = Math.max(0, Math.min(100, Math.round(next)));
        };
        if (chat.isPeer) {
          const net = getNetwork();
          const m = (net.peerChats[chat.id] || []).find(x => x.id === msgId);
          if (m) {
            applyPos(m);
            saveNetwork(net, 'peer_update');
            supaWriteReliable('shavlo_messages', 'PATCH', `?id=eq.${encodeURIComponent(m.id)}`, { payload: m });
          }
        } else {
          const m = (chat.messages || []).find(x => x.id === msgId);
          if (m) {
            applyPos(m);
            persistCurrentVault();
            // Demo playful tug-back
            const backDelta = (m.pos >= 50) ? -14 : 14;
            setTimeout(() => {
              if (!state) return;
              const dm = (chat.messages || []).find(x => x.id === msgId);
              if (dm) {
                dm.pos = Math.max(0, Math.min(100, Math.round(dm.pos + backDelta)));
                persistCurrentVault();
                render();
              }
            }, 850);
          }
        }
        triggerHaptic(8);
        render();
      }

      function openMistMessage(msgId) {
        const chat = getSelectedChat();
        if (!chat) return;
        const list = chat.isPeer ? (getNetwork().peerChats[chat.id] || []) : (chat.messages || []);
        const msg = list.find(m => m.id === msgId);
        if (!msg || !msg.mistDissolve || msg.mistState === 'dissolved') return;
        if (msg.mistState === 'dissolving') return;
        msg.mistState = 'dissolving';
        triggerHaptic(10);
        render();
        clearTimeout(ui.mistActiveTimers[msgId]);
        const durMs = (msg.mistSeconds === 0 ? 1100 : (msg.mistSeconds ? msg.mistSeconds * 1000 : 8000));
        ui.mistActiveTimers[msgId] = setTimeout(() => {
          if (chat.isPeer) {
            const net = getNetwork();
            net.peerChats[chat.id] = (net.peerChats[chat.id] || []).filter(x => x.id !== msgId);
            saveNetwork(net, 'peer_update');
            supaWriteReliable('shavlo_messages', 'DELETE', `?id=eq.${encodeURIComponent(msgId)}`, null);
          } else {
            const targetChat = state.chats.find(x => x.id === chat.id) || chat;
            targetChat.messages = (targetChat.messages || []).filter(x => x.id !== msgId);
            persistCurrentVault();
          }
          render();
        }, durMs);
      }

      function sendTextMessage(text) {
