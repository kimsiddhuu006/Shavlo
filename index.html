        if (!chat.isPeer) {
          // Single tick (sent) -> Double tick (delivered) -> Blue double tick (read)
          setTimeout(() => {
            if (!state) return;
            const c = state.chats.find(x => x.id === chat.id);
            const m = c && c.messages.find(x => x.id === msgId);
            if (m && m.status === 'sent') { m.status = 'delivered'; persistCurrentVault(); render(); }
          }, 420);
          setTimeout(() => {
            if (!state) return;
            const c = state.chats.find(x => x.id === chat.id);
            const m = c && c.messages.find(x => x.id === msgId);
            if (m && m.status !== 'read') { m.status = 'read'; persistCurrentVault(); render(); }
            triggerAutoReply(chat.id, clean);
          }, 950);
        }
      }

      let paymentLockGuard = false;
      function sendUpiPayment(amount, note, targetChatId, pin, mode) {
        ensureSecurityDefaults();
        if (paymentLockGuard) return false;
        const nowMs = Date.now();
        if (state.security.upiPinLockedUntil && nowMs < state.security.upiPinLockedUntil) {
          const secsLeft = Math.ceil((state.security.upiPinLockedUntil - nowMs) / 1000);
          ui.pinError = `Too many failed attempts. Try again in ${secsLeft}s.`;
          renderModal();
          return false;
        }
        const cleanPin = String(pin || '').replace(/\D/g, '');
        if (cleanPin.length !== 4) {
          ui.pinError = 'Enter your 4-digit UPI PIN.';
          renderModal();
          return false;
        }
        const num = Math.round(Number(amount) * 100) / 100;
        if (!Number.isFinite(num) || num <= 0) {
          ui.pinError = 'Enter a valid amount greater than ₹0.';
          renderModal();
          return false;
        }
        if (num > 100000) {
          ui.pinError = 'Single UPI transfer cannot exceed ₹1,00,000.';
          renderModal();
          return false;
        }
        if (hashPin(cleanPin) !== state.security.masterPinHash) {
          state.security.upiPinAttempts = (state.security.upiPinAttempts || 0) + 1;
          if (state.security.upiPinAttempts >= 3) {
            state.security.upiPinLockedUntil = nowMs + 30000;
            state.security.upiPinAttempts = 0;
            persistCurrentVault();
            ui.pinError = '3 failed PIN attempts — payments locked for 30s.';
          } else {
            const left = 3 - state.security.upiPinAttempts;
            persistCurrentVault();
            ui.pinError = `Incorrect passcode (${left} attempt${left === 1 ? '' : 's'} left)`;
          }
          renderModal();
          return false;
        }
        state.security.upiPinAttempts = 0;
        state.security.upiPinLockedUntil = 0;
        const limit = Number(state.security.dailyLimit) || 25000;
        const spentToday = getTodaySpend();
        if (spentToday + num > limit) {
          ui.pinError = `Exceeds daily limit (${formatRupees(Math.max(0, limit - spentToday))} remaining today).`;
          renderModal();
          return false;
        }
        paymentLockGuard = true;
        setTimeout(() => { paymentLockGuard = false; }, 600);
        const chat = getMergedChats().find(c => c.id === (targetChatId || state.selectedChatId));
        if (!chat) return false;
        const isEscrow = mode === 'escrow';
        const txnId = 'UPI' + String(Date.now()).slice(-10);
        const receiptSig = 'SIG-' + syncHash(`${txnId}:${num}:${chat.upiId}:${activeVaultId}`).slice(0, 10);
        const msg = {
          id: 'm_' + Date.now(),
          sender: 'me',
          senderName: 'You',
          type: 'upi',
          amount: num,
          upiId: chat.upiId || 'contact@upi',
          note: (note || (isEscrow ? 'Escrow Protected Payment' : 'UPI Payment')).trim(),
          txnId,
          receiptSig,
          escrow: isEscrow,
          escrowStatus: isEscrow ? 'held' : 'settled',
          direction: 'sent',
          time: nowTime(),
          status: 'read',
          reactions: [],
          starred: false
        };
        pushMessageToChat(chat, msg);
        state.upiHistory.unshift({
          id: 'tx_' + Date.now(),
          name: chat.name,
          upiId: msg.upiId,
          amount: num,
          direction: 'sent',
          note: msg.note,
          status: isEscrow ? 'Escrow Held' : 'Settled',
          receiptSig,
          date: 'Today, ' + msg.time,
          txnId
        });
        persistCurrentVault();
        if (chat.isPeer && chat.peerVaultId && !isEscrow) {
          const vaults = getAllVaults();
          if (vaults[chat.peerVaultId]) {
            vaults[chat.peerVaultId].upiHistory.unshift({
              id: 'tx_r_' + Date.now(),
              name: state.userProfile.name,
              upiId: state.userProfile.upiId,
              amount: num,
              direction: 'received',
              note: msg.note,
              status: 'Settled',
              receiptSig,
              date: 'Today, ' + msg.time,
              txnId
            });
            saveAllVaults(vaults);
          }
        }
        ui.modal = null;
        ui.pinError = '';
        ui.upiPrefill = null;
            ui.requestQrAmt = 0;
            clearTimeout(window._reqQrAutoTimer);
        render();
        scrollToBottom();
        playSubtleTone('pay');
        showToast(isEscrow ? `${formatRupees(num)} held in Escrow` : `Verified & sent ${formatRupees(num)}`);
        if (!chat.isPeer) triggerAutoReply(chat.id, `UPI payment ₹${num}`);
        return true;
      }

      // Private Room Only Mode (Create / Join Room & Chat — Nothing More)
      let privateRoomSession = null; // { code, roomId, name, guestId, messages: [] }
      let privateRoomPollTimer = null;
      let privateRoomChan = null;

      function getPrivateRoomStorageKey(code) {
        return 'shavlo_priv_room_' + String(code || '').toUpperCase();
      }
      function loadPrivateRoomMessages(code) {
        try {
          const raw = localStorage.getItem(getPrivateRoomStorageKey(code));
          return raw ? JSON.parse(raw) : [];
        } catch (e) { return []; }
      }
      function savePrivateRoomMessages(code, msgs) {
        try { localStorage.setItem(getPrivateRoomStorageKey(code), JSON.stringify((msgs || []).slice(-300))); } catch (e) {}
      }



      async function syncPrivateRoomFromCloud() {
        if (!privateRoomSession || !getSupaCfg()) return;
        try {
          const rows = await supaFetch('shavlo_messages', 'GET', `?room_id=eq.${encodeURIComponent(privateRoomSession.roomId)}&select=*&order=created_at.asc&limit=300`);
          if (Array.isArray(rows)) {
            const merged = new Map();
            (privateRoomSession.messages || []).forEach(m => merged.set(m.id, m));
            rows.forEach(r => {
              merged.set(r.id, Object.assign({}, r.payload, {
                id: r.id, authorId: r.author_id, authorName: r.author_name || 'Guest'
              }));
            });
            privateRoomSession.messages = Array.from(merged.values());
            savePrivateRoomMessages(privateRoomSession.code, privateRoomSession.messages);
            render();
            scrollPrivateRoomToBottom();
          }
        } catch (e) {}
      }

      function scrollPrivateRoomToBottom() {
        requestAnimationFrame(() => {
          const el = document.getElementById('private-room-feed');
          if (el) el.scrollTop = el.scrollHeight;
        });
      }

      function stopPrivateRoomSync() {
        if (privateRoomPollTimer) { clearInterval(privateRoomPollTimer); privateRoomPollTimer = null; }
        if (supaClient && privateRoomChan) {
          try { supaClient.removeChannel(privateRoomChan); } catch (e) {}
          privateRoomChan = null;
        }
      }

      function enterPrivateRoom(mode) {
        const name = String(authState.roomName || '').trim();
        let code = String(authState.roomCode || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!name) {
          authState.authError = 'Enter your name to continue.';
          render();
          return;
        }
        if (mode === 'create' && !code) {
          code = String(Math.floor(10000000 + Math.random() * 90000000));
          authState.roomCode = code;
        }
        if (!code || code.length < 4) {
          authState.authError = 'Enter a room code (at least 4 characters).';
          render();
          return;
        }
        authState.authError = '';
        const roomId = 'priv_' + code;
        const guestId = 'guest_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        const existing = loadPrivateRoomMessages(code);
        ui.modal = null;
        privateRoomSession = { code, roomId, name, guestId, messages: existing };

        if (mode === 'create' && existing.length === 0) {
          const sysMsg = {
            id: 'pm_sys_' + Date.now(),
            authorId: 'system',
            authorName: 'Room',
            text: `${name} created room ${code}. Share this code to chat privately.`,
            time: nowTime()
          };
          privateRoomSession.messages.push(sysMsg);
          savePrivateRoomMessages(code, privateRoomSession.messages);
          supaWriteReliable('shavlo_messages', 'POST', '', {
            id: sysMsg.id, room_id: roomId, author_id: 'system',
            author_name: 'Room', payload: sysMsg, created_at: Date.now()
          });
        }

        stopPrivateRoomSync();
        const cfg = getSupaCfg();
        if (cfg) {
          syncPrivateRoomFromCloud();
          try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
              if (!supaClient) supaClient = window.supabase.createClient(cfg.url, cfg.key);
              privateRoomChan = supaClient
                .channel('shavlo-priv-' + code)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'shavlo_messages', filter: `room_id=eq.${roomId}` }, () => syncPrivateRoomFromCloud())
                .subscribe();
            }
          } catch (e) {}
          privateRoomPollTimer = setInterval(() => {
            if (privateRoomSession && getSupaCfg()) syncPrivateRoomFromCloud();
          }, 4000);
        }

        render();
        scrollPrivateRoomToBottom();
        showToast(mode === 'create' ? `Room ${code} created` : `Joined room ${code}`);
      }

          { id: 'you', label: 'You', ico: 'you', badge: 0 }

        return `
          <aside class="hidden md:flex flex-col justify-between w-[220px] shrink-0 bg-white/55 dark:bg-[#0B0B0D]/60 backdrop-blur-2xl border-r border-white/60 dark:border-white/[0.07] px-3.5 py-5">
            <div>
              <div class="flex items-center justify-between px-1.5 mb-6">

                </button>
                <button data-action="open-modal" data-modal="quickCamera" title="Camera" class="glass-cam-btn w-11 h-11 rounded-full text-brand-600 dark:text-brand-100 flex items-center justify-center transition">

                  <button data-action="nav" data-nav="${it.id}" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-2xl text-[14.5px] transition ${state.activeNav === it.id ? 'bg-brand-50 dark:bg-brand-600/20 text-ink dark:text-white font-semibold' : 'text-muted hover:bg-surface dark:hover:bg-zinc-900 hover:text-ink dark:hover:text-white font-medium'}">
                    <span class="flex items-center gap-3">

                    </span>
                    ${it.badge > 0 ? `<span class="min-w-[20px] h-5 px-1.5 rounded-full bg-brand-500 text-white text-[11px] font-bold flex items-center justify-center">${it.badge}</span>` : ''}

              ${renderAvatar(getInitial(state.userProfile.name), state.userProfile.avatarUrl, 'w-9 h-9 text-[13px]', 'bg-brand-50 dark:bg-brand-600/20 text-brand-600 dark:text-brand-100')}

                <div class="text-[13.5px] font-semibold text-ink dark:text-white truncate">${escapeHtml(state.userProfile.name)}</div>
                <div class="text-[11px] font-sans tabular-nums text-muted truncate">${escapeHtml(state.userProfile.friendCode)}</div>

      // Mobile Floating Liquid Glass Pill Dock (iOS 26 style)
      function isDockHidden() {
        return state && (state.activeNav === 'you' || (state.activeNav === 'messages' && state.mobileView === 'chat'));
      }
      function renderMobileBottomBar() {
        if (isDockHidden()) return '';
        const net = getNetwork();
        const pendingReqs = net.requests.filter(r => r.toId === activeVaultId).length;
        const unreadTotal = getMergedChats().reduce((s, c) => s + (c.unread || 0), 0);
        const unseenUpdates = getActiveStatuses().filter(st => !(st.seen || (Array.isArray(st.seenBy) && st.seenBy.includes(activeVaultId)))).length;
        const items = [
          { id: 'updates', label: 'Updates', ico: 'updates', badge: unseenUpdates },
          { id: 'calls', label: 'Calls', ico: 'calls', badge: 0 },
          { id: 'groups', label: 'Groups', ico: 'groups', badge: 0 },
          { id: 'messages', label: 'Chats', ico: 'messages', badge: unreadTotal },
          { id: 'you', label: 'You', ico: 'you', badge: 0, isProfile: true }
        ];
        return `
          <div id="mobile-dock-wrap" style="bottom:max(1.35rem, env(safe-area-inset-bottom)); transform:translateZ(0); will-change:transform;" class="md:hidden fixed inset-x-3 z-30 pointer-events-none flex justify-center">
            <nav id="mobile-dock-nav" style="touch-action:none;" class="relative pointer-events-auto w-full max-w-[430px] grid grid-cols-5 items-center gap-2">
              <div id="dock-glass-lens"></div>
              ${items.map(it => {
                const active = state.activeNav === it.id;
                const youPhoto = it.isProfile ? safeImgUrl(state.userProfile.avatarUrl) : '';
                if (youPhoto) {
                  return `
                    <button data-action="nav" data-nav="${it.id}" title="${it.label}" aria-label="${it.label}" class="relative w-[60px] h-[60px] ml-auto mr-0.5 overflow-hidden flex items-center justify-center rounded-[50%] ${active ? 'ring-2 ring-ink dark:ring-white shadow-[0_8px_22px_-8px_rgba(0,0,0,0.28)]' : 'glass-pill !shadow-[0_6px_18px_-8px_rgba(0,0,0,0.12)]'}">
                      <img src="${youPhoto}" alt="You" class="absolute inset-0 w-full h-full object-cover rounded-[50%]" />
                    </button>
                  `;
                }
                const youRoundCls = it.isProfile ? 'w-[60px] h-[60px] ml-auto mr-0.5 rounded-[50%] p-0' : 'h-[56px] px-1 rounded-full';
                return `
                  <button data-action="nav" data-nav="${it.id}" title="${it.label}" aria-label="${it.label}" class="relative flex items-center justify-center ${youRoundCls} ${active ? 'bg-ink/90 text-white dark:bg-white/95 dark:text-ink font-bold shadow-[0_8px_22px_-8px_rgba(0,0,0,0.22)]' : 'glass-pill !shadow-[0_6px_18px_-8px_rgba(0,0,0,0.09)] text-ink/75 dark:text-white/80 font-medium'}">
                    ${it.isProfile
                      ? renderAvatar(getInitial(state.userProfile.name), '', 'w-[28px] h-[28px] text-[12px] ring-1 ' + (active ? 'ring-white/70 dark:ring-ink/70' : 'ring-black/15 dark:ring-white/25'), active ? 'bg-white text-ink dark:bg-ink dark:text-white' : 'bg-brand-500 text-white')
                      : icon(it.ico, 'w-[22px] h-[22px]')
                    }
                    ${it.badge > 0 ? `<span class="absolute -top-1 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full ${active ? 'bg-white text-ink dark:bg-ink dark:text-white' : 'bg-ink text-white dark:bg-white dark:text-ink'} text-[10px] font-extrabold flex items-center justify-center shadow-sm">${it.badge > 99 ? '99+' : it.badge}</span>` : ''}
                  </button>
                `;
              }).join('')}
            </nav>
          </div>
        `;
      }

                    <input id="updates-search-input" type="text" value="${escapeHtml(ui.updatesSearchQuery)}" placeholder="Search updates" class="w-full pl-11 pr-9 py-2.5 rounded-full bg-white/95 dark:bg-white/[0.06] border border-[#09090C]/20 dark:border-white/20 shadow-[0_2px_10px_-4px_rgba(9,9,12,0.08)] text-[14.5px] text-ink dark:text-white placeholder-zinc-400 focus:outline-none focus:border-[#09090C]/55 dark:focus:border-white/45 focus:ring-2 focus:ring-[#09090C]/10 dark:focus:ring-white/15 transition" />
                    ${ui.updatesSearchQuery ? `<button data-action="clear-search" data-target="updates" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-ink">${icon('close', 'w-3.5 h-3.5')}</button>` : ''}

                </div>
              </div>

                  <div class="py-2 flex items-center justify-between gap-3">
                    <button data-action="${myStatuses.length > 0 ? 'open-status' : 'open-modal'}" ${myStatuses.length > 0 ? `data-id="${myStatuses[0].id}"` : 'data-modal="newStatus"'} class="flex items-center gap-3.5 min-w-0 text-left flex-1">
                      <div class="relative shrink-0">
                        <div class="${myStatuses.length > 0 ? 'status-ring-active' : ''} rounded-full">
                          ${renderAvatar(getInitial(state.userProfile.name), state.userProfile.avatarUrl, 'w-14 h-14 text-[17px] font-bold', 'bg-brand-50 dark:bg-zinc-800 text-brand-600 dark:text-brand-100')}
                        </div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-6 h-6 rounded-full bg-[#09090C] dark:bg-white text-white dark:text-[#09090C] text-[14px] font-extrabold flex items-center justify-center border-2 border-white dark:border-[#0B0B0D]">+</span>
                      </div>
                      <div class="min-w-0">
                        <div class="title-display text-[16px] font-bold tracking-[-0.02em] text-ink dark:text-white">${myStatuses.length > 0 ? 'My status' : 'Add status'}</div>
                        <div class="text-[13.5px] font-normal tracking-[-0.008em] leading-[1.35] text-muted truncate">${myStatuses.length > 0 ? `${myStatuses.length} active • ${formatRemaining24h(myStatuses[0].expiresAt)}` : 'Disappears after 24 hours'}</div>

                <div>

                </div>
              </div>
            </main>
          </div>
        `;

      function compressImageDataUrl(dataUrl, maxDim, quality) {
        return new Promise((resolve) => {
          try {
            const img = new Image();
            img.onload = () => {
              try {
                const lim = maxDim || 960;
                const scale = Math.min(1, lim / Math.max(img.width || 1, img.height || 1));
                const w = Math.max(1, Math.round(img.width * scale));
                const h = Math.max(1, Math.round(img.height * scale));
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', quality || 0.78));
              } catch (e) { resolve(dataUrl); }
            };
            img.onerror = () => resolve(dataUrl);
            img.src = dataUrl;
          } catch (e) { resolve(dataUrl); }
        });
      }

      function markStatusSeen(stId) {
        const net = getNetwork();
        const liveSt = (net.statuses || []).find(x => x.id === stId);
        if (liveSt) {
          liveSt.seenBy = liveSt.seenBy || [];
          if (!liveSt.seenBy.includes(activeVaultId)) { liveSt.seenBy.push(activeVaultId); saveNetwork(net, 'status_seen'); }
        } else if (state) {
          const samp = (state.sampleStatuses || []).find(x => x.id === stId);
          if (samp) { samp.seen = true; persistCurrentVault(); }
        }
      }

      function transitionStatusCube(dir, fromAngleDeg) {
        if (statusCubeBusy || !ui.activeStatusId) return;
        const list = getActiveStatuses();
        const idx = list.findIndex(x => x.id === ui.activeStatusId);
        const nextIdx = idx + dir;
        if (nextIdx < 0) return;
        if (nextIdx >= list.length) {
          clearTimeout(statusAutoTimer);
          ui.activeStatusId = null;
          renderStatusViewer();
          render();
          return;
        }
        const stage = document.getElementById('status-cube-stage');
        if (!stage) {
          ui.activeStatusId = list[nextIdx].id;
          markStatusSeen(list[nextIdx].id);
          renderStatusViewer();
          return;
        }
        statusCubeBusy = true;
        clearTimeout(statusAutoTimer);
        const halfW = Math.round((stage.offsetWidth || 360) / 2);
        const targetAngle = dir > 0 ? -90 : 90;
        const startAngle = typeof fromAngleDeg === 'number' ? fromAngleDeg : 0;

        // Ensure adjacent face is mounted at ±90deg
        let sideFace = document.getElementById(dir > 0 ? 'status-face-next' : 'status-face-prev');
        if (!sideFace) {
          sideFace = document.createElement('div');
          sideFace.id = dir > 0 ? 'status-face-next' : 'status-face-prev';
          sideFace.className = 'status-cube-face';
          sideFace.style.transform = `rotateY(${dir > 0 ? 90 : -90}deg) translateZ(${halfW}px)`;
          sideFace.innerHTML = buildStatusFaceMarkup(list[nextIdx], nextIdx, list, false);
          stage.appendChild(sideFace);
        }
        const curFace = document.getElementById('status-face-current');
        if (curFace) curFace.style.transform = `rotateY(0deg) translateZ(${halfW}px)`;

        stage.style.transition = 'none';
        stage.style.transform = `translateZ(-${halfW}px) rotateY(${startAngle}deg)`;
        void stage.offsetWidth;
        stage.style.transition = 'transform 420ms cubic-bezier(0.22, 1, 0.36, 1)';
        stage.style.transform = `translateZ(-${halfW}px) rotateY(${targetAngle}deg)`;

        setTimeout(() => {
          statusCubeBusy = false;
          ui.activeStatusId = list[nextIdx].id;
          markStatusSeen(list[nextIdx].id);
          renderStatusViewer();
        }, 430);
      }

      function attachStatusCubeSwipe(stage, idx, list) {
        let startX = 0, startY = 0, dragX = 0, dragging = false, lockedHorizontal = false, startTs = 0;
        const getHalfW = () => Math.round((stage.offsetWidth || 360) / 2);

        const onStart = (x, y) => {
          if (statusCubeBusy) return;
          startX = x; startY = y; dragX = 0; dragging = true; lockedHorizontal = false; startTs = Date.now();
          clearTimeout(statusAutoTimer);
        };

        const onMove = (x, y, ev) => {
          if (!dragging || statusCubeBusy) return;
          const dx = x - startX;
          const dy = y - startY;
          if (!lockedHorizontal) {
            if (Math.abs(dx) < 8) return;
            if (Math.abs(dy) > Math.abs(dx)) { dragging = false; return; }
            lockedHorizontal = true;
          }
          if (ev && ev.cancelable) ev.preventDefault();
          dragX = dx;
          const halfW = getHalfW();
          const maxAngle = 82;
          // Dampen at edges when no prev/next exists
          const atEdge = (dx < 0 && idx >= list.length - 1) || (dx > 0 && idx === 0);
          const rawAngle = (dx / (halfW * 2)) * 90;
          const angle = Math.max(-maxAngle, Math.min(maxAngle, atEdge ? rawAngle * 0.25 : rawAngle));

          const curFace = document.getElementById('status-face-current');
          if (curFace) curFace.style.transform = `rotateY(0deg) translateZ(${halfW}px)`;

          if (dx < 0 && idx < list.length - 1 && !document.getElementById('status-face-next')) {
            const nf = document.createElement('div');
            nf.id = 'status-face-next';
            nf.className = 'status-cube-face';
            nf.style.transform = `rotateY(90deg) translateZ(${halfW}px)`;
            nf.innerHTML = buildStatusFaceMarkup(list[idx + 1], idx + 1, list, false);
            stage.appendChild(nf);
          } else if (dx > 0 && idx > 0 && !document.getElementById('status-face-prev')) {
            const pf = document.createElement('div');
            pf.id = 'status-face-prev';
            pf.className = 'status-cube-face';
            pf.style.transform = `rotateY(-90deg) translateZ(${halfW}px)`;
            pf.innerHTML = buildStatusFaceMarkup(list[idx - 1], idx - 1, list, false);
            stage.appendChild(pf);
          }

          stage.style.transition = 'none';
          stage.style.transform = `translateZ(-${halfW}px) rotateY(${angle}deg)`;
        };

        const onEnd = () => {
          if (!dragging) return;
          dragging = false;
          const halfW = getHalfW();
          const dt = Math.max(1, Date.now() - startTs);
          const velocity = Math.abs(dragX) / dt;
          const curAngle = Math.max(-82, Math.min(82, (dragX / (halfW * 2)) * 90));

          if (lockedHorizontal && (Math.abs(dragX) > 48 || (Math.abs(dragX) > 20 && velocity > 0.35))) {
            if (dragX < 0 && idx < list.length - 1) {
              transitionStatusCube(1, curAngle);
              return;
            }
            if (dragX > 0 && idx > 0) {
              transitionStatusCube(-1, curAngle);
              return;
            }
          }
          // Spring cleanly back to 0deg
          if (lockedHorizontal) {
            stage.style.transition = 'transform 300ms cubic-bezier(0.22, 1, 0.36, 1)';
            stage.style.transform = `translateZ(-${halfW}px) rotateY(0deg)`;
          }
        };

        stage.addEventListener('touchstart', (e) => {
          if (e.touches && e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        stage.addEventListener('touchmove', (e) => {
          if (e.touches && e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY, e);
        }, { passive: false });
        stage.addEventListener('touchend', onEnd, { passive: true });
        stage.addEventListener('touchcancel', onEnd, { passive: true });
      }

                const scale = Math.min(1, maxW / img.width);

                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                state.customWallpaperUrl = canvas.toDataURL('image/jpeg', 0.78);

                state.customWallpaperUrl = reader.result;

          const outSize = 512;
          const stageSize = 240;
          const ratio = outSize / stageSize;
          const canvas = document.createElement('canvas');
          canvas.width = outSize;
          canvas.height = outSize;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#09090C';
          ctx.fillRect(0, 0, outSize, outSize);
          const aspect = (img.naturalWidth || 1) / (img.naturalHeight || 1);
          const drawW = (aspect >= 1 ? stageSize * aspect : stageSize) * ratio;
          const drawH = (aspect >= 1 ? stageSize : stageSize / aspect) * ratio;
          ctx.save();
          ctx.translate(outSize / 2 + ca.x * ratio, outSize / 2 + ca.y * ratio);
          ctx.scale(ca.zoom, ca.zoom);
          ctx.rotate((ca.rotate * Math.PI) / 180);
          ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
          ctx.restore();

      }
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        try { navigator.serviceWorker.register('./sw.js').catch(() => {}); } catch (e) {}
      }
      if (window.visualViewport) {
        const syncVvHeight = () => {
          const appEl = document.getElementById('app');
          if (appEl) appEl.style.height = Math.round(window.visualViewport.height) + 'px';
          if (window.scrollY !== 0) window.scrollTo(0, 0);
        };
        window.visualViewport.addEventListener('resize', syncVvHeight, { passive: true });
        syncVvHeight();
      }
      render();
    })();
  </script>
</body>
</html>
