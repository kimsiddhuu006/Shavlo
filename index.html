      function tryStartLocalCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
        const face = (ui.activeCall && ui.activeCall.facingMode) || 'user';
        navigator.mediaDevices.getUserMedia({ video: { facingMode: face }, audio: false }).then(stream => {
          const newTrack = stream.getVideoTracks()[0];
          if (localMediaStream && newTrack) {
            localMediaStream.getVideoTracks().forEach(t => { localMediaStream.removeTrack(t); t.stop(); });
            localMediaStream.addTrack(newTrack);
          } else {
            localMediaStream = stream;
          }
          if (rtcPc && newTrack) {
            const sender = rtcPc.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender) sender.replaceTrack(newTrack).catch(() => {});
          }
          attachCallStreams();
        }).catch(() => { /* graceful fallback */ });
      }

      function stopLocalCamera() {
        if (localMediaStream) {
          localMediaStream.getTracks().forEach(t => t.stop());
          localMediaStream = null;
        }
      }

          type,
          direction: 'outgoing',
          duration: 'Just now',
          time: 'Today, ' + nowTime(),
          chatId: chat.id
        });
        persistCurrentVault();

        if (chat.isPeer) {
          const net = getNetwork();
          net.activeCalls[chat.id] = {
            roomId: chat.id,
            callerId: activeVaultId,
            callerName: state.userProfile.name,
            calleeId: chat.peerVaultId,
            calleeName: chat.name,
            type,
            status: 'ringing',
            startedAt: Date.now()
          };
          saveNetwork(net, 'call_ring');
          const _callRow = {
            room_id: chat.id, caller_id: activeVaultId, caller_name: state.userProfile.name,
            callee_id: chat.peerVaultId, callee_name: chat.name, call_type: type,

            status: 'ringing',

            chatId: chat.id,

            type,
            status: 'connected',
            seconds: 0,
            muted: false,

      function acceptIncomingPeerCall() {
        stopIncomingRingtone();
        if (!ui.activeCall || !ui.activeCall.roomId) return;
        const net = getNetwork();
        const call = net.activeCalls[ui.activeCall.roomId];
        if (call) {
          call.status = 'connected';
          saveNetwork(net, 'call_accepted');
          supaWriteReliable('shavlo_calls', 'PATCH', `?room_id=eq.${encodeURIComponent(ui.activeCall.roomId)}`, { status: 'connected' });
        }
        ui.activeCall.status = 'connected';
        ui.activeCall.seconds = 0;
        if (ui.activeCall.isPeer) {
          const accPayload = { roomId: ui.activeCall.roomId, fromId: activeVaultId, toId: call ? call.callerId : '', type: ui.activeCall.type };
          subscribeRoomChannel(ui.activeCall.roomId);
          sendRoomBroadcast(ui.activeCall.roomId, 'call_accepted', accPayload);
          setTimeout(() => {
            if (ui.activeCall && ui.activeCall.roomId === accPayload.roomId && (!rtcPc || rtcPc.signalingState === 'stable')) {
              sendRoomBroadcast(accPayload.roomId, 'call_accepted', accPayload);

        acquireCallWakeLock();
        startCallTimer();

            async function checkAndPromptPermissionsOnLogin() {
        if (!state || !activeVaultId) return;
        ensureSecurityDefaults();
        // Check Supabase shavlo_user_prefs first so cross-device/re-login remembers granted permissions
        if (!state.security.permissionsPrompted && getSupaCfg()) {
          try {
            const pRows = await supaFetch('shavlo_user_prefs', 'GET', `?select=prefs&vault_id=eq.${encodeURIComponent(activeVaultId)}`);
            const pr = Array.isArray(pRows) && pRows[0] && pRows[0].prefs;
            if (pr) {
              if (pr.permissionsState) state.security.permissionsState = Object.assign({}, state.security.permissionsState || {}, pr.permissionsState);
              if (pr.permissionsPrompted) state.security.permissionsPrompted = true;
              persistCurrentVault();
            }
          } catch (_) {}
        }
        const notifState = (typeof Notification !== 'undefined') ? Notification.permission : 'default';
        const notifGranted = notifState === 'granted';
        let camState = (state.security.permissionsState && state.security.permissionsState.camera) || 'prompt';
        let micState = (state.security.permissionsState && state.security.permissionsState.microphone) || 'prompt';
        try {
          if (navigator.permissions && navigator.permissions.query) {
            const c = await navigator.permissions.query({ name: 'camera' }).catch(() => null);
            const m = await navigator.permissions.query({ name: 'microphone' }).catch(() => null);
            if (c) camState = c.state;
            if (m) micState = m.state;
          }
        } catch (_) {}
        const allGranted = notifGranted && camState === 'granted' && micState === 'granted';
        const anyChangedRevoked = state.security.permissionsPrompted && (
          (state.security.permissionsState && state.security.permissionsState.notifications === 'granted' && notifState !== 'granted') ||
          (state.security.permissionsState && state.security.permissionsState.camera === 'granted' && camState === 'denied') ||
          (state.security.permissionsState && state.security.permissionsState.microphone === 'granted' && micState === 'denied')
        );
        if (allGranted) {
          state.security.permissionsPrompted = true;
          state.security.permissionsState = { notifications: 'granted', camera: 'granted', microphone: 'granted' };
          persistCurrentVault();
          return;
        }
        if (state.security.permissionsPrompted && !anyChangedRevoked) return;
        ui.modal = 'permissionsOnboarding';
        renderModal();
      }

        pruneExpiredLocalData();

          saveNetwork(net, 'peer_message');
          const msgRow = {

          };

            encryptMsgText(chat.id, fullMsg.text).then((encObj) => {
              const cloudPl = encObj ? Object.assign({}, fullMsg, { text: '[Encrypted]', enc: encObj }) : fullMsg;
              const encRow = Object.assign({}, msgRow, { payload: cloudPl });
              if (supaRealtimeChan) {
                try { supaRealtimeChan.send({ type: 'broadcast', event: 'peer_msg', payload: encRow }); } catch (_) {}
              }
              supaWriteReliable('shavlo_messages', 'POST', '', encRow);
            });
          } else {

            }
            supaWriteReliable('shavlo_messages', 'POST', '', msgRow);
          }
        } else {
          const targetChat = state.chats.find(x => x.id === chat.id) || chat;
          targetChat.messages = targetChat.messages || [];
          targetChat.messages.push(msg);
          targetChat.lastTime = msg.time;
          persistCurrentVault();
        }
      }

      const _QR_VER_M = [
        null,
        [16, 10, 1, 0], [28, 16, 1, 0], [44, 26, 1, 0], [64, 18, 2, 0], [86, 24, 2, 0],
        [108, 16, 4, 0], [124, 18, 4, 0], [154, 22, 2, 2], [182, 22, 3, 2], [216, 26, 4, 1],
      ];
      const _QR_ALIGN = [
        null, [], [6,18], [6,22], [6,26], [6,30], [6,34],
        [6,22,38], [6,24,42], [6,26,46], [6,28,50]
      ];
      const _GF_EXP = new Uint8Array(512);
      const _GF_LOG = new Uint8Array(256);
      (() => {
        let x = 1;
        for (let i = 0; i < 255; i++) {
          _GF_EXP[i] = x; _GF_LOG[x] = i;
          x <<= 1; if (x & 0x100) x ^= 0x11d;
        }
        for (let i = 255; i < 512; i++) _GF_EXP[i] = _GF_EXP[i - 255];
      })();
      function _qrGfMul(a, b) { return (a === 0 || b === 0) ? 0 : _GF_EXP[_GF_LOG[a] + _GF_LOG[b]]; }
      function _qrRsGenPoly(deg) {
        let p = [1];
        for (let i = 0; i < deg; i++) {
          const next = new Array(p.length + 1).fill(0), root = _GF_EXP[i];
          for (let j = 0; j < p.length; j++) { next[j] ^= p[j]; next[j + 1] ^= _qrGfMul(p[j], root); }
          p = next;
        }
        return p;
      }
      function _qrRsRemainder(data, ecLen) {
        const gen = _qrRsGenPoly(ecLen), res = new Uint8Array(data.length + ecLen);
        res.set(data);
        for (let i = 0; i < data.length; i++) {
          const coef = res[i];
          if (coef !== 0) for (let j = 0; j < gen.length; j++) res[i + j] ^= _qrGfMul(gen[j], coef);
        }
        return res.slice(data.length);
      }
      const _qrMatrixCache = new Map();
      function encodeQrMatrix(text) {
        const cacheKey = String(text || '');
        if (_qrMatrixCache.has(cacheKey)) return _qrMatrixCache.get(cacheKey);
        const bytes = new TextEncoder().encode(String(text || ''));
        let ver = 1;
        for (; ver <= 10; ver++) {
          const capBits = _QR_VER_M[ver][0] * 8, lenBits = ver <= 9 ? 8 : 16;
          if (4 + lenBits + bytes.length * 8 <= capBits) break;
        }
        if (ver > 10) ver = 10;
        const [totalDataBytes, ecPerBlock, b1Count, b2Count] = _QR_VER_M[ver];
        const bits = [];
        const pushBits = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); };
        pushBits(0b0100, 4);
        pushBits(bytes.length, ver <= 9 ? 8 : 16);
        for (const b of bytes) pushBits(b, 8);
        const maxBits = totalDataBytes * 8;
        for (let i = 0; i < 4 && bits.length < maxBits; i++) bits.push(0);
        while (bits.length % 8 !== 0) bits.push(0);
        let padToggle = 0;
        while (bits.length < maxBits) { pushBits(padToggle ? 0x11 : 0xec, 8); padToggle ^= 1; }
        const codewords = new Uint8Array(totalDataBytes);
        for (let i = 0; i < totalDataBytes; i++) {
          let v = 0; for (let b = 0; b < 8; b++) v = (v << 1) | bits[i * 8 + b];
          codewords[i] = v;
        }
        const totalBlocks = b1Count + b2Count;
        const b1Len = Math.floor(totalDataBytes / totalBlocks), b2Len = b1Len + (b2Count > 0 ? 1 : 0);
        const dataBlocks = [], ecBlocks = [];
        let offset = 0;
        for (let i = 0; i < totalBlocks; i++) {
          const len = i < b1Count ? b1Len : b2Len;
          const blk = codewords.slice(offset, offset + len);
          offset += len;
          dataBlocks.push(blk); ecBlocks.push(_qrRsRemainder(blk, ecPerBlock));
        }
        const finalBytes = [], maxDataLen = Math.max(b1Len, b2Len);
        for (let i = 0; i < maxDataLen; i++) for (const blk of dataBlocks) if (i < blk.length) finalBytes.push(blk[i]);
        for (let i = 0; i < ecPerBlock; i++) for (const ec of ecBlocks) finalBytes.push(ec[i]);
        const N = ver * 4 + 17;
        const mod = Array.from({ length: N }, () => new Int8Array(N).fill(0));
        const isFunc = Array.from({ length: N }, () => new Uint8Array(N));
        const setFunc = (r, c, v) => { if (r >= 0 && r < N && c >= 0 && c < N) { mod[r][c] = v ? 1 : 0; isFunc[r][c] = 1; } };
        const drawFinder = (r0, c0) => {
          for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
            const rr = r0 + r, cc = c0 + c;
            if (rr < 0 || rr >= N || cc < 0 || cc >= N) continue;
            const on = (r >= 0 && r <= 6 && c >= 0 && c <= 6) && (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4));
            setFunc(rr, cc, on ? 1 : 0);
          }
        };
        drawFinder(0, 0); drawFinder(0, N - 7); drawFinder(N - 7, 0);
        const ap = _QR_ALIGN[ver];
        for (const r0 of ap) for (const c0 of ap) {
          if ((r0 < 9 && c0 < 9) || (r0 < 9 && c0 >= N - 9) || (r0 >= N - 9 && c0 < 9)) continue;
          for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++) {
            setFunc(r0 + r, c0 + c, (Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0)) ? 1 : 0);
          }
        }
        for (let i = 8; i < N - 8; i++) { setFunc(6, i, i % 2 === 0 ? 1 : 0); setFunc(i, 6, i % 2 === 0 ? 1 : 0); }
        setFunc(N - 8, 8, 1);
        for (let i = 0; i < 9; i++) if (i !== 6) { isFunc[8][i] = 1; isFunc[i][8] = 1; }
        for (let i = N - 8; i < N; i++) isFunc[8][i] = 1;
        for (let i = N - 7; i < N; i++) isFunc[i][8] = 1;
        if (ver >= 7) {
          let rem = ver;
          for (let i = 0; i < 12; i++) rem = (rem << 1) ^ (((rem >> 11) & 1) * 0x1f25);
          const vBits = (ver << 12) | rem;
          for (let i = 0; i < 18; i++) {
            const bit = (vBits >> i) & 1, r = Math.floor(i / 3), c = N - 11 + (i % 3);
            setFunc(r, c, bit); setFunc(c, r, bit);
          }
        }
        const dataBits = [];
        for (const b of finalBytes) for (let i = 7; i >= 0; i--) dataBits.push((b >> i) & 1);
        let bitIdx = 0, dir = -1;
        for (let right = N - 1; right >= 1; right -= 2) {
          if (right === 6) right = 5;
          for (let vert = 0; vert < N; vert++) {
            const r = dir === -1 ? (N - 1 - vert) : vert;
            for (let j = 0; j < 2; j++) {
              const c = right - j;
              if (!isFunc[r][c]) mod[r][c] = bitIdx < dataBits.length ? dataBits[bitIdx++] : 0;
            }
          }
          dir *= -1;
        }
        const maskFn = [
          (r, c) => (r + c) % 2 === 0, (r, c) => r % 2 === 0, (r, c) => c % 3 === 0, (r, c) => (r + c) % 3 === 0,
          (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0, (r, c) => ((r * c) % 2 + (r * c) % 3) === 0,
          (r, c) => (((r * c) % 2 + (r * c) % 3) % 2) === 0, (r, c) => (((r + c) % 2 + (r * c) % 3) % 2) === 0,
        ];
        const writeFormat = (grid, maskId) => {
          const data = (0b00 << 3) | maskId;
          let rem = data;
          for (let i = 0; i < 10; i++) rem = (rem << 1) ^ (((rem >> 9) & 1) * 0x537);
          const fmt = ((data << 10) | rem) ^ 0x5412;
          for (let i = 0; i <= 5; i++) grid[8][i] = (fmt >> (14 - i)) & 1;
          grid[8][7] = (fmt >> 8) & 1;
          grid[8][8] = (fmt >> 7) & 1;
          grid[7][8] = (fmt >> 6) & 1;
          for (let i = 9; i < 15; i++) grid[14 - i][8] = (fmt >> (14 - i)) & 1;
          for (let i = 0; i < 7; i++) grid[N - 1 - i][8] = (fmt >> (14 - i)) & 1;
          for (let i = 7; i < 15; i++) grid[8][N - 15 + i] = (fmt >> (14 - i)) & 1;
        };
        let bestGrid = null, bestPenalty = Infinity;
        for (let m = 0; m < 8; m++) {
          const g = mod.map((row, r) => Array.from(row, (v, c) => isFunc[r][c] ? v : (v ^ (maskFn[m](r, c) ? 1 : 0))));
          writeFormat(g, m);
          let pen = 0;
          for (let r = 0; r < N; r++) {
            let run = 1;
            for (let c = 1; c < N; c++) { if (g[r][c] === g[r][c - 1]) { run++; if (run === 5) pen += 3; else if (run > 5) pen += 1; } else run = 1; }
          }
          for (let c = 0; c < N; c++) {
            let run = 1;
            for (let r = 1; r < N; r++) { if (g[r][c] === g[r - 1][c]) { run++; if (run === 5) pen += 3; else if (run > 5) pen += 1; } else run = 1; }
          }
          for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) {
            const s = g[r][c] + g[r + 1][c] + g[r][c + 1] + g[r + 1][c + 1];
            if (s === 0 || s === 4) pen += 3;
          }
          if (pen < bestPenalty) { bestPenalty = pen; bestGrid = g; }
        }
        return bestGrid;
      }

      function generateUpiQrDataUrl(upiUri) {
        const str = String(upiUri || 'upi://pay');
        const grid = encodeQrMatrix(str);
        const N = grid.length;
        const pad = 3;
        try {
          const cell = 8;
          const size = (N + pad * 2) * cell;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, size, size);
          ctx.fillStyle = '#09090C';
          for (let r = 0; r < N; r++) {
            for (let c = 0; c < N; c++) {
              if (grid[r][c]) ctx.fillRect((c + pad) * cell, (r + pad) * cell, cell, cell);
            }
          }
          return canvas.toDataURL('image/png');
        } catch (e) {
          let rects = '';
          for (let r = 0; r < N; r++) {
            for (let c = 0; c < N; c++) {
              if (grid[r][c]) rects += `<rect x="${c + pad}" y="${r + pad}" width="1" height="1"/>`;
            }
          }
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${N + pad * 2} ${N + pad * 2}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#ffffff"/><g fill="#09090C">${rects}</g></svg>`;
          return 'data:image/svg+xml;base64,' + btoa(svg);
        }
      }

      function createTugOfWar(question, leftOpt, rightOpt) {
        const q = (question || '').trim();
        const a = (leftOpt || '').trim();
        const b = (rightOpt || '').trim();
        if (!q || !a || !b) return;
        const chat = getSelectedChat();
        if (!chat) return;
        const msg = {
          id: 'm_tug_' + Date.now(),
          sender: 'me',
          senderName: 'You',
          type: 'tug',
          question: q,
          leftOpt: a,
          rightOpt: b,
          pos: 50,
          time: nowTime(),
          status: 'sent',
          reactions: [],
          starred: false
        };
        pushMessageToChat(chat, msg);
        ui.modal = null;
        ui.attachMenuOpen = false;
        render();
        renderModal();
        scrollToBottom();
      }

      function tugMove(msgId, deltaOrExact, isExact) {
        const chat = getSelectedChat();
        if (!chat) return;
        const applyPos = (m) => {
          const next = isExact ? Number(deltaOrExact) : (Number(m.pos ?? 50) + Number(deltaOrExact));
          m.pos = Math.max(0, Math.min(100, Math.round(next)));
        };
        if (chat.isPeer) {
          const net = getNetwork();
          const m = (net.peerChats[chat.id] || []).find(x => x.id === msgId);
          if (m) {
            applyPos(m);
            saveNetwork(net, 'peer_update');
            supaWriteReliable('shavlo_messages', 'PATCH', `?id=eq.${encodeURIComponent(m.id)}`, { payload: m });
          }
        } else {
          const m = (chat.messages || []).find(x => x.id === msgId);
          if (m) {
            applyPos(m);
            persistCurrentVault();
            // Demo playful tug-back
            const backDelta = (m.pos >= 50) ? -14 : 14;
            setTimeout(() => {
              if (!state) return;
              const dm = (chat.messages || []).find(x => x.id === msgId);
              if (dm) {
                dm.pos = Math.max(0, Math.min(100, Math.round(dm.pos + backDelta)));
                persistCurrentVault();
                render();
              }
            }, 850);
          }
        }
        triggerHaptic(8);
        render();
      }

      function openMistMessage(msgId) {
        const chat = getSelectedChat();
        if (!chat) return;
        const list = chat.isPeer ? (getNetwork().peerChats[chat.id] || []) : (chat.messages || []);
        const msg = list.find(m => m.id === msgId);
        if (!msg || !msg.mistDissolve || msg.mistState === 'dissolved') return;
        if (msg.mistState === 'dissolving') return;
        msg.mistState = 'dissolving';
        triggerHaptic(10);
        render();
        clearTimeout(ui.mistActiveTimers[msgId]);
        const durMs = (msg.mistSeconds === 0 ? 1100 : (msg.mistSeconds ? msg.mistSeconds * 1000 : 8000));
        ui.mistActiveTimers[msgId] = setTimeout(() => {
          if (chat.isPeer) {
            const net = getNetwork();
            net.peerChats[chat.id] = (net.peerChats[chat.id] || []).filter(x => x.id !== msgId);
            saveNetwork(net, 'peer_update');
            supaWriteReliable('shavlo_messages', 'DELETE', `?id=eq.${encodeURIComponent(msgId)}`, null);
          } else {
            const targetChat = state.chats.find(x => x.id === chat.id) || chat;
            targetChat.messages = (targetChat.messages || []).filter(x => x.id !== msgId);
            persistCurrentVault();
          }
          render();
        }, durMs);
      }

      function sendTextMessage(text) {
        const clean = (text || '').trim();
        if (!clean || !state) return;
        ensureSecurityDefaults();
        const chat = getSelectedChat();
        if (!chat) return;
        if (isChatBlocked(chat.id)) { showToast(`Unblock ${chat.name} to send messages`); return; }
        const timerSec = (state.security.disappearTimers && state.security.disappearTimers[chat.id]) || 0;
        const expiresAt = ui.mist24h ? (Date.now() + 24 * 3600 * 1000) : (timerSec > 0 ? Date.now() + timerSec * 1000 : null);
        const msgId = 'm_' + Date.now();
        const msg = {
          id: msgId,
          sender: 'me',
          senderName: 'You',
          type: 'text',
          text: clean,
          mistDissolve: !!(ui.mistNext || (ui.mistPickerOpen && !ui.mist24h)),
          mistState: (ui.mistNext || (ui.mistPickerOpen && !ui.mist24h)) ? 'sealed' : null,
          mistSeconds: ui.mistNext ? (ui.mistSeconds || 8) : ((ui.mistPickerOpen && !ui.mist24h) ? 0 : null),
          viewOnce: false,
          viewedOnce: false,
          ttl24h: !!ui.mist24h,
          expiresAt,
          replyTo: ui.replyingTo ? { ...ui.replyingTo } : null,
          time: nowTime(),
          status: 'sent',
          reactions: [],
          starred: false
        };
        if (ui.privateChatMode && ui.privateChatMode[chat.id]) {
          ui.privateMessages[chat.id] = ui.privateMessages[chat.id] || [];
          ui.privateMessages[chat.id].push({ ...msg, isPrivateEphemeral: true });
          playSubtleTone('send');
          ui.mistNext = !!ui.mistPickerOpen && (ui.mistSeconds > 0);
        ui.replyingTo = null;
          ui.attachMenuOpen = false;
          render();
          scrollToBottom();
          return;
        }
        const canFastAppend = !!document.getElementById('message-feed') && !!document.getElementById('message-input');
        pushMessageToChat(chat, msg);
        playSubtleTone('send');
        ui.replyingTo = null;
        ui.attachMenuOpen = false;
        if (canFastAppend) {
          const rb = document.getElementById('reply-preview-bar');
          if (rb) rb.remove();
          const feed = document.getElementById('message-feed');
          if (feed) { feed.insertAdjacentHTML('beforeend', renderBubble(chat, msg)); if (feed.lastElementChild) feed.lastElementChild.classList.add('msg-pop-in'); }
          if (ui.draftsByChat && chat) delete ui.draftsByChat[chat.id];
          const inp = document.getElementById('message-input');
          if (inp) { inp.value = ''; inp.style.height = 'auto'; inp.focus({ preventScroll: true }); }
          const isFocused = document.activeElement && document.activeElement.id === 'message-input';
          if (typeof syncComposerActionButtons === 'function') syncComposerActionButtons(false, isFocused);
          patchChatsScrollInPlace();
          scrollToBottom(false);
        } else {
          render();
          scrollToBottom();
        }

        if (!chat.isPeer) {
          // Single tick (sent) -> Double tick (delivered) -> Blue double tick (read)
          setTimeout(() => {
            if (!state) return;
            const c = state.chats.find(x => x.id === chat.id);
            const m = c && c.messages.find(x => x.id === msgId);
            if (m && m.status === 'sent') { m.status = 'delivered'; persistCurrentVault(); if (!refreshChatFeedInPlace(chat.id)) safeBackgroundRender(); }
          }, 420);
          setTimeout(() => {
            if (!state) return;
            const c = state.chats.find(x => x.id === chat.id);
            const m = c && c.messages.find(x => x.id === msgId);
            if (m && m.status !== 'read') { m.status = 'read'; persistCurrentVault(); if (!refreshChatFeedInPlace(chat.id)) safeBackgroundRender(); }
            triggerAutoReply(chat.id, clean);
          }, 950);
        }
      }

      let paymentLockGuard = false;
      function isValidUpiHandle(v) {
        return /^[a-zA-Z0-9._-]{2,}@[a-zA-Z0-9]{2,}$/.test(String(v || '').trim());
      }

      async function fetchLatestPeerUpi(chat) {
        if (!chat) return '';
        let upi = String(chat.upiId || '').trim();
        if (chat.isPeer && chat.peerVaultId && getSupaCfg()) {
          try {
            const rows = await supaFetch('shavlo_users', 'GET', `?vault_id=eq.${encodeURIComponent(chat.peerVaultId)}&select=upi_id,name`);
            if (Array.isArray(rows) && rows[0]) {
              upi = String(rows[0].upi_id || '').trim();
              chat.upiId = upi;
              const net = getNetwork();
              if (net.directory && net.directory[chat.peerVaultId]) {
                net.directory[chat.peerVaultId].upiId = upi;
                saveNetwork(net, 'upi_lookup');
              }
            }
          } catch (e) {}
        }
        return upi;
      }

      function buildUpiPayUri(pa, pn, am, tn, tr) {
        return `upi://pay?pa=${encodeURIComponent(pa)}&pn=${encodeURIComponent(pn || 'Shavlo User')}&am=${encodeURIComponent(Number(am).toFixed(2))}&cu=INR&tn=${encodeURIComponent(tn || 'Shavlo Payment')}&tr=${encodeURIComponent(tr || '')}`;
      }

      async function launchRealUpiPayment(amount, note, targetChatId, pin, mode) {
        ensureSecurityDefaults();
        if (paymentLockGuard) return false;
        const nowMs = Date.now();
        if (state.security.upiPinLockedUntil && nowMs < state.security.upiPinLockedUntil) {
          const secsLeft = Math.ceil((state.security.upiPinLockedUntil - nowMs) / 1000);
          ui.pinError = `Too many failed attempts. Try again in ${secsLeft}s.`;
          renderModal();
          return false;
        }
        const cleanPin = String(pin || '').replace(/\D/g, '');
        if (cleanPin.length !== 4) {
          ui.pinError = 'Enter your 4-digit UPI PIN.';
          renderModal();
          return false;
        }
        const num = Math.round(Number(amount) * 100) / 100;
        if (!Number.isFinite(num) || num <= 0) {
          ui.pinError = 'Enter a valid amount greater than ₹0.';
          renderModal();
          return false;
        }
        if (!verifyPinHash(cleanPin, state.security.masterPinHash)) {
          state.security.upiPinAttempts = (state.security.upiPinAttempts || 0) + 1;
          if (state.security.upiPinAttempts >= 3) {
            state.security.upiPinLockedUntil = nowMs + 30000;
            state.security.upiPinAttempts = 0;
            persistCurrentVault();
            ui.pinError = '3 failed PIN attempts — payments locked for 30s.';
          } else {
            const left = 3 - state.security.upiPinAttempts;
            persistCurrentVault();
            ui.pinError = `Incorrect passcode (${left} attempt${left === 1 ? '' : 's'} left)`;
          }
          renderModal();
          return false;
        }
        state.security.upiPinAttempts = 0;
        state.security.upiPinLockedUntil = 0;

        const pre = ui.upiPrefill || {};
        const rawTarget = String(targetChatId || pre.chatId || state.selectedChatId || '');
        const extVpa = rawTarget.startsWith('__ext__') ? rawTarget.slice(7) : '';
        const chat = extVpa ? null : (getMergedChats().find(c => c.id === rawTarget) || null);
        let receiverName = (pre.pn && String(pre.pn).trim()) || (chat ? chat.name : (extVpa || 'UPI Payee'));
        let receiverUpi = (pre.pa && String(pre.pa).trim()) || extVpa || '';
        if (!receiverUpi && chat) {
          receiverUpi = await fetchLatestPeerUpi(chat);
        }
        if (!isValidUpiHandle(receiverUpi) || receiverUpi === 'friend@upi' || receiverUpi === 'contact@upi') {
          ui.pinError = chat ? `${chat.name} hasn't added a valid UPI ID yet.` : 'Select a friend or scan a valid UPI QR.';
          renderModal();
          return false;
        }
        const cfgV = getSupaCfg();
        if (cfgV && cfgV.url && !chat) {
          try {
            const vr = await fetch(`${cfgV.url}/functions/v1/upi-webhook?action=verify_vpa&vpa=${encodeURIComponent(receiverUpi)}`);
            if (vr.ok) {
              const vj = await vr.json();
              if (vj && vj.ok && vj.valid === false) {
                ui.pinError = 'Invalid or unsupported UPI ID.';
                renderModal();
                return false;
              }
            }
          } catch (_) {}
        }
        const txnId = 'UPI' + String(Date.now()).slice(-10);
        const noteText = (note || 'UPI Payment').trim();
        const upiUri = buildUpiPayUri(receiverUpi, receiverName, num, noteText, txnId);
        if (chat && chat.isPeer && activeVaultId) {
          supaWriteReliable('shavlo_upi_txns', 'POST', '', {
            id: txnId,
            room_id: chat.id,
            sender_id: activeVaultId,
            receiver_id: chat.peerVaultId || '',
            amount: num,
            note: noteText,
            status: 'pending',
            created_at: Date.now()
          });
        }
        ui.pendingUpiPay = {
          txnId,
          chatId: chat ? chat.id : '',
          peerVaultId: chat ? (chat.peerVaultId || '') : '',
          receiverName,
          receiverUpi,
          amount: num,
          note: noteText,
          upiUri,
          mode: mode || 'instant',
          pre: ui.upiPrefill ? { ...ui.upiPrefill } : {}
        };
        ui.pinError = '';
        ui.modal = 'upiLaunch';
        renderModal();
        if (/Android/i.test(navigator.userAgent || '')) {
          try { window.location.href = upiUri; } catch (e) {}
        }
        return true;
      }

      function finalizePendingUpiPay(utrRef) {
        const p = ui.pendingUpiPay;
        if (!p) return;
        const chat = p.chatId ? getMergedChats().find(c => c.id === p.chatId) : null;
        const cleanUtr = String(utrRef || '').trim();
        const finalNote = cleanUtr ? `${p.note} • UTR ${cleanUtr}` : p.note;
        const receiptSig = 'SIG-' + syncHash(`${p.txnId}:${p.amount}:${p.receiverUpi}:${activeVaultId}`).slice(0, 10);
        const msgTime = nowTime();
        const msg = {
          id: 'm_' + Date.now(),
          sender: 'me',
          senderName: 'You',
          type: 'upi',
          amount: p.amount,
          upiId: p.receiverUpi,
          note: finalNote,
          txnId: p.txnId,
          receiptSig,
          escrow: false,
          escrowStatus: 'settled',
          direction: 'sent',
          time: msgTime,
          status: 'sent',
          reactions: [],
          starred: false
        };
        if (chat) pushMessageToChat(chat, msg);
        state.lastUpiAmount = p.amount;
        if (activeVaultId && p.receiverUpi && (!chat || !chat.isPeer)) {
          state.upiContacts = state.upiContacts || [];
          const idxC = state.upiContacts.findIndex(c => c.vpa === p.receiverUpi);
          const entryC = { vpa: p.receiverUpi, label: p.receiverName || p.receiverUpi, lastPaidAt: Date.now() };
          if (idxC >= 0) state.upiContacts[idxC] = entryC; else state.upiContacts.unshift(entryC);
          supaWriteReliable('shavlo_upi_contacts', 'POST', '?on_conflict=owner_id,vpa', { owner_id: activeVaultId, vpa: p.receiverUpi, label: entryC.label, last_paid_at: entryC.lastPaidAt });
        }
        if (chat && chat.isPeer && activeVaultId) {
          const nowTs = Date.now();
          const settledRow = {
            id: p.txnId,
            room_id: chat.id,
            sender_id: activeVaultId,
            receiver_id: chat.peerVaultId || p.peerVaultId || '',
            amount: p.amount,
            note: finalNote,
            status: 'settled',
            tx_type: 'pay',
            utr: cleanUtr,
            receipt_sig: receiptSig,
            created_at: nowTs
          };
          supaWriteReliable('shavlo_upi_txns', 'POST', '', settledRow);
          supaWriteReliable('shavlo_upi_events', 'POST', '', { id: 'evt_' + p.txnId + '_' + nowTs, txn_id: p.txnId, actor_id: activeVaultId, event_type: 'settled', meta: { utr: cleanUtr }, created_at: nowTs });
          sendRoomBroadcast(chat.id, 'upi_fast', Object.assign({}, settledRow, { senderName: (state.userProfile && state.userProfile.name) || 'Friend', upiId: p.receiverUpi }));
        }
        state.upiHistory = state.upiHistory || [];
        state.upiHistory.unshift({
          id: 'tx_' + Date.now(),
          name: chat ? chat.name : (p.receiverName || p.receiverUpi),
          upiId: p.receiverUpi,
          amount: p.amount,
          direction: 'sent',
          note: finalNote,
          status: 'Settled',
          receiptSig,
          date: 'Today, ' + msgTime,
          txnId: p.txnId
        });
        if (p.pre && (p.pre.requestMsgId || p.pre.splitMsgId)) {
          if (chat.isPeer) {
            const net = getNetwork();
            const list = net.peerChats[chat.id] || [];
            if (p.pre.requestMsgId) { const rm = list.find(m => m.id === p.pre.requestMsgId); if (rm) { rm.paid = true; supaWriteReliable('shavlo_messages', 'PATCH', `?id=eq.${encodeURIComponent(rm.id)}`, { payload: rm }); } }
            if (p.pre.splitMsgId) { const sm = list.find(m => m.id === p.pre.splitMsgId); if (sm && sm.participants && sm.participants[p.pre.splitIdx]) { sm.participants[p.pre.splitIdx].paid = true; supaWriteReliable('shavlo_messages', 'PATCH', `?id=eq.${encodeURIComponent(sm.id)}`, { payload: sm }); } }
            saveNetwork(net, 'peer_update');
          } else {
            if (p.pre.requestMsgId) { const rm = chat.messages.find(m => m.id === p.pre.requestMsgId); if (rm) rm.paid = true; }
            if (p.pre.splitMsgId) { const sm = chat.messages.find(m => m.id === p.pre.splitMsgId); if (sm && sm.participants && sm.participants[p.pre.splitIdx]) sm.participants[p.pre.splitIdx].paid = true; }
          }
        }
        persistCurrentVault();
        ui.pendingUpiPay = null;
        ui.modal = null;
        ui.pinError = '';
        ui.upiPrefill = null;
        ui.requestQrAmt = 0;
        render();
        scrollToBottom();
        playSubtleTone('pay');
        showToast(`Confirmed ${formatRupees(p.amount)} to ${p.receiverUpi}`);
      }

      function sendUpiPayment(amount, note, targetChatId, pin, mode) {
        ensureSecurityDefaults();
        if (paymentLockGuard) return false;
        const nowMs = Date.now();
        if (state.security.upiPinLockedUntil && nowMs < state.security.upiPinLockedUntil) {
          const secsLeft = Math.ceil((state.security.upiPinLockedUntil - nowMs) / 1000);
          ui.pinError = `Too many failed attempts. Try again in ${secsLeft}s.`;
          renderModal();
          return false;
        }
        const cleanPin = String(pin || '').replace(/\D/g, '');
        if (cleanPin.length !== 4) {
          ui.pinError = 'Enter your 4-digit UPI PIN.';
          renderModal();
          return false;
        }
        const num = Math.round(Number(amount) * 100) / 100;
        if (!Number.isFinite(num) || num <= 0) {
          ui.pinError = 'Enter a valid amount greater than ₹0.';
          renderModal();
          return false;
        }
        if (!verifyPinHash(cleanPin, state.security.masterPinHash)) {
          state.security.upiPinAttempts = (state.security.upiPinAttempts || 0) + 1;
          if (state.security.upiPinAttempts >= 3) {
            state.security.upiPinLockedUntil = nowMs + 30000;
            state.security.upiPinAttempts = 0;
            persistCurrentVault();
            ui.pinError = '3 failed PIN attempts — payments locked for 30s.';
          } else {
            const left = 3 - state.security.upiPinAttempts;
            persistCurrentVault();
            ui.pinError = `Incorrect passcode (${left} attempt${left === 1 ? '' : 's'} left)`;
          }
          renderModal();
          return false;
        }
        state.security.upiPinAttempts = 0;
        state.security.upiPinLockedUntil = 0;

        paymentLockGuard = true;
        setTimeout(() => { paymentLockGuard = false; }, 600);
        const chat = getMergedChats().find(c => c.id === (targetChatId || state.selectedChatId));
        if (!chat) return false;
        const isEscrow = mode === 'escrow';
        const txnId = 'UPI' + String(Date.now()).slice(-10);
        const receiptSig = 'SIG-' + syncHash(`${txnId}:${num}:${chat.upiId}:${activeVaultId}`).slice(0, 10);
        const msg = {
          id: 'm_' + Date.now(),
          sender: 'me',
          senderName: 'You',
          type: 'upi',
          amount: num,
          upiId: chat.upiId || 'contact@upi',
          note: (note || (isEscrow ? 'Escrow Protected Payment' : 'UPI Payment')).trim(),
          txnId,
          receiptSig,
          escrow: isEscrow,
          escrowStatus: isEscrow ? 'held' : 'settled',
          direction: 'sent',
          time: nowTime(),
          status: 'read',
          reactions: [],
          starred: false
        };
        pushMessageToChat(chat, msg);
        if (chat.isPeer && activeVaultId) {
          supaWriteReliable('shavlo_upi_txns', 'POST', '', {
            id: txnId || ('tx_' + Date.now()),
            room_id: chat.id,
            sender_id: activeVaultId,
            receiver_id: chat.peerVaultId || '',
            amount: num,
            note: msg.note || 'UPI Payment',
            status: isEscrow ? 'escrow_held' : 'settled',
            created_at: Date.now()
          });
        }
        state.upiHistory.unshift({
          id: 'tx_' + Date.now(),
          name: chat.name,
          upiId: msg.upiId,
          amount: num,
          direction: 'sent',
          note: msg.note,
          status: isEscrow ? 'Escrow Held' : 'Settled',
          receiptSig,
          date: 'Today, ' + msg.time,
          txnId
        });
        persistCurrentVault();
        if (chat.isPeer && chat.peerVaultId && !isEscrow) {
          const vaults = getAllVaults();
          if (vaults[chat.peerVaultId]) {
            vaults[chat.peerVaultId].upiHistory.unshift({
              id: 'tx_r_' + Date.now(),
              name: state.userProfile.name,
              upiId: state.userProfile.upiId,
              amount: num,
              direction: 'received',
              note: msg.note,
              status: 'Settled',
              receiptSig,
              date: 'Today, ' + msg.time,
              txnId
            });
            saveAllVaults(vaults);
          }
        }
        ui.modal = null;
        ui.pinError = '';
        ui.upiPrefill = null;
            ui.requestQrAmt = 0;
            clearTimeout(window._reqQrAutoTimer);
        render();
        scrollToBottom();
        playSubtleTone('pay');
        showToast(isEscrow ? `${formatRupees(num)} held in Escrow` : `Verified & sent ${formatRupees(num)}`);
        if (!chat.isPeer) triggerAutoReply(chat.id, `UPI payment ₹${num}`);
        return true;
      }

        const chat = getMergedChats().find(c => c.id === (targetChatId || state.selectedChatId));

      function createSplitBill(title, totalAmount, formEl) {
        const total = Number(totalAmount);
        if (!title.trim() || !total || total <= 0) { showToast('Enter a title and amount'); return; }
        const chat = getSelectedChat();
        if (!chat) return;
        const allPeople = chat.isGroup && chat.members ? chat.members : [chat.name, 'You'];
        const mode = ui.splitMode || 'equal';
        let participants = [];
        if (formEl) {
          const checked = Array.from(formEl.querySelectorAll('input[name="splitMember"]:checked')).map(el => el.value);
          const people = checked.length >= 1 ? checked : allPeople;
          if (mode === 'exact') {
            participants = people.map(name => {
              const inp = formEl.querySelector(`input[data-split-val="${CSS.escape(name)}"]`);
              const amt = Math.max(0, Math.round((Number(inp ? inp.value : 0) || 0) * 100) / 100);
              return { name, amount: amt || Math.ceil(total / people.length), paid: name === 'You' };
            });
          } else if (mode === 'percent') {
            participants = people.map(name => {
              const inp = formEl.querySelector(`input[data-split-val="${CSS.escape(name)}"]`);
              const pct = Math.max(0, Number(inp ? inp.value : 0) || (100 / people.length));
              return { name, amount: Math.round((total * pct / 100) * 100) / 100, paid: name === 'You' };
            });
          } else {
            const per = Math.ceil(total / people.length);
            participants = people.map(name => ({ name, amount: per, paid: name === 'You' }));
          }
        } else {
          const per = Math.ceil(total / allPeople.length);
          participants = allPeople.map(name => ({ name, amount: per, paid: name === 'You' }));
        }
        const perPerson = participants.length ? (participants[0].amount || Math.ceil(total / participants.length)) : total;
        pushMessageToChat(chat, {
          id: 'm_' + Date.now(),
          sender: 'me',
          senderName: 'You',
          type: 'split',
          title: title.trim(),
          total,
          perPerson,
          splitMode: mode,
          participants,
          time: nowTime(),
          status: 'read',
          reactions: [],
          starred: false
        });
        ui.modal = null;
        render();
        scrollToBottom();
        showToast('Split bill shared');
      }

      function getPrivateRoomStorageKey(code) {
        return 'shavlo_priv_room_' + String(code || '').toUpperCase();

      function loadPrivateRoomMessages(code) {
        try {
          const raw = localStorage.getItem(getPrivateRoomStorageKey(code));
          return raw ? JSON.parse(raw) : [];
        } catch (e) { return []; }
      }
      function savePrivateRoomMessages(code, msgs) {
        try { localStorage.setItem(getPrivateRoomStorageKey(code), JSON.stringify((msgs || []).slice(-300))); } catch (e) {}
      }



      async function syncPrivateRoomFromCloud() {
        if (!privateRoomSession || !getSupaCfg()) return;
        try {
          const rows = await supaFetch('shavlo_messages', 'GET', `?room_id=eq.${encodeURIComponent(privateRoomSession.roomId)}&select=id,room_id,author_id,author_name,payload,created_at,expires_at&order=created_at.asc&limit=300`);
          if (Array.isArray(rows)) {
            const merged = new Map();
            (privateRoomSession.messages || []).forEach(m => merged.set(m.id, m));
            rows.forEach(r => {
              merged.set(r.id, Object.assign({}, r.payload, {
                id: r.id, authorId: r.author_id, authorName: r.author_name || 'Guest'
              }));
            });
            privateRoomSession.messages = Array.from(merged.values());
            savePrivateRoomMessages(privateRoomSession.code, privateRoomSession.messages);
            render();
            scrollPrivateRoomToBottom();
          }
        } catch (e) {}
      }

      function scrollPrivateRoomToBottom() {
        requestAnimationFrame(() => {
          const el = document.getElementById('private-room-feed');
          if (el) el.scrollTop = el.scrollHeight;

      function stopPrivateRoomSync() {
        if (privateRoomPollTimer) { clearInterval(privateRoomPollTimer); privateRoomPollTimer = null; }
        if (supaClient && privateRoomChan) {
          try { supaClient.removeChannel(privateRoomChan); } catch (e) {}
          privateRoomChan = null;
        }
      }

      function enterPrivateRoom(mode) {
        const name = String(authState.roomName || '').trim();
        let code = String(authState.roomCode || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!name) {
          authState.authError = 'Enter your name to continue.';
          render();
          return;
        }
        if (mode === 'create' && !code) {
          code = String(Math.floor(10000000 + Math.random() * 90000000));
          authState.roomCode = code;
        }
        if (!code || code.length < 4) {
          authState.authError = 'Enter a room code (at least 4 characters).';
          render();
          return;
        }
        authState.authError = '';
        const roomId = 'priv_' + code;
        const guestId = 'guest_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        const existing = loadPrivateRoomMessages(code);
        ui.modal = null;
        privateRoomSession = { code, roomId, name, guestId, messages: existing };

        if (mode === 'create' && existing.length === 0) {
          const sysMsg = {
            id: 'pm_sys_' + Date.now(),
            authorId: 'system',
            authorName: 'Room',
            text: `${name} created room ${code}. Share this code to chat privately.`,
            time: nowTime()
          };
          privateRoomSession.messages.push(sysMsg);
          savePrivateRoomMessages(code, privateRoomSession.messages);
          supaWriteReliable('shavlo_messages', 'POST', '', {
            id: sysMsg.id, room_id: roomId, author_id: 'system',
            author_name: 'Room', payload: sysMsg, created_at: Date.now()
          });
        }

        stopPrivateRoomSync();
        const cfg = getSupaCfg();
        if (cfg) {
          syncPrivateRoomFromCloud();
          try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
              if (!supaClient) supaClient = window.supabase.createClient(cfg.url, cfg.key, { realtime: { params: { eventsPerSecond: 20 } } });
              privateRoomChan = supaClient
                .channel('shavlo-priv-' + code)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'shavlo_messages', filter: `room_id=eq.${roomId}` }, () => syncPrivateRoomFromCloud())
                .subscribe();
            }
          } catch (e) {}
          privateRoomPollTimer = setInterval(() => {
            if (privateRoomSession && getSupaCfg()) syncPrivateRoomFromCloud();
          }, 4000);
        }

        render();
        scrollPrivateRoomToBottom();
        showToast(mode === 'create' ? `Room ${code} created` : `Joined room ${code}`);
      }

      function sendPrivateRoomMessage(rawText) {
        if (!privateRoomSession) return;
        const clean = String(rawText || '').trim();
        if (!clean) return;
        const msgId = 'pm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5);
        const msg = {
          id: msgId,
          authorId: privateRoomSession.guestId,
          authorName: privateRoomSession.name,
          text: clean,
          time: nowTime()
        };
        privateRoomSession.messages.push(msg);
        savePrivateRoomMessages(privateRoomSession.code, privateRoomSession.messages);
        if (liveChannel) {
          try { liveChannel.postMessage({ type: 'priv_room_msg', code: privateRoomSession.code, msg }); } catch (e) {}
        }
        if (supaRealtimeChan) {
          try { supaRealtimeChan.send({ type: 'broadcast', event: 'priv_room_msg', payload: { code: privateRoomSession.code, msg } }); } catch (e) {}
        }
        supaWriteReliable('shavlo_messages', 'POST', '', {
          id: msg.id, room_id: privateRoomSession.roomId, author_id: privateRoomSession.guestId,
          author_name: privateRoomSession.name, payload: msg, created_at: Date.now()
        });
        playSubtleTone('send');
        render();
        scrollPrivateRoomToBottom();
      }

      // UPDATES TAB — 24-Hour Statuses & Updates
      function renderSegmentedStatusRing(countOrStates, isSeen) {
        const states = Array.isArray(countOrStates)
          ? countOrStates.map(Boolean)
          : Array.from({ length: Math.max(0, Number(countOrStates || 0)) }, () => Boolean(isSeen));
        const n = states.length;
        if (n === 0) return '';
        const r = 29;
        const c = 2 * Math.PI * r;
        if (n === 1) {
          const strokeCls = states[0] ? 'stroke-zinc-300 dark:stroke-zinc-700' : 'stroke-[#09090C] dark:stroke-white';
          return `<svg viewBox="0 0 64 64" class="pointer-events-none absolute -inset-[4px] w-[64px] h-[64px]" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke-width="2.6" class="${strokeCls}"/></svg>`;
        }
        const gap = n >= 8 ? 4.5 : (n >= 4 ? 5.5 : 6.5);
        const dash = Math.max(3.5, (c / n) - gap);
        const step = dash + gap;
        const arcs = states.map((segSeen, i) => {
          const offset = -(i * step);
          const strokeCls = segSeen ? 'stroke-zinc-300 dark:stroke-zinc-700' : 'stroke-[#09090C] dark:stroke-white';
          return `<circle cx="32" cy="32" r="${r}" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="${dash.toFixed(2)} ${(c - dash).toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" class="${strokeCls}"/>`;
        }).join('');
        return `<svg viewBox="0 0 64 64" style="transform:rotate(-90deg);" class="pointer-events-none absolute -inset-[4px] w-[64px] h-[64px]" aria-hidden="true">${arcs}</svg>`;
      }

      function renderActiveChatColumn(mobileCls) {

                    ${isPrivateMode
                      ? '<p class="text-[10.5px] text-white/70 font-semibold tracking-wider uppercase leading-tight mt-0.5">Private Mode • Pull right edge to exit</p>'

                </button>
              </div>

                <button data-action="start-call" data-type="video" title="Video Call" class="w-9 h-8 rounded-full flex items-center justify-center transition ${isPrivateMode ? 'text-white hover:bg-white/15' : 'text-ink dark:text-white hover:bg-white dark:hover:bg-black'}">
                  ${icon('video', 'w-[19px] h-[19px]')}
                </button>
                <button data-action="start-call" data-type="voice" title="Audio Call" class="w-9 h-8 rounded-full flex items-center justify-center transition ${isPrivateMode ? 'text-white hover:bg-white/15' : 'text-ink dark:text-white hover:bg-white dark:hover:bg-black'}">
                  ${icon('calls', 'w-[18px] h-[18px]')}
                </button>
              </div>
            </header>

            ${ui.inChatSearchOpen ? `
              <div data-smart-search="message-feed" class="smart-search-wrap shrink-0 px-4 sm:px-6 py-2 border-b border-zinc-100 dark:border-zinc-900 bg-surface/60 dark:bg-zinc-900/60 flex items-center gap-2">
                <input id="inchat-search-input" type="text" value="${escapeHtml(ui.inChatSearchQuery)}" placeholder="Search in this chat..." class="flex-1 bg-white/95 dark:bg-zinc-900 border border-[#09090C]/20 dark:border-white/20 text-[13.5px] px-3.5 py-1.5 rounded-full focus:outline-none focus:border-[#09090C]/55 focus:ring-2 focus:ring-[#09090C]/10 transition" />
                <button data-action="toggle-chat-search" class="p-1 text-muted hover:text-ink">${icon('close', 'w-4 h-4')}</button>

              <div class="flex justify-center pb-2.5">
                ${isPrivateMode ? `

                    <span class="px-3.5 py-1 rounded-full border border-dashed border-white/35 bg-white/[0.06] text-[11.5px] font-bold tracking-wider uppercase text-white/85">Private Window Active</span>
                    <span class="text-[12px] text-white/55 text-center max-w-[260px]">Messages here vanish automatically when you leave Private Mode.</span>
                    <button type="button" data-action="exit-private-chat" class="mt-1 px-3 py-1 rounded-full bg-white/10 hover:bg-white/20 text-[11.5px] font-semibold text-white/90 transition">Exit Private</button>
                  </div>
                ` : `
${chat.isPeer && activeMessages.length >= 25 && !roomHasNoMoreOlder[chat.id] ? `<button type="button" data-action="load-older-msgs" data-id="${chat.id}" class="mr-2 px-3 py-1 rounded-full bg-black/[0.06] dark:bg-white/[0.1] text-[11px] font-semibold text-ink dark:text-white hover:opacity-80 transition">${roomOlderLoading[chat.id] ? 'Loading...' : 'Load older'}</button>` : ''}

              </div>
              ${(ui.inChatSearchQuery ? activeMessages.filter(m => String(m.text || m.title || m.note || m.question || '').toLowerCase().includes(ui.inChatSearchQuery.toLowerCase())) : activeMessages).map(m => renderBubble(chat, m)).join('')}

                        ${ui.shoulderVeil ? `

              <svg class="w-full h-full -rotate-90" viewBox="0 0 44 44" aria-hidden="true">
                <defs>
                  <mask id="priv-seg-mask">
                    <circle cx="22" cy="22" r="16" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="2.4 5.4"/>

                </defs>

              </svg>
            </div>

            <!-- Seamless Floating Composer Shelf (lifted slightly, borderless, merged into chat) -->
            <div id="composer-dock" style="padding-bottom:${ui.attachMenuOpen ? '0px' : 'max(1.75rem, env(safe-area-inset-bottom))'}; transform:translateZ(0);" class="absolute bottom-0 inset-x-0 z-20 ${ui.attachMenuOpen ? 'px-0' : 'px-3.5 sm:px-6'} pt-1 bg-transparent pointer-events-none">

              <div class="pointer-events-auto ${ui.attachMenuOpen ? 'space-y-2.5' : ''}">
              <div class="${ui.attachMenuOpen ? 'px-3.5 sm:px-6' : ''}">
              ${ui.replyingTo ? `
                <div id="reply-preview-bar" class="mb-2.5 px-3.5 py-2 rounded-2xl bg-surface dark:bg-zinc-900 flex items-center justify-between gap-2 text-[12.5px]">
                  <div class="min-w-0">
                    <span class="font-semibold text-brand-500">Replying to ${escapeHtml(ui.replyingTo.sender)}: </span>

                    </div>
                    <span class="text-[12.5px] font-bold tracking-tight ${isPrivateMode ? 'text-white' : 'text-ink dark:text-white'} truncate">${ui.walkieSpeaking ? 'Transmitting live...' : (ui.walkiePeerSpeaking ? `${escapeHtml(chat.name.split(' ')[0])} speaking...` : 'Walkie-Talkie')}</span>

                  </button>
                  <button type="button" data-action="stop-walkie" title="Close Walkie-Talkie" class="w-8 h-8 rounded-full bg-black/[0.06] dark:bg-white/[0.1] ${isPrivateMode ? 'text-white' : 'text-ink dark:text-white'} flex items-center justify-center shrink-0">
                    ${icon('close', 'w-4 h-4')}
                  </button>
                </div>
              ` : ui.recordingVoice ? `
                <div class="flex items-center justify-between gap-2 bg-[#09090C] dark:bg-white rounded-full px-3.5 py-2 shadow-md">

                  </div>
                </div>
              ` : ui.pendingVoiceDraft ? `
                <div class="${isPrivateMode ? 'glass-dark-pill' : 'soft-bw-glass'} rounded-full px-3.5 py-2 flex items-center justify-between gap-2 shadow-sm">
                  <span class="text-[13px] font-semibold ${isPrivateMode ? 'text-white' : 'text-ink dark:text-white'} truncate pl-1">Voice (${ui.pendingVoiceDraft.duration})</span>

                    <button type="button" data-action="discard-voice-draft" class="px-3 py-1.5 rounded-full bg-black/[0.06] dark:bg-white/[0.1] text-rose-600 dark:text-rose-400 text-[12.5px] font-semibold inline-flex items-center gap-1 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition">${icon('trash', 'w-3.5 h-3.5')}<span>Delete</span></button>
                    <button type="button" data-action="send-voice-draft" data-view-once="0" class="px-3.5 py-1.5 rounded-full bg-[#09090C] dark:bg-white text-white dark:text-[#09090C] text-[12.5px] font-bold shadow-sm hover:opacity-90 transition">Send</button>
                  </div>
                </div>
              ` : `
                <form id="chat-composer" class="w-full flex items-center gap-1.5">
                  ${(() => {
                    const isTypingNow = (ui.typingChatId === chat.id || ui.peerTypingRooms[chat.id]);
                    const isOnlineNow = isTypingNow || isChatOnline(chat);
                    const isInChatNow = isTypingNow || isPeerInChat(chat);
                    const ringPhase = isTypingNow ? 'typing' : (isInChatNow ? 'inchat' : (isOnlineNow ? 'online' : 'offline'));
                    triggerRingHaptic(chat.id, ringPhase);
                    return `
                      <div id="plus-ring-wrap" class="relative shrink-0 ${ui.typingRhythm === 'fast' ? 'rhythm-fast-ring' : (ui.typingRhythm === 'calm' ? 'rhythm-calm-ring' : '')}">
                        ${ui.mistPickerOpen ? `
                          <button id="mist-round-btn" type="button" data-action="cycle-mist-sec" title="Tap or swipe up/down (0s Burn • 1s–10s • 24h)" style="touch-action: none; transition: background-color 320ms cubic-bezier(0.22, 1, 0.36, 1), color 320ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 320ms cubic-bezier(0.22, 1, 0.36, 1), transform 220ms cubic-bezier(0.22, 1, 0.36, 1);" class="absolute bottom-[58px] left-0 z-30 w-12 h-12 rounded-full border-0 overflow-hidden antialiased ${ui.mist24h ? 'bg-[#C6A76D] text-white shadow-[0_8px_24px_-4px_rgba(198,167,109,0.7)]' : 'bg-[#09090C] text-white dark:bg-white dark:text-[#09090C] shadow-[0_8px_22px_-6px_rgba(9,9,12,0.45)]'} flex items-center justify-center text-[13px] font-extrabold tabular-nums active:scale-90 ${ui.mistJustOpened ? 'attach-shelf-rise' : ''} select-none">

      function compressImageDataUrl(dataUrl, maxDim, quality) {
        return new Promise((resolve) => {
          try {
            const img = new Image();
            img.onload = () => {
              try {
                const lim = maxDim || 960;
                const scale = Math.min(1, lim / Math.max(img.width || 1, img.height || 1));
                const w = Math.max(1, Math.round(img.width * scale));
                const h = Math.max(1, Math.round(img.height * scale));
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', quality || 0.78));
              } catch (e) { resolve(dataUrl); }
            };
            img.onerror = () => resolve(dataUrl);
            img.src = dataUrl;
          } catch (e) { resolve(dataUrl); }
        });
      }

      function syncModalToKeyboard() {
        const bd = document.getElementById('modal-backdrop');
        const innerScroll = document.getElementById('modal-scroll-inner');
        if (!bd) return;
        const vv = window.visualViewport;
        if (vv) {
          if (window.scrollY !== 0 || window.scrollX !== 0) {
            try { window.scrollTo(0, 0); } catch (_) {}
          }
          bd.style.top = Math.max(0, vv.offsetTop) + 'px';
          bd.style.height = vv.height + 'px';
          bd.style.bottom = 'auto';
          if (innerScroll) {
            const pad = window.innerWidth >= 640 ? 32 : 12;
            innerScroll.style.maxHeight = Math.max(200, Math.floor(vv.height - pad)) + 'px';
          }
        }
      }

      function findScrollableAncestor(el) {
        let cur = el ? el.parentElement : null;
        while (cur && cur !== document.body) {
          const st = window.getComputedStyle(cur);
          if ((st.overflowY === 'auto' || st.overflowY === 'scroll') && cur.scrollHeight > cur.clientHeight + 2) {
            return cur;
          }
          cur = cur.parentElement;
        }
        return null;
      }

      function bringFocusedInputIntoView(el) {
        if (!el || !el.tagName) return;
        const tag = el.tagName.toLowerCase();
        if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') return;
        if (el.type === 'file' || el.type === 'checkbox' || el.type === 'radio' || el.type === 'hidden') return;
        const doScroll = () => {
          syncModalToKeyboard();
          const vv = window.visualViewport;
          const visTop = vv ? vv.offsetTop : 0;
          const visBottom = visTop + (vv ? vv.height : window.innerHeight);
          const rect = el.getBoundingClientRect();
          const sp = findScrollableAncestor(el);
          if (sp) {
            const spRect = sp.getBoundingClientRect();
            const safeBottom = Math.min(visBottom, spRect.bottom) - 14;
            const safeTop = Math.max(visTop, spRect.top) + 14;
            if (rect.bottom > safeBottom) {
              sp.scrollBy({ top: rect.bottom - safeBottom, behavior: 'smooth' });
            } else if (rect.top < safeTop) {
              sp.scrollBy({ top: rect.top - safeTop, behavior: 'smooth' });
            }
          }
        };
        setTimeout(doScroll, 90);
        setTimeout(doScroll, 280);
      }

      if (window.visualViewport && !window._shavloVvBound) {
        window._shavloVvBound = true;
        window.visualViewport.addEventListener('resize', () => {
          syncModalToKeyboard();
          if (document.activeElement) bringFocusedInputIntoView(document.activeElement);
        });
        window.visualViewport.addEventListener('scroll', syncModalToKeyboard);
      }
      if (!window._shavloHeaderDualTapBound) {
        window._shavloHeaderDualTapBound = true;
        let lastHdrTap = 0;
        document.addEventListener('click', (e) => {
          const hdr = e.target && e.target.closest ? e.target.closest('#active-chat-header') : null;
          if (!hdr) return;
          if (e.target.closest('button')) return;
          const nowT = Date.now();
          if (nowT - lastHdrTap < 280) {
            lastHdrTap = 0;
            const cid = hdr.dataset.chatId;

              ensureSecurityDefaults();
              state.security.hiddenChatIds[cid] = true;
              state.security.secretChatIds[cid] = true;

        });
      }

      function bindLocalPipDrag() {
        const pip = document.getElementById('local-vc-pip');
        if (!pip || pip.dataset.dragBound) return;
        pip.dataset.dragBound = '1';
        let startX = 0, startY = 0, origLeft = 0, origTop = 0, dragging = false;
        pip.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          dragging = true;
          const r = pip.getBoundingClientRect();
          origLeft = r.left;
          origTop = r.top;
          startX = e.clientX;
          startY = e.clientY;
          pip.style.right = 'auto';
          pip.style.left = origLeft + 'px';
          pip.style.top = origTop + 'px';
          try { pip.setPointerCapture(e.pointerId); } catch (_) {}
        });
        pip.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          e.stopPropagation();
          const maxL = Math.max(8, window.innerWidth - pip.offsetWidth - 8);
          const maxT = Math.max(8, window.innerHeight - pip.offsetHeight - 8);
          pip.style.left = Math.max(8, Math.min(maxL, origLeft + (e.clientX - startX))) + 'px';
          pip.style.top = Math.max(8, Math.min(maxT, origTop + (e.clientY - startY))) + 'px';
        });
        const stopDrag = () => { dragging = false; };
        pip.addEventListener('pointerup', stopDrag);
        pip.addEventListener('pointercancel', stopDrag);
      }

      function attachCallStreams() {
        bindLocalPipDrag();
        if (localMediaStream) {
          const vid = document.getElementById('local-vc-video');
          if (vid && vid.srcObject !== localMediaStream) { vid.srcObject = localMediaStream; vid.play().catch(() => {}); }
        }
        if (remoteMediaStream) {
          const rvid = document.getElementById('remote-vc-video');
          const hasVidTrack = remoteMediaStream.getVideoTracks().length > 0;
          if (rvid) {
            rvid.setAttribute('playsinline', '');
            rvid.setAttribute('webkit-playsinline', '');
            if (rvid.srcObject !== remoteMediaStream) {
              rvid.srcObject = remoteMediaStream;
              rvid.onloadedmetadata = () => { rvid.play().catch(() => {}); };
            }
            if (hasVidTrack) {
              rvid.classList.remove('opacity-0');
              rvid.play().catch(() => {});
            } else {
              rvid.classList.add('opacity-0');
            }
          }
          const ph = document.getElementById('call-remote-placeholder');
          if (ph) ph.classList.toggle('hidden', hasVidTrack);
          const raud = document.getElementById('remote-vc-audio');
          if (raud) {
            raud.muted = Boolean(rvid);
            if (!rvid && raud.srcObject !== remoteMediaStream) { raud.srcObject = remoteMediaStream; raud.play().catch(() => {}); }
          }
        }
      }

      let _lastCallRenderKey = '';

            muteBtn.innerHTML = `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="${!call.muted ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2" fill="none"/><line x1="12" x2="12" y1="19" y2="22" fill="none"/>${call.muted ? '<line x1="2" x2="22" y1="2" y2="22" fill="none"/>' : ''}</svg>`;
          }
          const camBtn = document.getElementById('call-cam-btn');
          if (camBtn) {
            camBtn.className = `w-14 h-14 rounded-full shadow-xl flex items-center justify-center active:scale-90 transition ${call.camOn ? 'bg-white text-[#34C759]' : 'bg-black/45 backdrop-blur-xl border border-white/25 text-white'}`;
            camBtn.innerHTML = `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="${call.camOn ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="3"/>${!call.camOn ? '<line x1="2" x2="22" y1="2" y2="22" fill="none"/>' : ''}</svg>`;
          }
          const peerStateEl = document.getElementById('call-peer-state-badge');
          if (peerStateEl) {
            const parts = [];

          const spkBtn = document.getElementById('call-speaker-btn');
          if (spkBtn) {

        _lastCallRenderKey = callKey;

      function render() {
        syncTheme();
        const app = document.getElementById('app');
        if (privateRoomSession) {
          app.innerHTML = renderPrivateRoomChat();
          updateMobileBottomBar();
          document.getElementById('modal-root').innerHTML = '';
          document.getElementById('call-root').innerHTML = '';
          return;
        }
        if (!state || !activeVaultId) {
          app.innerHTML = renderAuthScreen();
          updateMobileBottomBar();
          document.getElementById('modal-root').innerHTML = '';
          document.getElementById('call-root').innerHTML = '';
          return;
        }

        let mainView = '';
        if (state.activeNav === 'updates' || state.activeNav === 'friends') mainView = renderUpdatesTab();
        else if (state.activeNav === 'groups') mainView = renderGroupsTab();
        else if (state.activeNav === 'calls') mainView = renderCallsTab();
        else if (state.activeNav === 'rooms') mainView = renderRoomsTab();
        else if (state.activeNav === 'you') mainView = renderYouTab();
        else mainView = renderMessagesTab();

        const savedScrolls = {};
        app.querySelectorAll('[data-scroll-host]').forEach(el => {
          const key = el.getAttribute('data-scroll-host');
          if (key) savedScrolls[key] = el.scrollTop;
        });

        Object.keys(searchHiddenState).forEach(k => delete searchHiddenState[k]);
        ui._navTransition = '';
        app.innerHTML = `
          ${renderDesktopSidebar()}
          <div id="main-stage-view" class="flex-1 flex flex-col h-full min-h-0 min-w-0 overflow-hidden">
            ${mainView}
          </div>
        `;
        updateMobileBottomBar();

        Object.keys(savedScrolls).forEach(key => {
          const el = app.querySelector(`[data-scroll-host="${key}"]`);
          if (el) el.scrollTop = savedScrolls[key];
        });
        renderModal();
        renderCallOverlay();
        renderLockOverlay();
        renderStatusViewer();

      let statusCubeBusy = false;

      function getStatusViewerList(st) {
        const netDir = getNetwork().directory || {};
        return ((st && st.seenBy) || []).filter(vid => vid && vid !== activeVaultId).map(vid => {
          const u = netDir[vid] || {};
          const vName = (st.seenNames && st.seenNames[vid]) || u.name || 'Contact';
          return { id: vid, name: vName, avatarUrl: u.avatarUrl || '', initial: getInitial(vName) };
        });
      }
      function buildStatusViewersSheetHtml(viewerList) {
        return `
          <div data-action="toggle-status-viewers" class="fixed inset-0 z-40 bg-black/45 backdrop-blur-[2px] flex items-end justify-center cursor-pointer">

                ` : viewerList.map(v => `
                  <div class="py-2.5 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                      ${renderAvatar(v.initial, v.avatarUrl, 'w-10 h-10 text-[13px] font-bold', 'bg-white/15 text-white')}

                    </div>
                    <span class="text-[11.5px] text-[#C6A76D] font-semibold shrink-0">Seen</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }
      function updateStatusViewersInPlace() {
        if (!ui.activeStatusId) return;
        const st = getActiveStatuses().find(x => x.id === ui.activeStatusId);
        if (!st) return;
        const viewerList = getStatusViewerList(st);
        const cntEl = document.getElementById('status-viewers-count');
        if (cntEl) cntEl.textContent = String(viewerList.length);
        const hostEl = document.getElementById('status-viewers-sheet-host');
        if (hostEl) hostEl.innerHTML = ui.statusViewersOpen ? buildStatusViewersSheetHtml(viewerList) : '';
      }

      function buildStatusFaceMarkup(st, idx, list, animateBar) {
        const isMine = st.authorId === activeVaultId;
        return `

      function markStatusSeen(stId) {
        const net = getNetwork();
        const liveSt = (net.statuses || []).find(x => x.id === stId);
        if (liveSt && activeVaultId) {
          liveSt.seenBy = liveSt.seenBy || [];
          liveSt.seenNames = liveSt.seenNames || {};
          let changed = false;
          if (!liveSt.seenBy.includes(activeVaultId)) {
            liveSt.seenBy.push(activeVaultId);
            changed = true;
          }
          if (state && state.userProfile && state.userProfile.name && !liveSt.seenNames[activeVaultId]) {
            liveSt.seenNames[activeVaultId] = state.userProfile.name;
            changed = true;
          }
          if (changed) {
            saveNetwork(net, 'status_seen');
            if (supaRealtimeChan) {
              try { supaRealtimeChan.send({ type: 'broadcast', event: 'status_seen_fast', payload: { id: liveSt.id, viewerId: activeVaultId, viewerName: state && state.userProfile ? state.userProfile.name : '' } }); } catch (_) {}
            }
            supaWriteReliable('shavlo_status_views', 'POST', '', {
              status_id: liveSt.id,
              viewer_id: activeVaultId,
              viewer_name: (state && state.userProfile && state.userProfile.name) || 'Friend',
              viewed_at: Date.now()
            });
          }
        } else if (state) {
          const samp = (state.sampleStatuses || []).find(x => x.id === stId);
          if (samp) { samp.seen = true; persistCurrentVault(); }
        }
      }

      function getGroupedActiveStatuses() {
        const raw = getActiveStatuses();
        const byUser = new Map();
        raw.forEach(s => {
          const k = s.isMine ? '__me__' : (s.authorId || s.authorName || 'user');
          if (!byUser.has(k)) byUser.set(k, []);
          byUser.get(k).push(s);
        });
        const ordered = [];
        byUser.forEach(arr => arr.forEach(s => ordered.push(s)));
        return ordered;
      }

      function transitionStatusCube(dir) {
        if (!ui.activeStatusId) return;
        const list = getGroupedActiveStatuses();
        const idx = list.findIndex(x => x.id === ui.activeStatusId);
        const nextIdx = idx + (dir > 0 ? 1 : -1);
        if (nextIdx < 0) return;
        clearTimeout(statusAutoTimer);
        if (nextIdx >= list.length) {
          ui.activeStatusId = null;
          ui.statusViewersOpen = false;
          renderStatusViewer();
          render();
          return;
        }
        ui.activeStatusId = list[nextIdx].id;
        markStatusSeen(list[nextIdx].id);
        renderStatusViewer();
      }

      let _mountedStatusId = '';
      function renderStatusViewer() {
        const root = document.getElementById('status-root');
        if (!root) return;
        if (!ui.activeStatusId || !state) {
          clearTimeout(statusAutoTimer);
          statusCubeBusy = false;
          _mountedStatusId = '';
          if (root.innerHTML !== '') root.innerHTML = '';
          return;
        }
        const list = getGroupedActiveStatuses();
        const idx = list.findIndex(x => x.id === ui.activeStatusId);
        if (idx === -1) {
          clearTimeout(statusAutoTimer);
          _mountedStatusId = '';
          ui.activeStatusId = null;
          root.innerHTML = '';
          return;
        }
        const st = list[idx];
        if (_mountedStatusId === st.id && document.getElementById('status-stage-flat')) {
          updateStatusViewersInPlace();
          return;
        }
        _mountedStatusId = st.id;
        clearTimeout(statusAutoTimer);
        statusCubeBusy = false;
        if (list[idx + 1] && list[idx + 1].photoUrl) {
          try { const pre = new Image(); pre.src = safeImgUrl(list[idx + 1].photoUrl); } catch (_) {}
        }

        root.innerHTML = `
          <div data-action="close-status-backdrop" class="fixed inset-0 z-[75] bg-black flex items-center justify-center p-0 overflow-hidden">
            <div id="status-stage-flat" class="w-full h-full flex items-center justify-center">
              ${buildStatusFaceMarkup(st, idx, list, true)}
            </div>
          </div>
        `;

        const stage = document.getElementById('status-stage-flat');
        if (stage) {
          let sx = 0, sy = 0;
          stage.addEventListener('touchstart', (e) => {
            if (e.touches && e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
          }, { passive: true });
          stage.addEventListener('touchend', (e) => {
            if (!e.changedTouches || !e.changedTouches.length) return;
            const dx = e.changedTouches[0].clientX - sx;
            const dy = e.changedTouches[0].clientY - sy;
            if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) {
              ui.statusViewersOpen = false;
              transitionStatusCube(dx < 0 ? 1 : -1);
            }
          }, { passive: true });
        }

        statusAutoTimer = setTimeout(() => {
          if (!ui.activeStatusId || ui.statusViewersOpen) return;
          transitionStatusCube(1);
        }, 5000);
      }

      function renderLockOverlay() {
        const root = document.getElementById('lock-root');
        if (!root) return;
        if (!ui.vaultLocked || !state) { root.innerHTML = ''; return; }
        root.innerHTML = `
          <div class="fixed inset-0 z-[85] bg-white/95 dark:bg-[#0B0B0D]/95 backdrop-blur-md flex items-center justify-center p-5">
            <div class="w-full max-w-xs text-center space-y-5 animate-fade">
              <div class="w-14 h-14 mx-auto rounded-2xl bg-brand-50 dark:bg-brand-600/20 text-brand-500 flex items-center justify-center">${icon('lock', 'w-7 h-7')}</div>
              <div>
                <h2 class="title-display text-[24px] font-bold">shavlo locked</h2>
                <p class="text-[13.5px] text-muted mt-1">Enter your 4-digit Master Passcode</p>
              </div>
              ${ui.pinError ? `<div class="text-[12.5px] font-medium text-rose-600">${escapeHtml(ui.pinError)}</div>` : ''}
              <form id="unlock-pin-form" class="space-y-3">
                <input name="pin" type="password" inputmode="numeric" maxlength="4" required autofocus placeholder="••••" class="w-full px-4 py-3 rounded-2xl bg-surface dark:bg-zinc-900 text-[22px] tracking-[0.5em] text-center font-bold focus:outline-none focus:ring-2 focus:ring-brand-500/40" />
                <button type="submit" class="w-full py-3 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-[14.5px] font-semibold">Unlock</button>
              </form>

            </div>

      }

          const reqNotif = async () => {

                if (res === 'granted' && typeof subscribeToWebPush === 'function') {

          const drawW = (aspect >= (stageW / stageH) ? stageH * aspect : stageW) * ratio;

      function getDockTabAtPoint(clientX) {
        const nav = document.getElementById('mobile-dock-nav');
        if (!nav) return null;
        const btns = Array.from(nav.querySelectorAll('button[data-nav]'));
        if (!btns.length) return null;
        let best = null, bestDist = Infinity;
        for (let i = 0; i < btns.length; i++) {
          const r = btns[i].getBoundingClientRect();
          if (clientX >= r.left && clientX <= r.right) return btns[i];
          const mid = (r.left + r.right) / 2;

        const lensW = btnRect ? Math.round(btnRect.width) : Math.max(56, Math.round((navRect.width - 32) / 5));
        const lensH = btnRect ? Math.round(btnRect.height) : 56;
        const lensY = btnRect ? Math.round(btnRect.top - navRect.top) : 2;
        const rawX = snap && btnRect ? (btnRect.left - navRect.left) : (clientX - navRect.left - lensW / 2);
        const clampedX = Math.max(0, Math.min(navRect.width - lensW, rawX));
        lens.style.width = lensW + 'px';

        lens.style.transition = snap

      function stopQrScanner() {
        if (_qrScanTimer) { clearInterval(_qrScanTimer); _qrScanTimer = null; }
        _qrScanBusy = false;
        if (_qrScanStream) {
          try { _qrScanStream.getTracks().forEach(t => t.stop()); } catch (e) {}
