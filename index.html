      async function decodeQrFromCanvas(canvas) {
        try {
          if (typeof window.jsQR === 'function') {
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const res = window.jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
            if (res && res.data) return res.data;
          }
        } catch (e) {}
        try {
          if ('BarcodeDetector' in window) {
            const det = new BarcodeDetector({ formats: ['qr_code'] });
            const codes = await det.detect(canvas);
            if (codes && codes[0] && codes[0].rawValue) return codes[0].rawValue;
          }
        } catch (e) {}
        return '';
      }

      async function decodeQrFromFile(file) {
        return new Promise((resolve) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = async () => {
            try {
              const maxDim = 900;
              const scale = Math.min(1, maxDim / Math.max(img.width || 1, img.height || 1));
              const w = Math.max(1, Math.round(img.width * scale));
              const h = Math.max(1, Math.round(img.height * scale));
              const c = document.createElement('canvas');
              c.width = w; c.height = h;
              const ctx = c.getContext('2d', { willReadFrequently: true });
              ctx.drawImage(img, 0, 0, w, h);
              const val = await decodeQrFromCanvas(c);
              URL.revokeObjectURL(url);
              resolve(val || '');
            } catch (e) {
              URL.revokeObjectURL(url);
              resolve('');
            }
          };
          img.onerror = () => { URL.revokeObjectURL(url); resolve(''); };
          img.src = url;
        });
      }

        stopQrScanner();
        const vid = document.getElementById('qr-scan-video');
        const statusEl = document.getElementById('qr-scan-status');
        if (!vid) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          if (statusEl) statusEl.textContent = 'Camera unavailable here — tap Upload QR Photo below.';
          return;
        }
        try {
          _qrScanStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          vid.srcObject = _qrScanStream;
          await vid.play();
          if (statusEl) statusEl.textContent = 'Align the QR code inside the gold frame';
          const c = document.createElement('canvas');
          const ctx = c.getContext('2d', { willReadFrequently: true });
          _qrScanTimer = setInterval(async () => {
            if (_qrScanBusy || ui.modal !== 'qrScanner' || !vid.videoWidth || !vid.videoHeight) return;
            _qrScanBusy = true;
            try {
              const scale = Math.min(1, 640 / Math.max(vid.videoWidth, vid.videoHeight));
              c.width = Math.round(vid.videoWidth * scale);
              c.height = Math.round(vid.videoHeight * scale);
              ctx.drawImage(vid, 0, 0, c.width, c.height);
              const raw = await decodeQrFromCanvas(c);
              if (raw) {
                const fc = extractFriendCodeFromQr(raw);
                if (fc) {
                  stopQrScanner();
                  ui.modal = null;
                  renderModal();
                  sendFriendRequestByCode(fc);
                  return;
                }
              }
            } catch (e) {} finally {
              _qrScanBusy = false;
            }
          }, 160);
        } catch (err) {
          if (statusEl) statusEl.textContent = 'Camera permission denied — tap Upload QR Photo below.';
        }
      }

      function broadcastOpenRoomFast(rm) {

      function stopOpenRoomMic() {
        if (_openRoomStream) {
          try { _openRoomStream.getTracks().forEach(t => t.stop()); } catch (_) {}
          _openRoomStream = null;
        }
        Object.keys(_openRoomPeers).forEach(pid => {
          try { _openRoomPeers[pid].close(); } catch (_) {}
          delete _openRoomPeers[pid];
        });
        document.querySelectorAll('audio[data-or-audio]').forEach(el => el.remove());
      }

      function getOrCreateOpenRoomPc(peerId, roomId) {
        if (_openRoomPeers[peerId]) return _openRoomPeers[peerId];
        const pc = new RTCPeerConnection({ iceServers: getIceServers(), iceCandidatePoolSize: 6, bundlePolicy: 'max-bundle', rtcpMuxPolicy: 'require' });
        _openRoomPeers[peerId] = pc;
        if (_openRoomStream) {
          _openRoomStream.getTracks().forEach(t => pc.addTrack(t, _openRoomStream));
        }
        pc.onicecandidate = (ev) => {
          if (ev.candidate && supaRealtimeChan) {
            try { supaRealtimeChan.send({ type: 'broadcast', event: 'open_room_rtc', payload: { roomId, fromId: activeVaultId, toId: peerId, candidate: ev.candidate } }); } catch (_) {}
          }
        };
        pc.ontrack = (ev) => {
          let aud = document.querySelector(`audio[data-or-audio="${CSS.escape(peerId)}"]`);
          if (!aud) {
            aud = document.createElement('audio');
            aud.setAttribute('data-or-audio', peerId);
            aud.autoplay = true;
            aud.playsInline = true;
            document.body.appendChild(aud);
          }
          if (ev.streams && ev.streams[0]) aud.srcObject = ev.streams[0];
          aud.play().catch(() => {});
        };
        return pc;
      }

      async function handleOpenRoomRtc(p) {
        if (!p || !ui.activeOpenRoomId || p.roomId !== ui.activeOpenRoomId) return;
        if (p.toId && p.toId !== activeVaultId) return;
        if (p.fromId === activeVaultId) return;
        const pc = getOrCreateOpenRoomPc(p.fromId, p.roomId);
        try {
          if (p.hello && _openRoomStream) {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            supaRealtimeChan.send({ type: 'broadcast', event: 'open_room_rtc', payload: { roomId: p.roomId, fromId: activeVaultId, toId: p.fromId, sdp: pc.localDescription } });
          } else if (p.sdp) {
            await pc.setRemoteDescription(new RTCSessionDescription(p.sdp));
            if (p.sdp.type === 'offer') {
              const ans = await pc.createAnswer();
              await pc.setLocalDescription(ans);
              supaRealtimeChan.send({ type: 'broadcast', event: 'open_room_rtc', payload: { roomId: p.roomId, fromId: activeVaultId, toId: p.fromId, sdp: pc.localDescription } });
            }
          } else if (p.candidate) {
            await pc.addIceCandidate(new RTCIceCandidate(p.candidate));
          }
        } catch (_) {}
      }

      function handleGameBroadcast(p) {
        if (!p || !p.fromId || p.fromId === activeVaultId || !_gameSession) return;
        if (p.matchId && _gameSession.matchId && p.matchId !== _gameSession.matchId) return;
        if (p.type === 'state') {
          _gameSession.peerScore = Number(p.score || 0);
          _gameSession.peerName = p.name || 'Friend';
          if (p.snake) _gameSession.peerSnake = p.snake;
          if (p.food && _gameSession.game === 'snake') _gameSession.food = p.food;
          if (p.garbage && _gameSession.game === 'tetris' && _gameSession.addGarbage) {
            _gameSession.addGarbage(Number(p.garbage));
          }
          updateGameHud();
        } else if (p.type === 'over') {
          _gameSession.peerScore = Number(p.score || 0);
          _gameSession.peerOver = true;
          updateGameHud();
          showToast(`${p.name || 'Friend'} finished with ${p.score || 0} pts`);
        }

        if (!_gameSession) return;

        const prEl = document.getElementById('game-peer-score');
        if (scEl) scEl.textContent = String(_gameSession.score || 0);
        if (prEl) prEl.textContent = _gameSession.mode === 'multi'
          ? `${_gameSession.peerName || 'Peer'}: ${_gameSession.peerScore || 0}${_gameSession.peerOver ? ' (Done)' : ''}`
          : 'Solo Mode';
      }

      function handleGameControl(ctrl) {
        if (!_gameSession || !_gameSession.onCtrl) return;
        _gameSession.onCtrl(ctrl);
      }

      function launchShavloGame(game, mode, roomId, matchId) {
        stopShavloGame();
        const root = document.getElementById('game-root');
        if (!root) return;
        const isTetris = game !== 'snake';
        _gameSession = { game: isTetris ? 'tetris' : 'snake', mode, roomId, matchId, score: 0, peerScore: 0, peerName: 'Waiting...' };

        root.innerHTML = `
          <div class="fixed inset-0 z-[80] bg-[#09090C]/95 backdrop-blur-2xl text-white flex flex-col items-center justify-between p-4 select-none" style="padding-top:max(1rem,env(safe-area-inset-top)); padding-bottom:max(1.25rem,env(safe-area-inset-bottom));">
            <div class="w-full max-w-sm flex items-center justify-between gap-2">
              <div>
                <div class="title-display text-[19px] font-extrabold tracking-tight">${isTetris ? 'Tetris' : 'Snake'} <span class="text-[#C6A76D]">•</span></div>
                <div id="game-peer-score" class="text-[11.5px] font-semibold text-white/70">${mode === 'multi' ? 'Live Multiplayer • Waiting...' : 'Solo Mode'}</div>
              </div>
              <div class="flex items-center gap-2">
                <div class="px-3.5 py-1.5 rounded-full bg-white/10 border border-[#C6A76D]/40 text-[13px] font-extrabold tabular-nums">
                  <span id="game-my-score">0</span> pts
                </div>
                <button type="button" data-action="close-game" class="w-9 h-9 rounded-full bg-white/15 hover:bg-rose-500 text-white flex items-center justify-center font-bold">✕</button>
              </div>
            </div>
            <div class="relative flex items-center justify-center my-2">
              <canvas id="shavlo-game-canvas" width="${isTetris ? 240 : 306}" height="${isTetris ? 440 : 306}" class="rounded-3xl bg-[#111116] border border-white/15 shadow-2xl"></canvas>
            </div>
            ${isTetris ? `
              <div class="w-full max-w-sm grid grid-cols-5 gap-2">
                <button type="button" data-action="game-ctrl" data-ctrl="left" class="h-12 rounded-2xl bg-white/15 active:scale-90 text-[18px] font-bold">◀</button>
                <button type="button" data-action="game-ctrl" data-ctrl="down" class="h-12 rounded-2xl bg-white/15 active:scale-90 text-[18px] font-bold">▼</button>
                <button type="button" data-action="game-ctrl" data-ctrl="right" class="h-12 rounded-2xl bg-white/15 active:scale-90 text-[18px] font-bold">▶</button>
                <button type="button" data-action="game-ctrl" data-ctrl="rot" class="h-12 rounded-2xl bg-[#C6A76D] text-[#09090C] active:scale-90 text-[18px] font-bold">↻</button>
                <button type="button" data-action="game-ctrl" data-ctrl="drop" class="h-12 rounded-2xl bg-white text-[#09090C] active:scale-90 text-[15px] font-extrabold">⤓</button>
              </div>
            ` : `
              <div class="w-full max-w-[220px] grid grid-cols-3 gap-2">
                <div></div>
                <button type="button" data-action="game-ctrl" data-ctrl="up" class="h-11 rounded-2xl bg-white/15 active:scale-90 text-[17px] font-bold">▲</button>
                <div></div>
                <button type="button" data-action="game-ctrl" data-ctrl="left" class="h-11 rounded-2xl bg-white/15 active:scale-90 text-[17px] font-bold">◀</button>
                <button type="button" data-action="game-ctrl" data-ctrl="down" class="h-11 rounded-2xl bg-white/15 active:scale-90 text-[17px] font-bold">▼</button>
                <button type="button" data-action="game-ctrl" data-ctrl="right" class="h-11 rounded-2xl bg-white/15 active:scale-90 text-[17px] font-bold">▶</button>
              </div>
            `}
          </div>
        `;

        const canvas = document.getElementById('shavlo-game-canvas');
        const ctx = canvas.getContext('2d');
        const myName = (state && state.userProfile && state.userProfile.name) || 'Player';

        const sendLive = (extra) => {
          if (mode !== 'multi' || !roomId) return;
          sendRoomBroadcast(roomId, 'game_fast', Object.assign({
            matchId, fromId: activeVaultId, name: myName, type: 'state', score: _gameSession ? _gameSession.score : 0
          }, extra || {}));
        };

        if (isTetris) {
          const W = 10, H = 20, SZ = 22;
          canvas.width = W * SZ; canvas.height = H * SZ;
          const board = Array.from({ length: H }, () => Array(W).fill(0));
          const COLORS = ['', '#FAFAFC', '#C6A76D', '#34C759', '#38BDF8', '#FB7185', '#A78BFA', '#FBBF24'];
          const SHAPES = [
            [[1,1,1,1]],
            [[2,2],[2,2]],
            [[0,3,0],[3,3,3]],
            [[4,0,0],[4,4,4]],
            [[0,0,5],[5,5,5]],
            [[0,6,6],[6,6,0]],
            [[7,7,0],[0,7,7]]
          ];
          const spawn = () => {
            const s = SHAPES[Math.floor(Math.random() * SHAPES.length)].map(r => [...r]);
            return { m: s, x: Math.floor((W - s[0].length) / 2), y: 0 };
          };
          let cur = spawn();
          const collide = (m, ox, oy) => {
            for (let y = 0; y < m.length; y++) for (let x = 0; x < m[y].length; x++) {
              if (!m[y][x]) continue;
              const nx = ox + x, ny = oy + y;
              if (nx < 0 || nx >= W || ny >= H || (ny >= 0 && board[ny][nx])) return true;
            }
            return false;
          };
          const merge = () => {
            cur.m.forEach((r, y) => r.forEach((v, x) => { if (v && cur.y + y >= 0) board[cur.y + y][cur.x + x] = v; }));
            let cleared = 0;
            for (let y = H - 1; y >= 0; y--) {
              if (board[y].every(v => v)) {
                board.splice(y, 1);
                board.unshift(Array(W).fill(0));
                cleared++; y++;
              }
            }
            if (cleared > 0) {
              _gameSession.score += cleared * 100 * cleared;
              updateGameHud();
              sendLive({ garbage: cleared >= 2 ? cleared - 1 : 0 });
            }
            cur = spawn();
            if (collide(cur.m, cur.x, cur.y)) {
              showToast(`Game Over! Score: ${_gameSession.score}`);
              stopShavloGame();
            }
          };
          _gameSession.addGarbage = (n) => {
            for (let i = 0; i < n; i++) {
              board.shift();
              const row = Array(W).fill(2);
              row[Math.floor(Math.random() * W)] = 0;
              board.push(row);
            }
          };
          const draw = () => {
            ctx.fillStyle = '#0B0B0F'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            for (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(x * SZ, 0); ctx.lineTo(x * SZ, canvas.height); ctx.stroke(); }
            for (let y = 0; y <= H; y++) { ctx.beginPath(); ctx.moveTo(0, y * SZ); ctx.lineTo(canvas.width, y * SZ); ctx.stroke(); }
            const drawCell = (x, y, v) => {
              ctx.fillStyle = COLORS[v] || '#C6A76D';
              ctx.fillRect(x * SZ + 1, y * SZ + 1, SZ - 2, SZ - 2);
            };
            board.forEach((r, y) => r.forEach((v, x) => { if (v) drawCell(x, y, v); }));
            cur.m.forEach((r, y) => r.forEach((v, x) => { if (v && cur.y + y >= 0) drawCell(cur.x + x, cur.y + y, v); }));
          };
          _gameSession.onCtrl = (c) => {
            if (c === 'left' && !collide(cur.m, cur.x - 1, cur.y)) cur.x--;
            else if (c === 'right' && !collide(cur.m, cur.x + 1, cur.y)) cur.x++;
            else if (c === 'down') { if (!collide(cur.m, cur.x, cur.y + 1)) cur.y++; else merge(); }
            else if (c === 'drop') { while (!collide(cur.m, cur.x, cur.y + 1)) cur.y++; merge(); }
            else if (c === 'rot') {
              const rot = cur.m[0].map((_, i) => cur.m.map(r => r[i]).reverse());
              if (!collide(rot, cur.x, cur.y)) cur.m = rot;
            }
            if (_gameSession) draw();
          };
          draw();
          _gameTimer = setInterval(() => {
            if (!_gameSession) return;
            if (!collide(cur.m, cur.x, cur.y + 1)) cur.y++; else merge();
            if (_gameSession) { draw(); sendLive(); }
          }, 480);
        } else {
          const G = 18, SZ = 17;
          canvas.width = G * SZ; canvas.height = G * SZ;
          let snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
          let dir = { x: 1, y: 0 }, nextDir = { x: 1, y: 0 };
          _gameSession.food = { x: 13, y: 9 };
          const randFood = () => ({ x: Math.floor(Math.random() * G), y: Math.floor(Math.random() * G) });
          _gameSession.onCtrl = (c) => {
            if (c === 'up' && dir.y === 0) nextDir = { x: 0, y: -1 };
            else if (c === 'down' && dir.y === 0) nextDir = { x: 0, y: 1 };
            else if (c === 'left' && dir.x === 0) nextDir = { x: -1, y: 0 };
            else if (c === 'right' && dir.x === 0) nextDir = { x: 1, y: 0 };
          };
          const drawSnake = () => {
            ctx.fillStyle = '#0B0B0F'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const f = _gameSession.food || { x: 13, y: 9 };
            ctx.fillStyle = '#C6A76D';
            ctx.beginPath(); ctx.arc(f.x * SZ + SZ / 2, f.y * SZ + SZ / 2, SZ * 0.38, 0, Math.PI * 2); ctx.fill();
            if (Array.isArray(_gameSession.peerSnake)) {
              _gameSession.peerSnake.forEach((s, idx) => {
                ctx.fillStyle = idx === 0 ? '#C6A76D' : 'rgba(198,167,109,0.65)';
                ctx.fillRect(s.x * SZ + 1, s.y * SZ + 1, SZ - 2, SZ - 2);
              });
            }
            snake.forEach((s, idx) => {
              ctx.fillStyle = idx === 0 ? '#FFFFFF' : '#D4D4D8';
              ctx.fillRect(s.x * SZ + 1, s.y * SZ + 1, SZ - 2, SZ - 2);
            });
          };
          drawSnake();
          _gameTimer = setInterval(() => {
            if (!_gameSession) return;
            dir = nextDir;
            const head = { x: (snake[0].x + dir.x + G) % G, y: (snake[0].y + dir.y + G) % G };
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
              showToast(`Game Over! Score: ${_gameSession.score}`);
              stopShavloGame();
              return;
            }
            snake.unshift(head);
            const f = _gameSession.food;
            if (f && head.x === f.x && head.y === f.y) {
              _gameSession.score += 10;
              _gameSession.food = randFood();
              updateGameHud();
              sendLive({ snake, food: _gameSession.food });
            } else {
              snake.pop();
              sendLive({ snake });
            }
            drawSnake();
          }, 150);
        }
      }

      document.addEventListener('keydown', (e) => {
        if (!_gameSession) return;
        if (e.key === 'ArrowLeft' || e.key === 'a') { e.preventDefault(); handleGameControl('left'); }
        else if (e.key === 'ArrowRight' || e.key === 'd') { e.preventDefault(); handleGameControl('right'); }
        else if (e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); handleGameControl(_gameSession.game === 'tetris' ? 'rot' : 'up'); }
        else if (e.key === 'ArrowDown' || e.key === 's') { e.preventDefault(); handleGameControl('down'); }
        else if (e.key === ' ') { e.preventDefault(); handleGameControl('drop'); }
      });

    })();
  </script>
</body>
</html>
